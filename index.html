      <div class="stack">
        <button class="btn btn-primary btn-sm" onclick="pickFolder()">Add a folder as a dataset</button>
        <button class="btn btn-outline btn-sm" onclick="newProject()">New project</button>
        <button class="btn btn-outline btn-sm" onclick="newDataset()">New empty dataset</button>
      </div>
      <p class="note" style="margin-top:.6rem">Select a dataset in the library panel to open it.</p>
    </div>`;
}

/* ── Dataset panel ───────────────────────────────────────────────────────── */
function datasetPanelHtml(ds) {
  const imgs = state.images;
  const withM = imgs.filter(r => r.m);
  const stat = key => {
    const v = withM.map(r => r.m[key]).filter(x => x != null && isFinite(x));
    if (!v.length) return null;
    const mean = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
    return { mean, sd, min: Math.min(...v), max: Math.max(...v) };
  };
  const rows = [['L', 'L*'], ['a', 'a*'], ['b', 'b*'], ['C', 'C*'], ['cct', 'CCT (K)'], ['colourfulness', 'colourfulness']]
    .map(([k, lab]) => { const s = stat(k); return s ? `<tr><td>${lab}</td><td class="num">${fmtNum(s.mean, k === 'cct' ? 0 : 2)}</td><td class="num">${fmtNum(s.sd, k === 'cct' ? 0 : 2)}</td></tr>` : ''; }).join('');

  const times = imgs.map(r => r.dateMs).filter(Boolean).sort((a, b) => a - b);
  const bytes = imgs.reduce((s, r) => s + (r.size || 0), 0);
  const edited = imgs.filter(hasEdits).length;
  const flags = { pick: 0, reject: 0 };
  imgs.forEach(r => { if (flags[r.flag] != null) flags[r.flag]++; });
  const dims = new Set(imgs.map(r => `${r.w}×${r.h}`));

  /* Read-only. Filing is the + on the dataset's row in the library, and the
     hub. Three places to change the same relation is how two of them end up
     disagreeing; this one says where the dataset sits and gets out of the way. */
  const inProjs = (ds.projectIds || []).map(id => prById(id)).filter(Boolean);
  const projChips = inProjs.length
    ? inProjs.map(p => `<span class="pchip"><span style="color:${p.colour}">■</span> ${escapeHtml(p.name)}</span>`).join(' ') +
      ` <a class="note" href="${HUB_URL}" title="Projects are managed at the hub">manage &rsaquo;</a>`
    : `<span class="note">Not in any project — use <b>+</b> on its row in the library, or
       <a href="${HUB_URL}">the hub</a>.</span>`;

  return `
    <div class="insp-sec">
      <div class="h">Dataset</div>
      <input type="text" value="${escapeHtml(ds.name)}" style="width:100%;font-weight:600"
             onchange="renameDataset('${ds.id}',this.value)" title="Dataset name">
      <textarea rows="2" placeholder="Notes about this dataset…" style="margin-top:.4rem"
                onchange="noteDataset('${ds.id}',this.value)">${escapeHtml(ds.note || '')}</textarea>
      <button class="btn btn-ghost btn-sm" style="margin-top:.35rem"
              onclick="editDatasetDialog('${ds.id}')">Edit dataset &amp; session metadata…</button>
      <dl class="kv" style="margin-top:.5rem">
        <dt>Images</dt><dd>${imgs.length}${state.view.length !== imgs.length ? ` <span style="color:var(--text-muted)">(${state.view.length} shown)</span>` : ''}</dd>
        <dt>On disk</dt><dd>${fmtBytes(bytes)}</dd>
        <dt>Dimensions</dt><dd>${dims.size === 1 ? [...dims][0] : `${dims.size} different sizes`}</dd>
        <dt>Capture span</dt><dd>${times.length ? `${fmtDate(new Date(times[0]))}<br>→ ${fmtDate(new Date(times[times.length - 1]))}` : 'no EXIF times'}</dd>
        ${ds.solMin != null ? `<dt>Solar elevation</dt><dd>${ds.solMin.toFixed(1)}° → ${ds.solMax.toFixed(1)}° <span style="color:var(--text-muted)">(${ds.solN} frame${ds.solN === 1 ? '' : 's'})</span></dd>` : ''}
        <dt>Curated</dt><dd>${flags.pick} picked · ${flags.reject} rejected${edited ? ` · <b style="color:var(--warning-border)">${edited} edited</b>` : ''}</dd>
      </dl>
    </div>

    ${dsMetaPanelHtml(ds)}

    <div class="insp-sec">
      <div class="h">Projects</div>
      ${projChips}
    </div>

    ${solarPanelHtml(ds)}

    ${rows ? `<details class="insp-sec"${_op('dscolour')} ontoggle="inspToggle('dscolour',this.open)"><summary>Colour summary</summary>
      <table class="mini"><thead><tr><th></th><th style="text-align:right">mean</th><th style="text-align:right">sd</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <p class="note">Thumbnail-level, unweighted, across ${withM.length} image${withM.length === 1 ? '' : 's'}. For measurement, run the Analyzer.</p>
    </details>` : ''}

    <div class="insp-sec">
      <div class="h">Dataset actions</div>
      <div class="stack">
        <button class="btn btn-outline btn-sm" onclick="exportDataset()">Export dataset…</button>
        <button class="btn btn-outline btn-sm" onclick="exportCsv(state.images,'dataset')">Metadata CSV</button>
        <button class="btn btn-outline btn-sm" onclick="sendToAnalyzer()">Open in Batch Image Analyzer…</button>
        <button class="btn btn-ghost btn-sm" onclick="duplicateDataset('${ds.id}')">Duplicate dataset (copies the images)</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteDataset('${ds.id}')">Delete dataset…</button>
      </div>
    </div>`;
}

/* ── Single image ────────────────────────────────────────────────────────── */
function singleImageHtml(r, inLightbox) {
  const ex = r.exif || {}, m = r.m;
  const exRows = [
    ['Camera', [ex.make, ex.model].filter(Boolean).join(' ')],
    ['Lens', ex.lens],
    ['Captured', r.dateMs ? fmtDate(new Date(r.dateMs)) : null],
    ['Exposure', ex.exposure ? (ex.exposure >= 1 ? ex.exposure + ' s' : '1/' + Math.round(1 / ex.exposure) + ' s') : null],
    ['Aperture', ex.fnumber ? 'f/' + ex.fnumber : null],
    ['ISO', ex.iso],
    ['Focal', ex.focal ? ex.focal + ' mm' + (ex.focal35 ? ` (${ex.focal35} eq)` : '') : null],
    ['Exp. bias', ex.expbias != null && ex.expbias !== 0 ? (ex.expbias > 0 ? '+' : '') + ex.expbias + ' EV' : null],
    ['White bal.', ex.wb],
    ['GPS', (ex.gps_lat != null) ? `${ex.gps_lat}, ${ex.gps_lon}${ex.gps_alt != null ? ` · ${ex.gps_alt} m` : ''}` : null],
    ['Software', ex.software],
  ].filter(x => x[1] != null && x[1] !== '')
   .map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join('');

  const mRows = m ? [
    ['mean RGB', `${Math.round(m.R)}, ${Math.round(m.G)}, ${Math.round(m.B)} <span style="display:inline-block;width:9px;height:9px;background:${m.hex};border:1px solid var(--border);vertical-align:middle"></span>`],
    ['L* a* b*', `${fmtNum(m.L, 1)}, ${fmtNum(m.a, 1)}, ${fmtNum(m.b, 1)}`],
    ['C* / hue', `${fmtNum(m.C, 1)} / ${fmtNum(m.H, 0)}°`],
    ['sat / val', `${fmtNum(m.S, 1)} / ${fmtNum(m.V, 1)}`],
    ['colourfulness', fmtNum(m.colourfulness, 1)],
    ['CCT / duv', `${m.cct} K / ${fmtNum(m.duv, 4)}`],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') : '';

  return `
    <div class="insp-sec">
      ${inLightbox ? '' : '<img id="inspThumb" class="insp-img" alt="">'}
      <div style="margin-top:.45rem">
        <input type="text" value="${escapeHtml(r.name)}" style="width:100%;font-family:monospace;font-size:.76rem"
               onchange="renameOne('${r.id}',this.value)" title="Name used in this library and on export">
      </div>
      <dl class="kv" style="margin-top:.45rem">
        <dt>Size</dt><dd>${r.w}×${r.h} · ${fmtBytes(r.size)} · ${extOf(r.name).toUpperCase()}</dd>
        ${r.origName !== r.name ? `<dt>Original</dt><dd style="font-family:monospace;font-size:.7rem">${escapeHtml(r.origName)}</dd>` : ''}
        ${r.folder ? `<dt>Folder</dt><dd style="font-size:.7rem">${escapeHtml(r.folder)}</dd>` : ''}
        <dt>Added</dt><dd>${fmtDate(new Date(r.added))}</dd>
      </dl>
      ${hasEdits(r) ? `<div class="warn" style="margin-top:.5rem"><b>Edited.</b> ${escapeHtml(editSummary(r.edits))}<br>
        The stored original is untouched; this recipe is replayed on view and on export.</div>` : ''}
      <div class="row" style="margin-top:.5rem">
        ${inLightbox ? '' : `<button class="btn btn-outline btn-sm" onclick="openLightbox('${r.id}')">Open full size</button>`}
        <button class="btn btn-ghost btn-sm" onclick="useAsColourReference('${r.id}')" title="Sort the dataset by colour distance from this image">Use as colour reference</button>
      </div>
    </div>
    ${r.sol ? `<div class="insp-sec"><div class="h">Solar geometry</div><dl class="kv">
        <dt>Elevation</dt><dd>${fmtNum(r.sol.el, 2)}°</dd>
        <dt>Azimuth</dt><dd>${fmtNum(r.sol.az, 2)}°${r.exif && r.exif.gps_lat != null ? '' : ' <span style="color:var(--text-muted)">(site coords)</span>'}</dd>
        <dt>Air mass</dt><dd>${r.sol.am != null ? fmtNum(r.sol.am, 3) : '— <span style="color:var(--text-muted)">sun below horizon</span>'}</dd>
        <dt>Instant</dt><dd>${new Date(r.sol.ts).toISOString().replace('T', ' ').slice(0, 19)} UTC</dd>
      </dl><p class="note">Computed from this frame's EXIF time in the dataset's declared timezone.
      The azimuth is a true bearing for the SUN; it says nothing about where the camera was pointing.</p></div>` : ''}
    ${exRows ? `<details class="insp-sec"${_op('exif')} ontoggle="inspToggle('exif',this.open)"><summary>EXIF</summary><dl class="kv">${exRows}</dl></details>`

/* ── Several images ──────────────────────────────────────────────────────── */
function multiImageHtml(recs) {
  const uniq = (arr) => Array.from(new Set(arr));
  const dims = uniq(recs.map(r => `${r.w}×${r.h}`));
  const fmts = uniq(recs.map(r => extOf(r.name).toUpperCase()));
  const cams = uniq(recs.map(r => [r.exif && r.exif.make, r.exif && r.exif.model].filter(Boolean).join(' ')).filter(Boolean));
  const times = recs.map(r => r.dateMs).filter(Boolean).sort((a, b) => a - b);
  const bytes = recs.reduce((s, r) => s + r.size, 0);
  const edited = recs.filter(hasEdits).length;
  const withM = recs.filter(r => r.m);
  const mstat = k => {
    const v = withM.map(r => r.m[k]).filter(x => x != null && isFinite(x));
    if (!v.length) return '—';
    const mean = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
    return `${fmtNum(mean, k === 'cct' ? 0 : 1)} ± ${fmtNum(sd, k === 'cct' ? 0 : 1)}`;
  };
  return `
    <div class="insp-sec">
      <img id="inspThumb" class="insp-img" alt="">
      <dl class="kv" style="margin-top:.45rem">
        <dt>Selected</dt><dd>${recs.length} images · ${fmtBytes(bytes)}</dd>
        <dt>Dimensions</dt><dd>${dims.length === 1 ? dims[0] : dims.length + ' different'}</dd>
        <dt>Format</dt><dd>${fmts.join(', ')}</dd>
        <dt>Camera</dt><dd>${cams.length ? (cams.length === 1 ? escapeHtml(cams[0]) : cams.length + ' different') : '—'}</dd>
        <dt>Capture</dt><dd>${times.length ? `${fmtDate(new Date(times[0]))}<br>→ ${fmtDate(new Date(times[times.length - 1]))}` : 'no EXIF times'}</dd>
        ${edited ? `<dt>Edited</dt><dd><b style="color:var(--warning-border)">${edited}</b></dd>` : ''}
      </dl>
    </div>
    <details class="insp-sec"${_op('colour')} ontoggle="inspToggle('colour',this.open)"><summary>Colour across the selection</summary>
      <dl class="kv">
        <dt>L*</dt><dd>${mstat('L')}</dd>
        <dt>a*</dt><dd>${mstat('a')}</dd>
        <dt>b*</dt><dd>${mstat('b')}</dd>
        <dt>C*</dt><dd>${mstat('C')}</dd>
        <dt>CCT</dt><dd>${mstat('cct')} K</dd>
      </dl>
      <p class="note">mean ± sd, thumbnail-level.</p>
    </details>`;
}

function previewRename() {
  const recs = targetRecs();
  const pat = $('renamePat').value || '{name}';
  const start = parseInt($('renameStart').value, 10) || 1;
  const names = applyRenamePattern(recs, pat, start);
  $('renamePreview').innerHTML = names.length
    ? `<code>${escapeHtml(names[0])}</code>${names.length > 1 ? ` … <code>${escapeHtml(names[names.length - 1])}</code>` : ''}`
    : '';
}
async function doRename() {
  const recs = targetRecs();
  if (!recs.length) return;
  const names = applyRenamePattern(recs, $('renamePat').value || '{name}', parseInt($('renameStart').value, 10) || 1);
  const seen = new Set();
  recs.forEach((r, i) => {
    let n = names[i], k = 2;
    while (seen.has(n.toLowerCase())) { n = stemOf(names[i]) + '_' + (k++) + '.' + extOf(names[i]); }
    seen.add(n.toLowerCase());
    r.name = n;
  });
  await saveImages(recs);
  render();
  setStatus(`Renamed ${recs.length} file${recs.length === 1 ? '' : 's'} in the library. Files on disk are untouched.`, 'success', 5000);
}
async function addTag(t) {
  t = (t || '').trim();
  if (!t) return;
  const recs = targetRecs();
  recs.forEach(r => { r.tags = r.tags || []; if (!r.tags.includes(t)) r.tags.push(t); });
  await saveImages(recs);
  recs.forEach(r => repaintTile(r.id));
  renderInspector();
}
async function removeTag(t) {
  const recs = targetRecs();
  recs.forEach(r => { r.tags = (r.tags || []).filter(x => x !== t); });
  await saveImages(recs);
  recs.forEach(r => repaintTile(r.id));
  renderInspector();
}
function useAsColourReference(id) {
  const r = state.images.find(i => i.id === id);
  if (!r || !r.m) return;
  state.refLab = [r.m.L, r.m.a, r.m.b];
  state.sort = 'dist';
  syncControls(); computeView(); renderGrid(); paintSelection();
  setStatus(`Sorted by CIEDE2000 colour distance from <b>${escapeHtml(r.name)}</b>.`, 'success', 5000);
}

/* The Organise panel's copy/move buttons and the selection menu are the same
   operation, so they share one implementation — see sendSelectionTo(). */
async function moveToDataset(isMove) {
  const recs = targetRecs();
  const targetId = $('moveTarget') ? $('moveTarget').value : null;
  if (!recs.length || !targetId) return;
  await sendSelectionTo(recs, targetId, isMove);
}

async function renameOne(id, name) {
  const r = state.images.find(i => i.id === id);
  if (!r || !name.trim()) return;
  r.name = name.trim();
  await saveImages([r]);
  repaintTile(id);
}


/* ═══════════════════════════════════════════════════════════════════════════
   EXPORT
   ---------------------------------------------------------------------------
   Two paths, and the fast one matters. When an image has no edits and the
   format is being kept, the ORIGINAL BYTES are copied straight into the ZIP:
   no decode, no re-encode, no generation loss, EXIF intact. Only images that
   actually need new pixels go through the canvas.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Backups written before the rename carry the old marker. Restore accepts
   both, because a backup is the one artefact whose whole job is to still work
   later — refusing to read your own file because the tool changed its name
   would be the worst possible time to be pedantic. */
const BACKUP_FORMAT  = 'vom-manager-library';
const BACKUP_FORMATS = ['vom-manager-library', 'vom-viewer-library'];

const exportOpts = {
  scope: 'sel', format: 'orig', quality: 0.92, maxDim: null,
  applyEdits: true, keepExif: true, suffixEdited: true,

function openExportDialog(scope) {

function scopeRecs(scope) {
  switch (scope) {
    case 'sel':       { const s = selectedRecs(); return s.length ? s : state.view; }
    case 'view':      return state.view;
    case 'pick':      return state.images.filter(r => r.flag === 'pick');
    case 'notreject': return state.images.filter(r => r.flag !== 'reject');
    default:          return state.images;
  }
}
function refreshExportDialog() {
  const recs = scopeRecs(exportOpts.scope);
  const cnt = $('expCount'); if (cnt) cnt.textContent = recs.length;
  const qr = $('expQualityRow');
  if (qr) qr.style.display = (exportOpts.format === 'image/jpeg' || exportOpts.format === 'image/webp') ? '' : 'none';
  const dest = $('expDestRow');
  if (dest) dest.innerHTML = outputDestHtml();
  const note = $('expNote');
  if (!note) return;

  const edited = recs.filter(hasEdits);
  const reencoding = exportOpts.format !== 'orig' || exportOpts.maxDim ||
                     (exportOpts.applyEdits && edited.length);
  const bits = [];
  if (!reencoding) {
    bits.push(`<div class="ok-note"><b>Byte-for-byte copies.</b> No decoding, no re-encoding, EXIF and colour
      exactly as imported.</div>`);
  } else {
    bits.push(`<div class="warn"><b>Re-encoding.</b> These files will be decoded and written again, so they are
      no longer the camera's bytes. For colour work, prefer exporting originals and doing the analysis on those.</div>`);
  }
  if (edited.length) {
    const geo = edited.filter(r => editsChangeGeometry(r.edits)).length;
    const col = edited.filter(r => editsChangeColour(r.edits)).length;
    bits.push(`<div class="${exportOpts.applyEdits ? 'danger-note' : 'note'}" style="margin-top:.4rem">
      <b>${edited.length} of these carry edits</b>${col ? ` · ${col} with colour changes` : ''}${geo ? ` · ${geo} with geometry changes` : ''}.
      ${exportOpts.applyEdits
        ? 'The exported files will contain the edited pixels. Anything measured from them measures your edit, not the camera.'
        : 'Edits will be ignored and the originals exported instead.'}</div>`);
  }
  if (exportOpts.keepExif && (exportOpts.format === 'image/jpeg' || exportOpts.format === 'image/png')) {
    const geo = exportOpts.maxDim ? recs.length
              : (exportOpts.applyEdits ? edited.filter(r => editsChangeGeometry(r.edits)).length : 0);
    const kind = exportOpts.format === 'image/png' ? 'PNG' : 'JPEG';
    bits.push(geo
      ? `<div class="note" style="margin-top:.4rem"><b>${kind} keeps GPS and capture time.</b> ${geo} file(s) change
         shape, so those carry a rebuilt EXIF block — position, instant, camera — with the pixel-dimension and
         orientation tags left out rather than left describing pixels that no longer exist.</div>`
      : `<div class="ok-note" style="margin-top:.4rem"><b>${kind} keeps the full EXIF block</b>, GPS included, carried
         across from the original file unchanged.</div>`);
  } else if (exportOpts.keepExif && exportOpts.format === 'image/webp') {
    bits.push(`<div class="note" style="margin-top:.4rem">WebP carries no EXIF here — export as JPEG or PNG if the
      position and capture time need to travel with the pixels.</div>`);
  }
  note.innerHTML = bits.join('');
}

async function runExport() {
  const recs = scopeRecs(exportOpts.scope);
  if (!recs.length) { setStatus('Nothing to export.', 'error', 4000); return; }
  const ds = dsById(state.curDs);
  state.job = { cancel: false };
  setStatus(`Preparing ${recs.length} file${recs.length === 1 ? '' : 's'}…`, 'progress');

  const files = [];
  const used = new Set();
  const uniqueName = base => {
    let n = base, i = 2;
    while (used.has(n.toLowerCase())) { n = stemOf(base) + '_' + (i++) + '.' + extOf(base); }
    used.add(n.toLowerCase());
    return n;
  };

  let bytes = 0;
  for (let i = 0; i < recs.length; i++) {
    if (state.job.cancel) break;
    const r = recs[i];
    const useEdits = exportOpts.applyEdits && hasEdits(r);
    const needsRender = exportOpts.format !== 'orig' || exportOpts.maxDim || useEdits;

    let data = null, ext = extOf(r.name) || 'jpg';
    try {
      if (!needsRender) {
        data = await originalBytes(r.id);
        ext = extOf(r.origName) || ext;
      } else {
        const bmp = await originalBitmap(r.id);
        if (!bmp) continue;
        const cv = renderEdits(bmp, useEdits ? r.edits : null, { maxDim: exportOpts.maxDim });
        const type = exportOpts.format === 'orig'
          ? (r.type && r.type.startsWith('image/') && r.type !== 'image/gif' ? r.type : 'image/jpeg')
          : exportOpts.format;
        const blob = await canvasToBlob(cv, type, exportOpts.quality);
        data = new Uint8Array(await blob.arrayBuffer());
        ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[type] || 'jpg';

        /* EXIF now survives into PNG as well as JPEG — a PNG export that lost
           the GPS fix and the capture instant would no longer be the same
           measurement, and the Image Cutter already keeps both.

           What survives depends on whether the pixels still match the original
           geometry. An untouched frame carries its whole original TIFF block
           across. A cropped, rotated or resized one gets a REBUILT block:
           position, instant and camera identity, with every dimensional and
           orientation tag deliberately absent rather than silently wrong. */
        const geoChanged = (useEdits && editsChangeGeometry(r.edits)) || !!exportOpts.maxDim;
        if (exportOpts.keepExif && (type === 'image/jpeg' || type === 'image/png')) {
          let tiff = null;
          if (!geoChanged) {
            const orig = await originalBytes(r.id);
            if (orig) tiff = exifTiffBlock(orig);
          }
          if (!tiff) tiff = buildExifTiff(r.exif);
          if (tiff) data = (type === 'image/jpeg') ? jpegSetExif(data, tiff) : pngSetExif(data, tiff);
        }
      }
    } catch (e) { continue; }
    if (!data) continue;

    let base = stemOf(r.name);
    if (useEdits && exportOpts.suffixEdited) base += '_edit';
    files.push({ name: uniqueName(base + '.' + ext), data });
    bytes += data.length;

    setStatus(`Preparing ${i + 1} / ${recs.length}… ${fmtBytes(bytes)}`, 'progress');
    setProgress((i + 1) / recs.length);
    if (i % 2 === 0) await sleep(0);
  }
  state.job = null;
  if (!files.length) { setStatus('Nothing could be exported.', 'error', 5000); return; }

  // A manifest travels with the images so an export is self-describing later.
  files.push({ name: '_manifest.csv', data: new TextEncoder().encode(csvFor(recs)) });

  setStatus('Building ZIP…', 'progress');
  await sleep(10);
  const zip = buildZipStore(files);
  const dsName = (ds ? ds.name : 'images').replace(/[^\w\-]+/g, '-').replace(/^-|-$/g, '');
  const where = await deliverOutput(zip, `${dsName}.zip`, {
    tool: 'manager',
    params: { scope: exportOpts.scope, format: exportOpts.format,
              maxDim: exportOpts.maxDim || 'unchanged',
              applyEdits: exportOpts.applyEdits, keepExif: exportOpts.keepExif,
              images: files.length - 1 },
  });
  setStatus(`Exported ${files.length - 1} file${files.length === 2 ? '' : 's'} (${fmtBytes(bytes)}) plus a manifest — ${where.join(' and ')}.`, 'success', 8000);
}

/* ── Metadata CSV ────────────────────────────────────────────────────────── */
function csvFor(recs) {
  const ds = dsById(state.curDs);
  const solCfg = solarSettings(ds) || { tz: '', clockOffH: 0 };
  const cols = ['filename', 'original_filename', 'dataset', 'source_folder', 'width', 'height', 'megapixels',
    'aspect_ratio', 'file_bytes', 'format', 'date_taken', 'date_added', 'camera_make', 'camera_model', 'lens',
    'exposure_s', 'f_number', 'iso', 'focal_mm', 'focal_35mm_eq', 'exposure_bias_ev', 'white_balance',
    'gps_lat', 'gps_lon', 'gps_alt_m', 'orientation', 'software',
    'rating', 'flag', 'tags', 'note',
    'mean_R', 'mean_G', 'mean_B', 'mean_hex', 'mean_L', 'mean_a', 'mean_b', 'mean_C', 'mean_H',
    'mean_S', 'mean_V', 'colourfulness', 'cct_K', 'duv',
    'solar_elevation_deg', 'solar_azimuth_deg', 'air_mass', 'solar_instant_utc', 'solar_timezone', 'clock_offset_h',
    'edited', 'edit_recipe',
    /* Dataset-level session metadata, repeated on every row. Redundant in a
       database sense, and deliberately so: a CSV that leaves the site and the
       conditions behind is a column of numbers with no field notes attached,
       and these files get read years later. Prefixed ds_ so they sort together
       and never collide with a per-image column. */
    ...DS_META_FIELDS.map(f => 'ds_' + f.col), 'ds_notes'];
  const dsMetaVals = DS_META_FIELDS.map(f => ds ? dsMetaGet(ds, f.key) : null).concat([ds ? (ds.note || '') : '']);
  const esc = v => {
    if (v == null) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [cols.join(',')];
  for (const r of recs) {
    const e = r.exif || {}, m = r.m || {};
    lines.push([
      r.name, r.origName, ds ? ds.name : '', r.folder, r.w, r.h,
      (r.w * r.h / 1e6).toFixed(2), r.h ? (r.w / r.h).toFixed(4) : '', r.size, extOf(r.name),
      r.dateMs ? fmtDate(new Date(r.dateMs)) : '', fmtDate(new Date(r.added)),
      e.make, e.model, e.lens, e.exposure, e.fnumber, e.iso, e.focal, e.focal35, e.expbias, e.wb,
      e.gps_lat, e.gps_lon, e.gps_alt, e.orientation, e.software,
      r.rating || 0, r.flag, (r.tags || []).join('; '), r.note,
      m.R, m.G, m.B, m.hex, m.L, m.a, m.b, m.C, m.H, m.S, m.V, m.colourfulness, m.cct, m.duv,
      r.sol ? r.sol.el : '', r.sol ? r.sol.az : '', r.sol && r.sol.am != null ? r.sol.am : '',
      r.sol ? new Date(r.sol.ts).toISOString() : '', solCfg.tz, solCfg.clockOffH || 0,
      hasEdits(r) ? 'yes' : 'no', hasEdits(r) ? editSummary(r.edits) : '',
      ...dsMetaVals,
    ].map(esc).join(','));
  }
  /* A header comment would break most CSV readers, so the provenance note goes
     in the manifest's own trailing row instead of a #-comment line. */
  return lines.join('\n') + '\n';
}
async function exportCsv(recs, label) {
  if (!recs || !recs.length) { setStatus('Nothing to export.', 'error', 4000); return; }
  const ds = dsById(state.curDs);
  const name = ((ds ? ds.name : 'images') + '_' + (label || 'metadata')).replace(/[^\w\-]+/g, '-');
  const where = await deliverOutput(new Blob([csvFor(recs)], { type: 'text/csv' }),
    `${name}.csv`, { tool: 'manager', params: { rows: recs.length, kind: label || 'metadata' } });
  setStatus(`Metadata CSV for ${recs.length} image${recs.length === 1 ? '' : 's'} — ${where.join(' and ')}.`, 'success', 6000);
}

/* ── Library backup ──────────────────────────────────────────────────────── */
/* The backup deliberately excludes pixels. A library of real 360 frames is tens
   of gigabytes; a JSON of its structure and curation is a few hundred KB, and
   that is the part that took human effort to create. Re-importing the same
   folders restores the images, matched on original filename and size. */
async function backupLibrary() {
  const all = [];
  for (const d of state.datasets) {
    const imgs = await dbImagesOf(d.id);
    all.push(...imgs.map(r => {
      const c = Object.assign({}, r);
      return c;
    }));
  }
  const doc = {
    format: BACKUP_FORMAT, version: 1, exported: new Date().toISOString(),
    projects: state.projects, datasets: state.datasets, images: all,
    note: 'Structure, curation and metadata only — image pixels are not included. Re-import the original folders and restore this file to reattach ratings, flags, tags, names and edit recipes.',
  };
  downloadBlob(new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }),
    `vom-manager-library_${todayStamp()}.json`);
  setStatus(`Library backup written: ${state.datasets.length} dataset(s), ${all.length} image record(s).`, 'success', 6000);
}
async function restoreLibrary(file) {
  let doc;
  try { doc = JSON.parse(await file.text()); } catch (e) { setStatus('That file is not valid JSON.', 'error', 5000); return; }
  if (!doc || !BACKUP_FORMATS.includes(doc.format)) { setStatus('That is not an Image Manager library backup.', 'error', 5000); return; }

  setStatus('Restoring library…', 'progress');
  const projById = new Map(state.projects.map(p => [p.id, p]));
  for (const p of doc.projects || []) if (!projById.has(p.id)) { await dbPut('projects', p); state.projects.push(p); }
  const dsById_ = new Map(state.datasets.map(d => [d.id, d]));
  for (const d of doc.datasets || []) if (!dsById_.has(d.id)) { await dbPut('datasets', d); state.datasets.push(d); }

  /* Matching is on (dataset, original filename, byte size). Filename alone would
     re-attach a rating to a different frame that happened to share a name. */
  let matched = 0, orphan = 0;
  for (const d of state.datasets) {
    const live = await dbImagesOf(d.id);
    if (!live.length) continue;
    const key = r => r.origName + '|' + r.size;
    const backup = new Map((doc.images || []).filter(r => r.dsId === d.id).map(r => [key(r), r]));
    const upd = [];
    for (const r of live) {
      const b = backup.get(key(r));
      if (!b) { orphan++; continue; }
      r.name = b.name; r.rating = b.rating || 0; r.flag = b.flag || 'none';
      r.tags = b.tags || []; r.note = b.note || ''; r.edits = b.edits || null; r.editedAt = b.editedAt || null;
      upd.push(r); matched++;
    }
    if (upd.length) await dbPutMany('images', upd);
  }
  await loadLibrary();
  if (state.curDs) await openDataset(state.curDs); else render();
  await updateQuota();
  setStatus(`Restored: ${matched} image record(s) reattached${orphan ? `, ${orphan} in the library had no backup entry` : ''}. Datasets with no imported images are listed but empty — re-import their folders.`, 'success', 10000);
}


/* ═══════════════════════════════════════════════════════════════════════════
   LIGHTBOX, MODALS, LIBRARY MANAGEMENT, INIT
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Modal ─────────────────────────────────────────────────────────────────
   `onDismiss` matters more than it looks. A dialog that a caller is AWAITING —
   the import destination chooser is one — must settle its promise however it
   closes. Without this, pressing Escape or clicking the backdrop left the
   import waiting forever with no visible sign anything was wrong. */
let _modalBtns = [];
let _modalDismiss = null;
function openModal(title, bodyHtml, buttons, onDismiss) {
  _modalBtns = buttons || [{ label: 'Close', cls: 'btn-ghost' }];
  _modalDismiss = onDismiss || null;
  $('modal').innerHTML =
    `<div class="mh">${title}</div><div class="mb">${bodyHtml}</div>
     <div class="mf">${_modalBtns.map((b, i) => `<button class="btn ${b.cls || 'btn-ghost'}" onclick="modalAct(${i})">${b.label}</button>`).join('')}</div>`;
  $('modalBack').classList.add('show');

  /* Focus lands inside the dialog so the primary button is one Tab away and
     screen readers land in the right place. Callers that want a specific field
     focused do so on a slightly longer timer and win. */
  setTimeout(() => {
    if ($('modal').contains(document.activeElement)) return;
    const b = $('modal').querySelector('.mf .btn-primary') || $('modal').querySelector('.mf button:last-child');
    if (b) b.focus();
  }, 20);
}

/* Modal keys are handled at the WINDOW, not on the dialog element.

   Hanging the listener on #modal meant it only fired once focus had actually
   moved inside — and focus moves on a 20 ms timer. Press Enter inside that
   window, which the destination dialog invites you to do on every single
   import, and the key went to <body> and did nothing at all. Intermittent by
   construction, and it duly showed up as an intermittent test failure rather
   than a reproducible one. */
function modalKey(e) {
  if (!$('modalBack').classList.contains('show')) return false;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return true; }
  /* Enter submits the last (primary) button. Not from a textarea, where Enter
     is a newline, and not from a button, which fires its own click. */
  if (e.key !== 'Enter' || e.shiftKey) return true;
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'button') return true;
  const btns = $('modal').querySelectorAll('.mf button');
  if (btns.length) { e.preventDefault(); btns[btns.length - 1].click(); }
  return true;
}
function closeModal() {
  const dismiss = _modalDismiss;
  _modalDismiss = null;
  $('modalBack').classList.remove('show');
  $('modal').innerHTML = '';
  if (dismiss) dismiss();
}

/* The callback runs BEFORE the modal is torn down. Closing first wipes
   modal.innerHTML, so every handler that read one of its inputs — rename, new
   project, new dataset, the colour picker, the delete-project checkbox — found
   null and silently fell back to the old value. Handlers therefore read their
   fields synchronously at the top, before their first await. */
async function modalAct(i) {
  const b = _modalBtns[i];
  _modalDismiss = null;              // a button is settling this one
  let pending = null;
  if (b && b.fn) pending = b.fn();
  closeModal();
  if (pending && typeof pending.then === 'function') await pending;
}

/* ── Lightbox ────────────────────────────────────────────────────────────── */
let _lbId = null, _lbZoom = false, _lbSide = true, _lb360 = false;

async function openLightbox(id) {
  _lbId = id;
  _lbZoom = false;
  $('lightbox').classList.add('show');
  await renderLightbox();
}
function closeLightbox() {
  $('lightbox').classList.remove('show');
  _lbId = null;
  _lb360 = false;
  $('lb360Canvas').classList.add('hidden');
  $('lb360Bar').classList.add('hidden');
  $('lbStage').classList.remove('is360');
  const cv = $('lbCanvas');
  cv.width = 1; cv.height = 1;
}

/* ── The 360° view ─────────────────────────────────────────────────────────
   Offered only for 2:1 frames, because that is the only aspect for which
   treating the image as a full sphere is meaningful. */
function lbToggle360() {
  const r = state.images.find(i => i.id === _lbId);
  if (!r || !is360(r)) return;
  if (!_lb360 && !v360Init()) {
    setStatus('This browser will not start WebGL, so the 360° view is unavailable. The flat view still works.', 'error', 8000);
    return;
  }
  _lb360 = !_lb360;
  if (_lb360) { _lbZoom = false; $('lbStage').classList.remove('zoom'); $('lbZoomBtn').classList.remove('on'); }
  renderLightbox();
}
function lbSync360Ui(rec) {
  const can = is360(rec);
  $('lb360Btn').classList.toggle('hidden', !can);
  $('lb360Btn').classList.toggle('on', _lb360);
  if (!can) _lb360 = false;                    // stepping onto a flat frame drops out
  $('lb360Canvas').classList.toggle('hidden', !_lb360);
  $('lbCanvas').classList.toggle('hidden', !!_lb360);
  $('lb360Bar').classList.toggle('hidden', !_lb360);
  $('lbStage').classList.toggle('is360', !!_lb360);
  $('lbZoomBtn').classList.toggle('hidden', !!_lb360);
  const sel = $('lb360Mode');
  if (sel && !sel.options.length) {
    sel.innerHTML = V360_MODES.map(([v, label]) => `<option value="${v}">${label}</option>`).join('');
  }
}
function lbStep(d) {
  const ids = state.view.map(r => r.id);
  let i = ids.indexOf(_lbId);
  if (i < 0) return;
  i = clamp(i + d, 0, ids.length - 1);
  _lbId = ids[i];
  state.cursor = _lbId;
  state.sel.clear(); state.sel.add(_lbId);
  paintSelection(); renderSelBar();
  renderLightbox();
}
function lbToggleZoom() {
  _lbZoom = !_lbZoom;
  $('lbStage').classList.toggle('zoom', _lbZoom);
  $('lbZoomBtn').classList.toggle('on', _lbZoom);
  renderLightbox();
}
function lbToggleSide() { _lbSide = !_lbSide; $('lbSide').classList.toggle('hidden', !_lbSide); }
async function lbFlag(f) {
  const r = state.images.find(i => i.id === _lbId);
  if (r) { await setFlag([r], f); renderLightbox(); }
}
async function renderLightbox() {
  const r = state.images.find(i => i.id === _lbId);
  if (!r) return;
  const ids = state.view.map(x => x.id);
  $('lbName').textContent = r.name;
  $('lbPos').textContent = `${ids.indexOf(_lbId) + 1} / ${ids.length}`;
  $('lbStars').innerHTML = (r.rating ? '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) : '☆☆☆☆☆')
    .split('').map((c, i) => `<span onclick="setRating([state.images.find(x=>x.id==='${r.id}')],${i + 1});renderLightbox()">${c}</span>`).join('');
  $('lbSide').innerHTML = singleImageHtml(r, true);   // no thumbnail — the image is already on screen
  $('lbSide').classList.toggle('hidden', !_lbSide);
  lbSync360Ui(r);

  const cv = $('lbCanvas'), cx = cv.getContext('2d');
  cv.width = 1; cv.height = 1;
  cx.clearRect(0, 0, 1, 1);

  const bmp = await originalBitmap(r.id);
  if (!bmp) return;
  if (_lbId !== r.id) return;                        // stepped away while decoding

  if (_lb360) {
    // The 360 view reads the EDITED pixels, like every other view.
    const src = renderEdits(bmp, r.edits, { maxDim: 4096 });
    v360Upload(src);
    v360Reset();
    v360Invalidate();
    return;
  }

  /* Below 1:1 the canvas is drawn at the size it will actually occupy, so a
     2880-wide frame does not allocate a full-resolution backing store just to be
     scaled down by CSS. At 1:1 it is drawn at native size and the stage scrolls.
     Small images are allowed to scale UP to fill the window — a viewer that
     shows a 600px frame as a postage stamp in the middle of a black screen is
     not doing its job — but only to 4×, past which it is just soft pixels. */
  const stage = $('lbStage');
  const availW = stage.clientWidth - 40, availH = stage.clientHeight - 20;
  const out = renderEdits(bmp, r.edits, _lbZoom ? {} : { maxDim: Math.max(availW, availH, 400) });
  const scale = _lbZoom ? 1 : clamp(Math.min(availW / out.width, availH / out.height), 0.01, 4);
  cv.width = Math.max(1, Math.round(out.width * scale));
  cv.height = Math.max(1, Math.round(out.height * scale));
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(out, 0, 0, cv.width, cv.height);
}

async function toggleDatasetProject(dsId, pId, on) {
  const d = dsById(dsId); if (!d) return;
  d.projectIds = d.projectIds || [];
  if (on) { if (!d.projectIds.includes(pId)) d.projectIds.push(pId); }
  else d.projectIds = d.projectIds.filter(x => x !== pId);
  await saveDataset(d);

     tick has to land immediately; the copy reports its own progress. */
  if (on) autoCopyIntoFolder([dsId]);

/* Two different acts wearing one word.

   A BROWSER dataset's stored copies are the only copies, so deleting one
   really does destroy something and the dialog owes you the megabytes.

   A FOLDER dataset is your own directory of your own files. Nothing here can
   honestly be called deleting: the folder stays, every image stays, and all
   that happens is that this project stops listing it. So it is called
   Remove — and it now STICKS, which it did not before. */
function confirmDeleteDataset(id) {
  const d = dsById(id);
  if (!d) return;
  const inFolder = isFolderDs(d);
  /* `updateQuota` tallies the library and leaves each dataset's share on the
     record, so the figure is already known and costs nothing to show. */
  const bytes = d.bytes || 0;

  if (inFolder) {
    setTimeout(() => openModal(`Remove “${escapeHtml(d.name)}” from this project?`,
      `<p>It stops being listed here and in the Projects hub. <b>Nothing on your disk is
        deleted or moved</b> — the folder <code>datasets/${escapeHtml((d.fs && d.fs.slug) || '')}</code>
        and all <b>${d.count || 0}</b> images stay exactly where they are.</p>
       <p class="note" style="margin-top:.6rem">The dataset's own file is marked as removed, which is
        what stops the folder scan putting it back. You can restore it from the project's card in the
        Projects hub.</p>`,
      [{ label: 'Cancel', cls: 'btn-ghost' },
       { label: 'Remove from project', cls: 'btn-danger', fn: async () => {
          setStatus('Removing…', 'progress');
          try { await markFolderDatasetRemoved(d); }
          catch (e) {
            setStatus('Could not write to the project folder — ' +
              escapeHtml(e.message || String(e)) + '. Nothing was removed.', 'error', 9000);
            return;
          }
          await deleteDataset(id);
          await updateQuota();
          render();
          setStatus(`<b>${escapeHtml(d.name)}</b> removed from this project. Its files are untouched.`,
            'success', 6000);
       } }]), 60);
    return;
  }

  setTimeout(() => openModal(`Delete “${escapeHtml(d.name)}”?`,
    `<p>The dataset and its <b>${d.count || 0}</b> stored image copies will be deleted from this browser${
      bytes ? `, freeing about <b>${fmtBytes(bytes)}</b>` : ''}.</p>
     <p class="note" style="margin-top:.6rem">These copies are in browser storage. If the images also
      exist in a folder on your computer, that folder is untouched.</p>`,
    [{ label: 'Cancel', cls: 'btn-ghost' },
     { label: 'Delete dataset', cls: 'btn-danger', fn: async () => {
        setStatus('Deleting…', 'progress');
        await deleteDataset(id);
        await updateQuota();
        render();
        setStatus('Dataset deleted' + (bytes ? ` · about ${fmtBytes(bytes)} freed` : '') + '.',
          'success', 5000);
     } }]), 60);
}

async function duplicateDataset(id) {
  const src = dsById(id);
  const copy = await createDataset(src.name + ' (copy)', (src.projectIds || []).slice());
  const imgs = await dbImagesOf(id);
  setStatus(`Duplicating ${imgs.length} record(s)…`, 'progress');
  for (let i = 0; i < imgs.length; i++) {
    const r = imgs[i], nid = uid('i_');
    const [t, b] = await Promise.all([dbGet('thumbs', r.id), dbGet('blobs', r.id)]);
    if (t) await dbPut('thumbs', { id: nid, blob: t.blob });
    if (b) await dbPut('blobs', { id: nid, blob: b.blob });
    await dbPut('images', Object.assign({}, r, { id: nid, dsId: copy.id, added: Date.now() }));
    if (i % 5 === 0) { setProgress((i + 1) / imgs.length); await sleep(0); }
  }
  copy.count = imgs.length;
  await saveDataset(copy);
  await updateQuota();
  await openDataset(copy.id);
  setStatus(`Duplicated as “${escapeHtml(copy.name)}”. Note this doubles the storage used — the image copies are real.`, 'success', 8000);
}

function openHelp() {
  openModal('How the Manager works',
    `<p><b>Nothing is uploaded.</b> Images are decoded in this browser and stored in its own database on this
     machine. The tool has read access to the files you hand it and no write access to anything.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Library</h4>
     <p>A <b>dataset</b> is a set of images worked on together; a <b>project</b> is a folder of datasets, and one
     dataset can sit in several. The library panel has a tab for each, and each tab has one job:
     <b>Datasets</b> always lists every dataset, and <b>Projects</b> is where you organise. Clicking a project
     opens it in place, showing its datasets with a single link back.</p>
     <p>Every row carries a <b>pencil</b> (name, notes, and a project's colour), a <b>+</b> (file a dataset into
     projects, or add datasets to a project) and a <b>×</b>. <b>Right-clicking</b> any row gives the same actions
     plus export and duplicate. Filing works from either side and the tick-lists are two views of one relation —
     unticking removes, so you never have to go round to the other side to undo something.</p>
     <p><b>+ Add</b> takes either loose images or a whole folder — one button, because a single file input cannot
     offer both. Dropping images or a folder anywhere on the page does the same. Either way you are asked
     <b>where they should go</b>: the open dataset, another one, or a new one named after the folder. The obvious
     answer is preselected and Enter accepts it, so it costs one keystroke — but a folder dropped onto the wrong
     open dataset is no longer silent, and mixing two shoots together has no undo.
     If a drop does nothing, the page is almost certainly inside a preview frame — browsers do not hand dropped
     files to a sandboxed frame. Open it in its own tab.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Session metadata</h4>
     <p>A dataset is usually a field session, and a field session has facts no file header records. The pencil, or
     <b>Edit dataset &amp; session metadata</b> in the inspector, holds <b>site</b>, <b>position</b>,
     <b>date</b>, <b>time</b> and <b>conditions</b> — the five things you would write in a notebook. All of them
     land in the exported CSV as <code>ds_</code> columns, repeated on every row, because a file read three years
     from now has no other record of what the air was doing.</p>
     <p><b>Fill from images</b> reads the date, the time window and any GPS fix out of the frames themselves and
     puts them in the boxes for you to check — it fills, it does not decide.</p>
     <p class="note">The position is <b>the same pair</b> the solar calculation uses for frames without their own
     GPS, not a second copy of it. Changing it here changes it there and recomputes the sun. Two boxes holding the
     same fact, only one of them updated, is how a whole dataset ends up with quietly wrong angles.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Solar geometry</h4>
     <p>Every frame carrying a capture time and a position gets a solar elevation, azimuth and air mass, computed
     on import with NOAA's algorithm — the same one SunSync 360 uses, checked here against pvlib's NREL SPA to
     better than 0.01°. Sort by any of them, or group the grid into elevation bands.</p>
     <div class="warn"><b>EXIF records no timezone.</b> A bare wall-clock reading is not an instant, and reading it
     in the wrong zone moves the sun 15° per hour — the fault that put SunSync 25° out, and the Mapillary sequence
     whose stamps were seven hours early. So the zone is a per-dataset setting, with a clock offset beside it for a
     camera that was simply wrong. Both are stated next to the angles they produced, and a zone that disagrees with
     the GPS longitude is flagged. If the computed sun contradicts what the photograph plainly shows, the clock is
     what is wrong, not the astronomy.</div>
     <p class="note" style="margin-top:.5rem">Frames without GPS can borrow site coordinates set on the dataset.
     A frame with neither time nor position gets no angles at all rather than a plausible-looking guess, and air
     mass is left empty below the horizon instead of returning a large number that would quietly dominate a sort.
     The azimuth is a true bearing for the <i>sun</i>; it says nothing about where the camera was pointing — that
     is SunSync's job.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Arranging</h4>
     <p><b>Arrange</b> sorts by file properties, capture time or measured colour. Two are worth knowing:
     <b>colour ramp</b> sorts by hue then lightness and pushes near-neutral frames to one end, because a hue angle
     computed from a grey image is a real number describing nothing; <b>colour distance from reference</b> sorts by
     CIEDE2000 against an image you nominate in the inspector. <b>Group</b> breaks the grid into labelled runs —
     <b>capture session</b> is the useful one on fieldwork, splitting the set wherever the gap between frames
     exceeds the threshold, and <b>solar elevation band</b> is its counterpart for geometry.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Splitting a set</h4>
     <p>Select some images and use <b>To dataset</b> in the selection bar, or right-click any tile. You can make a
     <b>new dataset from the selection</b>, or move or copy into an existing one. <b>Moving is the default</b>,
     because splitting a shoot is the usual reason to do this and copying is not free — the library holds real
     files, so a copy of 40 frames is another 200 MB. Copy is always offered explicitly, and ratings, flags, tags
     and edit recipes travel with the images either way.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">360° view</h4>
     <p>Open a <b>2:1 equirectangular</b> frame full size and a <b>360°</b> button appears — only for 2:1, because
     that is the only aspect for which treating an image as a whole sphere means anything. Drag to look around,
     scroll to zoom, and switch projection:</p>
     <table class="mini">
       <tr><td><b>Perspective</b></td><td>the ordinary rectilinear view, 15–120° field</td></tr>
       <tr><td><b>Orb</b></td><td>the sky collapsed into a ball, its rim the horizon, the ground opening outward
           to fill the frame</td></tr>
       <tr><td><b>Little planet</b></td><td>the exact inverse: the ground in the ball, the sky wrapped outside</td></tr>
       <tr><td><b>Fisheye</b></td><td>equidistant, looking up, horizon at the rim of the disk</td></tr>
       <tr><td><b>Flat</b></td><td>the frame exactly as stored</td></tr>
     </table>
     <p class="note" style="margin-top:.4rem">Orb and Little planet are the same stereographic projection taken from
     opposite poles — from the zenith and from the nadir. Arrow keys pan while the view is open; Shift+arrows still
     step through the dataset.</p>
     <p class="note">Deliberately a plain viewer with nothing drawn on top. Per-frame geometry — the sun,
     scattering-angle rings, the horizon — is SunSync 360's job, and a sun marker here would be wrong anyway: the
     Manager knows where the sun <i>was</i>, but not which way the camera was pointing. The view also resamples for
     display; nothing here is measured.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Curating</h4>
     <p>Rate 0–5 with the number keys, pick with <b>P</b>, reject with <b>X</b>, clear with <b>U</b>. Rejecting hides
     nothing by itself — set the filter to <i>hide rejected</i> to act on it. <b>Remove</b> deletes the stored copy
     from this library and never touches your disk.</p>
     <p>The <b>dot</b> in each thumbnail's corner is the whole state at a glance:</p>
     <table class="mini">
       <tr><td>hollow</td><td>nothing</td></tr>
       <tr><td>filled yellow</td><td>selected</td></tr>
       <tr><td>filled green / red</td><td>picked / rejected</td></tr>
       <tr><td>+ a yellow ring</td><td>also selected</td></tr>
     </table>
     <p class="note" style="margin-top:.4rem">The flag fills and selection rings rather than one hiding the other,
     because the usual move is to select a batch and then flag it — you want to watch the flags land without losing
     sight of what is still selected. A dashed outline is the keyboard cursor; a faded tile is rejected.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Editing</h4>
     <p>Edits are <b>recipes</b>, not new files: the imported bytes are never rewritten, and clearing an edit returns
     the original exactly. Edited images are badged, and the recipe travels in the metadata CSV.</p>
     <div class="warn" style="margin-top:.5rem"><b>Two cautions worth taking seriously.</b><br>
     Colour edits change what any downstream measurement measures — if these frames are headed for the Analyzer,
     export them unedited.<br>
     Cropping, rotating or resizing an <b>equirectangular</b> (2:1) frame breaks the row→elevation mapping that
     360° analysis depends on, silently. Use Image Cutter's full-source-canvas export for sky work.</div>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Exporting</h4>
     <p>Unedited images in their original format are copied <b>byte for byte</b> — no decode, no re-encode, nothing
     touched. Anything re-encoded goes through the canvas, and <b>EXIF travels with it into both JPEG and PNG</b>
     (PNG in an <code>eXIf</code> chunk, the same way Image Cutter does it).</p>
     <p>What survives depends on whether the pixels still match:</p>
     <table class="mini">
       <tr><td>same shape</td><td>the original EXIF block, entire — GPS, capture instant, camera, the lot</td></tr>
       <tr><td>cropped, rotated or resized</td><td>a rebuilt block: position, instant and camera identity, with the
           pixel-dimension and orientation tags <b>left out</b></td></tr>
     </table>
     <p class="note" style="margin-top:.4rem">Those tags are dropped rather than carried because after a resize they
     describe pixels that no longer exist, and a downstream tool that trusts them mis-maps row to elevation. Losing
     the GPS fix and the capture instant along with them, which is what earlier versions did, threw away the two
     facts that make the frame a measurement. WebP carries no EXIF here — use JPEG or PNG.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Colour numbers here</h4>
     <p>The metrics shown are computed on a ${METRIC_MAX}px thumbnail, unweighted, over the whole frame. They exist
     to sort a grid. Measurement belongs in the <b>Batch Image Analyzer</b>, which applies projection weighting,
     masking and a declared analysis resolution. Colour conversion code is shared between the two, so the two agree
     in kind — but not in precision.</p>

     <h4 style="margin:.8rem 0 .3rem;font-family:var(--vom-display);color:var(--primary-dark)">Keyboard</h4>
     <table class="mini">
       <tr><td>arrows</td><td>move · hold Shift to extend the selection</td></tr>
       <tr><td>Space / Enter</td><td>open full size</td></tr>
       <tr><td>0–5</td><td>rating</td></tr>
       <tr><td>P / X / U</td><td>pick · reject · unflag</td></tr>
       <tr><td>Ctrl/⌘-A</td><td>select all shown</td></tr>
       <tr><td>Delete</td><td>remove from dataset</td></tr>
       <tr><td>Esc</td><td>clear selection · close a menu or dialog</td></tr>
       <tr><td>right-click</td><td>actions for any dataset or project row</td></tr>
       <tr><td>in full size</td><td>← → step · Z zoom 1:1 · I info · V the 360° view</td></tr>
       <tr><td>in 360°</td><td>arrows pan · Shift+← → step images · double-click resets</td></tr>
       <tr><td>panel edges</td><td>drag to resize · double-click resets · Tab to one and use arrows</td></tr>
     </table>
     <p class="note" style="margin-top:.4rem">Both side panels resize by dragging their inner edge, and the width
     is remembered. It is a <i>preference</i> rather than a width: on a narrow window the panels give space back so
     the grid keeps a usable minimum — the inspector first, then the library, and the inspector folds entirely
     before the grid is squeezed. Widen the window and the widths you chose come back.</p>
     <p class="note" style="margin-top:.8rem">Image Manager ${MANAGER_VERSION} · part of Vis-O-Matic</p>`,
    [{ label: 'Close', cls: 'btn-ghost' }]);
}

/* ── Init ────────────────────────────────────────────────────────────────── */
async function init() {
  try {
    await openDB();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="empty-state"><b>This browser will not open a local database</b>
       The Manager stores its library in IndexedDB, which is unavailable here — most often because the page is in a
       private window or site data is blocked. Try a normal window, or allow site data for this page.</div>`;
    return;
  }
  await loadSettings();
  await loadLibrary();
  await initProjects();
  buildSortSelect();

  if (state.curDs && !dsById(state.curDs)) state.curDs = null;
  if (state.curProject && state.curProject !== UNFILED && !prById(state.curProject)) state.curProject = null;
  if (state.curDs) state.images = await dbImagesOf(state.curDs);

  wireGrid();
  wireKeys();
  wireDropTarget();
  wireMenuDismiss();
  initToolbar();
  wirePanelResize();
  v360Wire();

  $('fileInput').addEventListener('change', e => { if (e.target.files.length) importFiles(e.target.files); });
  $('folderInput').addEventListener('change', e => { if (e.target.files.length) importFiles(e.target.files); });
  $('restoreInput').addEventListener('change', e => { if (e.target.files[0]) restoreLibrary(e.target.files[0]); });
  $('modalBack').addEventListener('click', e => { if (e.target.id === 'modalBack') closeModal(); });

  let rt = null;
  window.addEventListener('resize', () => {
    layoutToolbar();
    if (_lb360) v360Invalidate();
    clearTimeout(rt);
    rt = setTimeout(() => { if ($('lightbox').classList.contains('show')) renderLightbox(); }, 150);
  });

  render();
  layoutToolbar();
  checkDropEnvironment();
  await updateQuota();
  requestPersistence().then(updateQuota);

  if (!state.datasets.length) setStatus('Drop a folder of images anywhere to start. Nothing leaves this computer.', 'success', 9000);
}
window.addEventListener('DOMContentLoaded', init);


/* ═══════════════════════════════════════════════════════════════════════════
   ANCHORED MENU + TOOLBAR OVERFLOW
   One small menu component serves three jobs: right-click on a library row,
   the combined add button, and the toolbar's overflow. Keeping them the same
   component means the same keyboard and dismissal behaviour everywhere.
   ═══════════════════════════════════════════════════════════════════════════ */

let _menuItems = [];

/* items: [{label, fn, danger, disabled} | {sep:true} | {title:'…'}] */
function openMenuAt(x, y, items) {
  _menuItems = items;
  const el = $('ctxMenu');
  el.innerHTML = items.map((it, i) => {
    if (it.sep) return '<div class="msep"></div>';
    if (it.title) return `<div class="mtitle">${escapeHtml(it.title)}</div>`;
    return `<button class="${it.danger ? 'danger' : ''}" ${it.disabled ? 'disabled' : ''}
              onclick="menuAct(${i})">${it.label}</button>`;
  }).join('');
  el.classList.add('show');

  /* Position after rendering, then pull back inside the viewport — a menu
     opened near the right or bottom edge would otherwise be half off-screen. */
  const r = el.getBoundingClientRect();
  const left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6));
  const top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6));
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
/* Anchor under a button rather than at the pointer, so a click on the button
   always drops the menu in the same place. */
function openMenuUnder(ev, items) {
  const btn = ev.currentTarget || ev.target;
  const r = btn.getBoundingClientRect();
  openMenuAt(r.left, r.bottom + 4, items);
  ev.preventDefault();
  ev.stopPropagation();
}
function openMenuAtPointer(ev, items) {
  openMenuAt(ev.clientX, ev.clientY, items);
  ev.preventDefault();
  ev.stopPropagation();
}
function closeMenu() { const el = $('ctxMenu'); if (el) { el.classList.remove('show'); el.innerHTML = ''; } }
function menuAct(i) {
  const it = _menuItems[i];
  closeMenu();
  if (it && it.fn) it.fn();
}
function wireMenuDismiss() {
  document.addEventListener('mousedown', e => {
    // e.target can be the document itself, which has no .closest().
    const inside = sel => !!(e.target && e.target.closest && e.target.closest(sel));
    if (!inside('#ctxMenu')) closeMenu();
    if (!inside('#gbTray') && !inside('#gbMoreBtn')) closeOverflow();
  }, true);
  window.addEventListener('blur', () => { closeMenu(); closeOverflow(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closeOverflow(); } });
}

/* ── The combined add button ───────────────────────────────────────────────
   One button, both inputs. A single <input type="file"> cannot offer files and
   a directory at once — webkitdirectory is a property of the element — so the
   menu picks which hidden input to open. */
function openAddMenu(ev) {
  const ds = state.curDs ? dsById(state.curDs) : null;
  const scope = libScope();
  const p = (scope === 'all' || scope === UNFILED) ? null : prById(scope);
  /* ONE entry point. There used to be a separate "+ Add datasets" button inside
     the Projects tab; with that tab gone, bringing an existing dataset into the
     project you are looking at belongs here, beside the other ways in. */
  /* No "Add to <dataset>" title. Every one of these asks where the images
     should go once it has them, so a heading claiming the destination was
     already decided was simply wrong. */
  const items = [
    { label: '&#128247;&nbsp; Images&hellip;', fn: pickFiles },
    { label: '&#128193;&nbsp; Folder&hellip;', fn: pickFolder },
  ];
  if (p) {
    items.push({ sep: true });
    items.push({ label: '&#9776;&nbsp; From my library&hellip;', fn: () => addDatasetsDialog(p.id) });
  }
  items.push({ sep: true });
  items.push({ label: '&#43;&nbsp; New empty dataset&hellip;', fn: newDataset });
  openMenuUnder(ev, items);
}

/* ── Toolbar overflow ──────────────────────────────────────────────────────
   Groups carry data-prio; the lowest number leaves the bar first. They are
   MOVED into the tray rather than hidden, so the selects inside keep working
   and every id stays valid — syncControls() never has to know where a control
   currently lives. */
let _gbChildren = null;
function initToolbar() {
  _gbChildren = Array.from($('gridbar').children);
}
function layoutToolbar() {
  if (!_gbChildren) return;
  enforceLayout();
  const bar = $('gridbar'), tray = $('gbTray'), more = $('gbMoreBtn');
  if (!bar || !tray || !more) return;

  // Start from the original arrangement every time, so widening restores.
  _gbChildren.forEach(c => bar.appendChild(c));
  tray.innerHTML = '';
  more.classList.add('hidden');

  const movable = _gbChildren
    .filter(c => c.dataset && c.dataset.prio)
    .sort((a, b) => (+a.dataset.prio) - (+b.dataset.prio));

  if (bar.scrollWidth <= bar.clientWidth + 1) return;
  more.classList.remove('hidden');
  for (const el of movable) {
    if (bar.scrollWidth <= bar.clientWidth + 1) break;
    tray.appendChild(el);
  }
  // Everything fitted once the button itself was accounted for.
  if (!tray.children.length) more.classList.add('hidden');
}
function openOverflow(ev) {
  const tray = $('gbTray'), btn = ev.currentTarget || ev.target;
  if (tray.classList.contains('show')) { closeOverflow(); return; }
  closeMenu();
  tray.classList.add('show');
  const r = btn.getBoundingClientRect(), t = tray.getBoundingClientRect();
  tray.style.left = Math.max(6, Math.min(r.right - t.width, window.innerWidth - t.width - 6)) + 'px';
  tray.style.top = (r.bottom + 4) + 'px';
  ev.stopPropagation();
}
function closeOverflow() { const t = $('gbTray'); if (t) t.classList.remove('show'); }


/* ═══════════════════════════════════════════════════════════════════════════
   360° VIEWER  —  equirectangular frames only
   ---------------------------------------------------------------------------
   A WebGL reprojection of an equirectangular frame: drag to look around, scroll
   to zoom, or switch to little-planet, fisheye or flat. One full-screen quad
   and one fragment shader — each pixel works out which direction it is looking
   and samples the panorama there, so every projection is the same shader with a
   different way of turning screen position into a direction.

   Deliberately a plain viewer with nothing drawn on top. Per-frame geometry —
   the sun, scattering-angle rings, the horizon — belongs to SunSync 360 by the
   division of labour this toolkit already follows, and a sun marker here would
   be wrong anyway: the Manager knows where the sun WAS, but not which way the
   camera was pointing.

   It resamples for display. Nothing measured here; measurement is the
   Analyzer's job, on the original pixels.
   ═══════════════════════════════════════════════════════════════════════════ */

/* A 2:1 frame is the equirectangular convention. The tolerance is loose enough
   for a 2880×1439 rounding but tight enough to exclude a 16:9 photograph. */
function is360(rec) {
  return !!(rec && rec.w && rec.h && Math.abs((rec.w / rec.h) - 2) < 0.02);
}

const V360 = {
  gl: null, prog: null, tex: null, buf: null, loc: {},
  yaw: 0, pitch: 0, fov: 75, zoom: 1, mode: 0,
  dirty: false, raf: null, texSize: 0, failed: false,
};
const V360_MODES = [
  ['0', 'Perspective — drag to look around'],
  ['4', 'Orb — sky in the ball'],
  ['1', 'Little planet — ground in the ball'],
  ['2', 'Fisheye'],
  ['3', 'Flat (equirectangular)'],
];

const V360_VS = `
attribute vec2 a;
varying vec2 v;
void main() { v = a; gl_Position = vec4(a, 0.0, 1.0); }`;

const V360_FS = `
precision highp float;
varying vec2 v;
uniform sampler2D tex;
uniform mat3 rot;
uniform float aspect;   // viewport width / height
uniform float fovTan;   // tan(vertical fov / 2)
uniform float zoom;
uniform int mode;
const float PI = 3.141592653589793;

vec4 sampleEq(vec3 d) {
  d = normalize(d);
  float lon = atan(d.x, -d.z);
  float lat = asin(clamp(d.y, -1.0, 1.0));
  return texture2D(tex, vec2(lon / (2.0 * PI) + 0.5, 0.5 - lat / PI));
}

void main() {
  if (mode == 3) {                                   // flat: straight texture map
    gl_FragColor = texture2D(tex, vec2(v.x * 0.5 + 0.5, 0.5 - v.y * 0.5));
    return;
  }
  vec3 d;
  if (mode == 0) {                                   // rectilinear
    d = rot * normalize(vec3(v.x * aspect * fovTan, v.y * fovTan, -1.0));
  } else {
    vec2 p = vec2(v.x * aspect, v.y) / zoom;
    float r = length(p);
    float phi = atan(p.y, p.x);
    if (mode == 2 && r > 1.0) { gl_FragColor = vec4(0.06, 0.09, 0.11, 1.0); return; }
    vec3 dir;
    if (mode == 1) {
      // stereographic from the nadir: the ground opens out into a "planet",
      // and the horizon lands at r = 2.
      float theta = 2.0 * atan(r * 0.5);
      dir = vec3(sin(theta) * cos(phi), -cos(theta), sin(theta) * sin(phi));
    } else if (mode == 4) {
      // ORB — the same stereographic law taken from the ZENITH instead of the
      // nadir, so it is the exact inverse of little planet: the sky collapses
      // into a ball, its rim IS the horizon (again at r = 2), and the ground
      // opens outward past it to fill the frame. Nothing is clipped, because
      // the interesting part of this projection is what happens outside the
      // ball.
      float theta = 2.0 * atan(r * 0.5);
      dir = vec3(sin(theta) * cos(phi), cos(theta), sin(theta) * sin(phi));
    } else {
      // equidistant fisheye looking up: r = 1 is the horizon.
      float theta = r * (PI / 2.0);
      dir = vec3(sin(theta) * cos(phi), cos(theta), sin(theta) * sin(phi));
    }
    d = rot * dir;
  }
  gl_FragColor = sampleEq(d);
}`;

function v360Compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function v360Init() {
  if (V360.gl || V360.failed) return !!V360.gl;
  const cv = $('lb360Canvas');
  const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: false }) ||
             cv.getContext('experimental-webgl');
  if (!gl) { V360.failed = true; return false; }
  try {
    const p = gl.createProgram();
    gl.attachShader(p, v360Compile(gl, gl.VERTEX_SHADER, V360_VS));
    gl.attachShader(p, v360Compile(gl, gl.FRAGMENT_SHADER, V360_FS));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    gl.useProgram(p);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const a = gl.getAttribLocation(p, 'a');
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

    V360.gl = gl; V360.prog = p; V360.buf = buf;
    for (const n of ['tex', 'rot', 'aspect', 'fovTan', 'zoom', 'mode']) V360.loc[n] = gl.getUniformLocation(p, n);
    V360.tex = gl.createTexture();
    return true;
  } catch (e) {
    log('360: ' + e.message);
    V360.failed = true;
    return false;
  }
}

/* The texture is redrawn to a power-of-two 2:1 canvas so the horizontal wrap can
   be REPEAT. With a non-power-of-two texture WebGL1 forces CLAMP_TO_EDGE, which
   leaves a visible seam down the back of the panorama exactly where the two
   edges of the image meet. */
function v360Upload(srcCanvas) {
  const gl = V360.gl;
  const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  let w = 4096;
  while (w > max) w >>= 1;
  while (w > 1024 && w > srcCanvas.width * 1.5) w >>= 1;   // no point upsampling a small frame
  const h = w >> 1;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(srcCanvas, 0, 0, w, h);

  gl.bindTexture(gl.TEXTURE_2D, V360.tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  V360.texSize = w;
}

function v360Draw() {
  V360.raf = null;
  const gl = V360.gl;
  if (!gl) return;
  const cv = $('lb360Canvas');
  const stage = $('lbStage');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(stage.clientWidth * dpr));
  const h = Math.max(2, Math.round(stage.clientHeight * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  cv.style.width = stage.clientWidth + 'px';
  cv.style.height = stage.clientHeight + 'px';
  gl.viewport(0, 0, w, h);

  const yaw = V360.yaw, pitch = V360.pitch;
  /* R = Ry(−yaw) · Rx(pitch), column-major for WebGL. The NEGATIVE yaw is what
     makes `yaw` equal longitude: with Ry(+yaw) the view turns the opposite way
     from the number, so arrow-key panning went left when it said right and the
     drag directions had to be inverted to compensate. With this convention
     yaw == lon and pitch == latitude, and every control reads the way it looks. */
  const cy = Math.cos(yaw), sy = -Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const m = new Float32Array([cy, 0, -sy, sy * sp, cp, cy * sp, sy * cp, -sp, cy * cp]);

  gl.useProgram(V360.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, V360.tex);
  gl.uniform1i(V360.loc.tex, 0);
  gl.uniformMatrix3fv(V360.loc.rot, false, m);
  gl.uniform1f(V360.loc.aspect, w / h);
  gl.uniform1f(V360.loc.fovTan, Math.tan(V360.fov * Math.PI / 360));
  gl.uniform1f(V360.loc.zoom, V360.zoom);
  gl.uniform1i(V360.loc.mode, V360.mode);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function v360Invalidate() {
  if (V360.raf) return;
  V360.raf = requestAnimationFrame(v360Draw);
}
/* The horizon sits at r = 2 in both stereographic modes, so the default zoom is
   chosen to put that circle just inside the frame: 0.45 leaves the ball at about
   90% of the half-height with the ground filling the corners. */
function v360DefaultZoom(mode) { return mode === 1 ? 0.5 : mode === 4 ? 0.45 : 1; }
function v360Reset() {
  V360.yaw = 0; V360.pitch = 0; V360.fov = 75;
  V360.zoom = v360DefaultZoom(V360.mode);
  v360SyncUI(); v360Invalidate();
}
function v360SetMode(m) {
  V360.mode = +m;
  V360.zoom = v360DefaultZoom(V360.mode);
  if (V360.mode !== 0) { V360.pitch = 0; V360.yaw = 0; }
  v360SyncUI(); v360Invalidate();
}
function v360SyncUI() {
  const sel = $('lb360Mode'); if (sel) sel.value = String(V360.mode);
  const z = $('lb360Zoom');
  if (z) {
    z.textContent = V360.mode === 0 ? `${Math.round(V360.fov)}° fov`
                  : V360.mode === 3 ? '' : `${V360.zoom.toFixed(2)}×`;
  }
  const hint = $('lb360Hint');
  if (hint) hint.textContent = V360.mode === 3 ? 'the frame as stored'
            : V360.mode === 0 ? 'drag to look · scroll to zoom · arrows pan'
            : V360.mode === 4 ? 'sky in the ball, horizon at its rim · drag to spin'
            : 'drag to spin · scroll to zoom';
}

function v360Wire() {
  const cv = $('lb360Canvas');
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, yaw: V360.yaw, pitch: V360.pitch };
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    // Scale the drag by the field of view, so a small fov pans slowly — without
    // it, zoomed right in, one flick of the mouse spins the whole sphere.
    const k = (V360.mode === 0 ? V360.fov / 75 : 1 / Math.max(0.2, V360.zoom)) * 0.005;
    /* The picture follows the pointer, as it does in every photo-sphere viewer:
       drag right and the scene comes right with you, which means looking left. */
    V360.yaw = drag.yaw - (e.clientX - drag.x) * k;
    V360.pitch = clamp(drag.pitch + (e.clientY - drag.y) * k, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);
    v360Invalidate();
  });
  const end = e => { drag = null; cv.style.cursor = 'grab'; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (V360.mode === 3) return;
    if (V360.mode === 0) V360.fov = clamp(V360.fov * (e.deltaY > 0 ? 1.08 : 1 / 1.08), 15, 120);
    else V360.zoom = clamp(V360.zoom * (e.deltaY > 0 ? 1 / 1.08 : 1.08), 0.15, 8);
    v360SyncUI(); v360Invalidate();
  }, { passive: false });
  cv.addEventListener('dblclick', v360Reset);
}

/* Arrow keys pan while the 360 view is open — jumping to the next photograph
   mid-look would be jarring. Shift+arrows still step through the dataset. */
function v360Key(ev) {
  const step = V360.mode === 0 ? (V360.fov * Math.PI / 180) * 0.12 : 0.1;
  if (ev.key === 'ArrowLeft')  { V360.yaw -= step; }
  else if (ev.key === 'ArrowRight') { V360.yaw += step; }
  else if (ev.key === 'ArrowUp')    { V360.pitch = clamp(V360.pitch + step, -1.56, 1.56); }
  else if (ev.key === 'ArrowDown')  { V360.pitch = clamp(V360.pitch - step, -1.56, 1.56); }
  else return false;
  v360Invalidate();
  return true;
}


/* ═══════════════════════════════════════════════════════════════════════════
   DESTINATIONS
   Where images go on import, and where selected images go afterwards.

   Import used to drop straight into whatever dataset happened to be open, which
   is fine until it isn't: dropping a folder onto the wrong open set mixes two
   shoots together and there is no undo. So every add asks — with the obvious
   answer preselected and Enter accepting it, so it costs one keystroke when the
   obvious answer is right.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Called by importFiles() before anything is decoded. Resolves to a dataset id,
   or null if the user cancelled. */
function chooseImportTarget(files) {
  return new Promise(resolve => {
    const cur = state.curDs ? dsById(state.curDs) : null;
    const rel = (files[0] && files[0].webkitRelativePath) || '';
    const folder = rel.includes('/') ? rel.split('/')[0] : '';
    const suggested = folder || `Dataset ${state.datasets.length + 1}`;
    const others = state.datasets.filter(d => !cur || d.id !== cur.id);

    const n = files.length;
    const body = `
      <p style="margin-bottom:.7rem"><b>${n}</b> image${n === 1 ? '' : 's'}${folder ? ` from <b>${escapeHtml(folder)}</b>` : ''}
        · ${fmtBytes(files.reduce((s, f) => s + f.size, 0))}</p>

      ${cur ? `<label class="ck" style="display:flex;padding:.35rem 0">
        <input type="radio" name="impDest" value="cur" checked>
        <span>Add to the open dataset — <b>${escapeHtml(cur.name)}</b>
          <span style="color:var(--text-muted)">(${cur.count || 0} already)</span></span></label>` : ''}

      ${others.length ? `<label class="ck" style="display:flex;padding:.35rem 0">
        <input type="radio" name="impDest" value="existing">
        <span>Add to another dataset</span></label>
      <div style="padding:0 0 .4rem 1.5rem">
        <select id="impExisting" style="width:100%" onfocus="document.querySelector('input[value=existing]').checked=true">
          ${others.map(d => `<option value="${d.id}">${escapeHtml(d.name)} — ${d.count || 0} image(s)</option>`).join('')}
        </select></div>` : ''}

      <label class="ck" style="display:flex;padding:.35rem 0">
        <input type="radio" name="impDest" value="new" ${cur ? '' : 'checked'}>
        <span>Add to a new dataset</span></label>
      <div style="padding:0 0 .2rem 1.5rem">
        <input type="text" id="impNewName" style="width:100%" value="${escapeHtml(suggested)}"
               onfocus="document.querySelector('input[value=new]').checked=true"></div>

      ${state.project ? `<p class="note" style="margin-top:.55rem">A new dataset joins
        <b style="color:${state.project.colour || 'var(--accent)'}">■</b>
        <b>${escapeHtml(state.project.name)}</b>, the project you have open.</p>` : ''}

      <p class="note" style="margin-top:.5rem">Nothing is decoded until you choose. Press Enter to accept the
      selected option.</p>`;

    openModal('Where should these images go?', body, [
      { label: 'Cancel', cls: 'btn-ghost', fn: () => resolve(null) },
      { label: `Add ${n} image${n === 1 ? '' : 's'}`, cls: 'btn-primary', fn: async () => {
          const picked = document.querySelector('input[name="impDest"]:checked');
          const mode = picked ? picked.value : 'new';
          if (mode === 'cur' && cur) { resolve(cur.id); return; }
          if (mode === 'existing') {
            const sel = $('impExisting');
            resolve(sel ? sel.value : (cur ? cur.id : null));
            return;
          }
          const name = ($('impNewName') && $('impNewName').value || '').trim() || suggested;
          /* THE OPEN PROJECT, not `state.curProject`. That was the drill-in
             state of the Projects tab, and when that tab was retired nothing
             set it any more — so every dataset imported with a project open got
             `projectIds: []`. The hub then honestly reported zero datasets and
             the tools offered nothing to open, which is exactly how it was
             reported. Importing into a project you have open means joining it. */
          const inProject = state.project ? [state.project.id] : [];
          const ds = await createDataset(name, inProject);
          resolve(ds.id);
      } },
    ], () => resolve(null));      // Escape or a backdrop click must settle it too
    /* With a dataset open the default is that dataset; with none open the
       default is a NEW one. "Add to another dataset" is never the default —
       silently appending to whichever set happened to sort first is exactly the
       accident this dialog exists to prevent. */
    setTimeout(() => {
      const el = $('impNewName');
      if (el && !cur) { el.focus(); el.select(); }
    }, 60);
  });
}

/* ══════════ Sending a selection to another dataset ══════════
   Move is the default because splitting a shoot is the usual reason to do this,
   and copying is not free — the library holds real bytes, so a copy of 40
   full-resolution frames is another 200 MB on disk. Copy is offered explicitly. */

function openSelectionDatasetMenu(ev) {
  const n = targetRecs().length;
  if (!n) return;
  openMenuUnder(ev, selectionDatasetItems(n));
}
function selectionDatasetItems(n) {
  const others = state.datasets.filter(d => d.id !== state.curDs);
  return [
    { title: `${n} image${n === 1 ? '' : 's'} selected` },
    { label: '&#43;&nbsp; New dataset from selection&hellip;', fn: newDatasetFromSelection },
    { label: '&#8594;&nbsp; Move to dataset&hellip;', fn: () => sendSelectionDialog(true), disabled: !others.length },
    { label: '&#10697;&nbsp; Copy to dataset&hellip;', fn: () => sendSelectionDialog(false), disabled: !others.length },
  ];
}

/* A subset is a NEW WAY OF LOOKING at images you already have, not a decision
   to stop having them where they were. So copying is the default and the
   original set is left intact — the destructive reading of "make a subset"
   should never be the one that happens by accident.

   Only the project you are working in is ticked. Ticking every project the
   source belonged to filed the subset into places you were not thinking about,
   and an accidental filing is quiet: nothing looks wrong until a project's
   dataset list has something in it that nobody put there. */
function newDatasetFromSelection() {
  const recs = targetRecs();
  if (!recs.length) return;
