  const src = dsById(state.curDs);
  const active = state.project ? state.project.id : null;
  const folder = folderBacked();
  openModal(`New dataset from ${recs.length} image${recs.length === 1 ? '' : 's'}`,
    `<div class="row"><span class="mini-label">Name</span>
       <input type="text" id="nsName" style="flex:1 1 auto" value="${escapeHtml((src ? src.name : 'Selection') + ' — subset')}"></div>
     ${state.projects.length ? `<div style="margin-top:.7rem">
       <div class="mini-label" style="margin-bottom:.3rem">Projects</div>
       ${state.projects.map(p => `<label class="ck" style="display:flex"><input type="checkbox" class="nsProj" value="${p.id}"
         ${p.id === active ? 'checked' : ''}> <span style="color:${p.colour}">■</span> ${escapeHtml(p.name)}${
           p.id === active ? ' <span class="note" style="margin-left:.3rem">— open now</span>' : ''}</label>`).join('')}
     </div>` : ''}
     <label class="ck" style="display:flex;margin-top:.7rem"><input type="checkbox" id="nsCopy" checked>
       Keep them in “${escapeHtml(src ? src.name : '')}” as well</label>
     <p class="note" style="margin-top:.5rem">${folder
       ? 'The files are copied into the new dataset’s folder inside the project, so it stands on its own. Unticking moves them instead — the originals are left on disk but no longer listed here.'
       : 'Copying duplicates the stored bytes, so the library grows by the size of the selection. Unticking moves them instead.'}</p>`,
    [{ label: 'Cancel', cls: 'btn-ghost' },
     { label: 'Create', cls: 'btn-primary', fn: async () => {
        const name = ($('nsName') && $('nsName').value || '').trim() || 'New dataset';
        const ids = Array.from(document.querySelectorAll('.nsProj')).filter(c => c.checked).map(c => c.value);
        const copy = !!($('nsCopy') && $('nsCopy').checked);
        const ds = await createDataset(name, ids);
        await sendSelectionTo(recs, ds.id, !copy);
        await openDataset(ds.id);
     } }]);
  setTimeout(() => { const el = $('nsName'); if (el) { el.focus(); el.select(); } }, 60);
}

function sendSelectionDialog(isMove) {
  const recs = targetRecs();
  const others = state.datasets.filter(d => d.id !== state.curDs);
  if (!recs.length || !others.length) return;
  openModal(`${isMove ? 'Move' : 'Copy'} ${recs.length} image${recs.length === 1 ? '' : 's'}`,
    `<div class="row"><span class="mini-label">To</span>
       <select id="sendTarget" style="flex:1 1 auto">
         ${others.map(d => `<option value="${d.id}">${escapeHtml(d.name)} — ${d.count || 0} image(s)</option>`).join('')}
       </select></div>
     <p class="note" style="margin-top:.6rem">${isMove
       ? 'The images leave the current dataset. Their ratings, flags, tags and edit recipes travel with them.'
       : 'The stored files are duplicated, so the library grows by the size of the selection.'}</p>`,
    [{ label: 'Cancel', cls: 'btn-ghost' },
     { label: isMove ? 'Move' : 'Copy', cls: 'btn-primary', fn: async () => {
        const target = $('sendTarget') ? $('sendTarget').value : null;
        if (target) await sendSelectionTo(recs, target, isMove);
     } }]);
}

/* Is the open project a connected folder project? Then a dataset created here
   belongs on disk, and its images have to actually be there. */
function folderBacked() {
  return !!(state.project && state.project.store === 'folder' && state.projectHandle);
}

/* The one place that actually moves or copies.

   The hard part is that an image record does not carry its own bytes — it
   points at them, and WHERE it points depends on the dataset it belongs to. A
   folder dataset's record says `fsFile: 'AH_0001.jpg'`, resolved against ITS
   OWN folder. So moving a record between datasets by repointing `dsId` left it
   pointing into a folder the file was not in, and copying one read `blobs` for
   bytes that were never in the database — which is why a subset of a folder
   dataset came out as a folder and a manifest with no images in it. Both
   failed silently, which is the worst way for a library to fail.

   So bytes are fetched through `sourceBlob` (the one seam that knows where
   they live) and then PLACED according to what the target is. */
async function placeBytes(rec, target, blob) {
  if (target.fs && target.fs.slug) {
    const dir = await fsDatasetDir(target, true);
    const name = await fsUniqueName(dir, rec.origName || rec.name);
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    return { fsFile: name, blob: null };
  }
  return { fsFile: null, blob: blob };
}

async function sendSelectionTo(recs, targetId, isMove) {
  const target = dsById(targetId), src = dsById(state.curDs);
  if (!target) return;
  setStatus(`${isMove ? 'Moving' : 'Copying'} ${recs.length} image${recs.length === 1 ? '' : 's'}…`, 'progress');

  /* A brand-new dataset in a connected folder project gets its folder here, so
     the very first file has somewhere to go. */
  if (!target.fs && folderBacked()) {
    try { await fsWriteDataset(target, []); }
    catch (e) { setStatus('Could not create that dataset in the project folder — ' +
                          escapeHtml(e.message || String(e)), 'error', 9000); return; }
  }

  const crossing = !!(target.fs && target.fs.slug) !== !!(src && src.fs && src.fs.slug);
  let failed = 0, why = '';
  /* Bytes coming OFF disk INTO the browser: the copy is real and it counts
     against the quota. Said before the work starts, because after it has
     happened is too late to decide you would rather not. */
  const intoBrowser = !!(src && src.fs && src.fs.slug) && !(target.fs && target.fs.slug);

  if (isMove && !crossing && !(target.fs && target.fs.slug)) {
    /* Both in the browser: repointing is instant however large the selection. */
    recs.forEach(r => r.dsId = targetId);
    await dbPutMany('images', recs);
    const ids = new Set(recs.map(r => r.id));
    state.images = state.images.filter(r => !ids.has(r.id));
  } else {
    const movedNames = [];
    for (let i = 0; i < recs.length; i++) {
      const r = recs[i], nid = uid('i_');
      let bytes = null;
      try { bytes = await sourceBlob(r.id, r); }
      catch (e) { bytes = null; if (!why) why = e.message || String(e); }
      if (!bytes) { failed++; continue; }
      const placed = await placeBytes(r, target, bytes);
      const t = await dbGet('thumbs', r.id);
      if (t) await dbPut('thumbs', { id: nid, blob: t.blob });
      if (placed.blob) await dbPut('blobs', { id: nid, blob: placed.blob });
      await dbPut('images', Object.assign({}, r, {
        id: nid, dsId: targetId, added: Date.now(), fsFile: placed.fsFile,
      }));
      if (isMove) movedNames.push(r);
      if (i % 5 === 0) { setProgress((i + 1) / recs.length); await sleep(0); }
    }
    if (isMove && movedNames.length) {
      /* The source loses its records. Its FILES are never deleted — the same
         rule removal follows — so a folder source records the exclusion and the
         bytes stay on disk where you can still find them. */
      const ids = movedNames.map(r => r.id);
      for (let i = 0; i < ids.length; i += 300) await dbDelMany(['images', 'thumbs', 'blobs'], ids.slice(i, i + 300));
      if (src && src.fs && src.fs.slug) {
        src.excluded = (src.excluded || []).concat(movedNames.map(r => r.fsFile || r.origName || r.name));
      }
      const gone = new Set(ids);
      state.images = state.images.filter(r => !gone.has(r.id));
    }
  }
  state.sel.clear(); state.cursor = null;

  if (src) { src.count = await dbCountOf(src.id); await saveDataset(src); }
  target.count = await dbCountOf(target.id);
  await saveDataset(target);
  await recomputeSolar(target.id, true);        // the target may declare a different timezone

  /* The manifest is rewritten NOW rather than left to the debounced autosave,
     because a dataset whose folder holds files its dataset.json has not heard
     of is a dataset another tool will open short. */
  if (target.fs && target.fs.slug) {
    try { await fsWriteDataset(target, await dbImagesOf(target.id)); } catch (e) {}
  }
  if (src && src.fs && src.fs.slug) {
    try { await fsWriteDataset(src, await dbImagesOf(src.id)); } catch (e) {}
  }

  await updateQuota();
  render();
  const done = recs.length - failed;
  /* An empty result used to say "0 images copied" and stop, which reads as the
     dataset being empty rather than the files being unreachable. If nothing
     could be read, the REASON is the message. */
  if (!done && failed) {
    setStatus(`Nothing could be copied into “${escapeHtml(target.name)}” — ` +
      escapeHtml(why || 'the images could not be read') + '.', 'error', 12000);
  } else {
    setStatus(`${done} image${done === 1 ? '' : 's'} ${isMove ? 'moved' : 'copied'} to “${escapeHtml(target.name)}”` +
      (intoBrowser && done ? ' · copied from the project folder into browser storage' : '') +
      (failed ? ` · <b>${failed} could not be read</b>` : '') + '.',
      failed ? 'error' : 'success', failed ? 9000 : 6000);
  }
}

/* ── Right-click on a tile ────────────────────────────────────────────────── */
function tileMenu(ev, id) {
  const rec = state.images.find(r => r.id === id);
  if (!rec) return;
  // Right-clicking outside the selection selects that tile first, which is what
  // every file manager does and what makes the menu's counts honest.
  if (!state.sel.has(id)) { state.sel.clear(); state.sel.add(id); state.cursor = id; paintSelection(); renderSelBar(); renderInspector(); }
  const recs = targetRecs();
  const n = recs.length;
  const items = [
    { title: n === 1 ? rec.name : `${n} images selected` },
    { label: 'Open full size', fn: () => openLightbox(id) },
  ];
  if (is360(rec)) items.push({ label: 'View in 360&deg;', fn: () => { _lb360 = false; openLightbox(id).then(lbToggle360); } });
  items.push(
    { sep: true },
    ...selectionDatasetItems(n).slice(1),
    { sep: true },
    { label: '&#10003;&nbsp; Pick', fn: () => flagSelection('pick') },
    { label: '&#10007;&nbsp; Reject', fn: () => flagSelection('reject') },
    { label: 'Clear flag', fn: () => flagSelection('none') },
    { sep: true },
    { label: 'Export selection&hellip;', fn: () => openExportDialog('sel') },
    { label: 'Metadata CSV for selection', fn: () => exportCsv(recs, 'selection') },
    { sep: true },
    { label: `Remove ${n} from this dataset&hellip;`, danger: true, fn: removeSelection },
  );
  openMenuAtPointer(ev, items);
}


/* ═══════════════════════════════════════════════════════════════════════════
   DATASET METADATA
   ---------------------------------------------------------------------------
   A dataset is a field session, and a field session has facts about it that no
   file header records: where you stood, what day it was, what the air was
   doing. EXIF carries the per-frame instant and, if you were lucky, a GPS fix;
   it says nothing about the weather, the visibility or the name of the site.

   So this is deliberately small. Site, coordinates, date, time, conditions —
   the five things you would write in a field notebook — plus the free notes
   that were already here. Every field lands in the exported CSV so the context
   travels with the numbers instead of living only in your head.

   The coordinates are NOT a separate copy. They read and write ds.solar.lat /
   .lon, the very pair the solar calculation uses for frames without their own
   GPS. Typing a site position twice, in two dialogs, and having the sun come
   out wrong because only one of them was updated, is exactly the failure this
   avoids.
   ═══════════════════════════════════════════════════════════════════════════ */

/* type: text | num | date | time | area.  solar: lives on ds.solar, not ds.meta. */
const DS_META_FIELDS = [
  { key: 'site',       label: 'Site',       type: 'text', col: 'site',
    ph: 'where the images were taken' },
  { key: 'lat',        label: 'Latitude',   type: 'num',  col: 'site_lat', solar: true,
    ph: 'e.g. 49.8801', step: '0.000001' },
  { key: 'lon',        label: 'Longitude',  type: 'num',  col: 'site_lon', solar: true,
    ph: 'e.g. -119.4436', step: '0.000001' },
  { key: 'dateFrom',   label: 'Date',       type: 'date', col: 'session_date_from' },
  { key: 'dateTo',     label: 'Date to',    type: 'date', col: 'session_date_to' },
  { key: 'timeFrom',   label: 'Time',       type: 'time', col: 'session_time_from' },
  { key: 'timeTo',     label: 'Time to',    type: 'time', col: 'session_time_to' },
  { key: 'conditions', label: 'Conditions', type: 'area', col: 'conditions',
    ph: 'Weather, light, visibility, instrument readings…' },
];

function dsMeta(ds) {
  if (!ds) return {};
  if (!ds.meta) ds.meta = {};
  return ds.meta;
}
/* One accessor for both homes, so callers never need to know which is which. */
function dsMetaGet(ds, key) {
  const f = DS_META_FIELDS.find(x => x.key === key);
  if (f && f.solar) { const s = solarSettings(ds); return s ? s[key] : null; }
  const v = dsMeta(ds)[key];
  return v == null || v === '' ? null : v;
}
function hasDsMeta(ds) {
  return DS_META_FIELDS.some(f => dsMetaGet(ds, f.key) != null);
}

/* ── Derived from the images ──────────────────────────────────────────────
   "Fill from images" is the honest shortcut: the EXIF already knows the date
   and time window, and where frames carry GPS it knows the position too. It
   fills the boxes rather than computing silently, so what ends up in the CSV
   is still something you looked at and agreed with. */
function dsMetaFromImages(ds, imgs) {
  const out = {};
  const times = (imgs || []).map(r => r.dateMs).filter(Boolean).sort((a, b) => a - b);
  if (times.length) {
    const p = ms => {
      const d = new Date(ms);
      const z = n => String(n).padStart(2, '0');
      return { d: `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`,
               t: `${z(d.getHours())}:${z(d.getMinutes())}` };
    };
    const a = p(times[0]), b = p(times[times.length - 1]);
    out.dateFrom = a.d;
    out.dateTo = b.d === a.d ? '' : b.d;
    out.timeFrom = a.t;
    out.timeTo = b.t;
  }
  const lats = (imgs || []).filter(r => r.exif && r.exif.gps_lat != null);
  if (lats.length) {
    out.lat = +(lats.reduce((s, r) => s + r.exif.gps_lat, 0) / lats.length).toFixed(6);
    out.lon = +(lats.reduce((s, r) => s + r.exif.gps_lon, 0) / lats.length).toFixed(6);
  }
  const folder = (imgs || []).map(r => r.folder).find(Boolean);
  if (folder && !dsMetaGet(ds, 'site')) out.site = folder;
  return out;
}

/* ── The editor ───────────────────────────────────────────────────────────
   Name and notes were already here; the metadata sits between them and the
   dataset facts, which is the order you would fill it in. */
function dsMetaFieldsHtml(ds) {
  const v = k => { const x = dsMetaGet(ds, k); return x == null ? '' : String(x); };
  const inp = (f, extra) => `<input type="${f.type === 'num' ? 'number' : f.type}" id="dm_${f.key}"
      value="${escapeHtml(v(f.key))}" ${f.ph ? `placeholder="${escapeHtml(f.ph)}"` : ''}
      ${f.step ? `step="${f.step}"` : ''} ${extra || ''}>`;
  const F = k => DS_META_FIELDS.find(x => x.key === k);
  return `
    <div class="row" style="margin-top:.7rem"><span class="mini-label">Site</span>
      ${inp(F('site'), 'style="flex:1 1 auto;min-width:0"')}</div>
    <div class="row tight"><span class="mini-label">Position</span>
      ${inp(F('lat'), 'style="width:104px"')}
      ${inp(F('lon'), 'style="width:112px"')}
      <span class="note">°N, °E</span></div>
    <p class="note" style="margin:.15rem 0 0">Shared with <b>Solar geometry</b> — this is the same site position the
      sun angles are computed from for frames without their own GPS fix.</p>
    <div class="row tight" style="margin-top:.5rem"><span class="mini-label">Date</span>
      ${inp(F('dateFrom'), 'style="width:140px"')}
      <span class="note">to</span>
      ${inp(F('dateTo'), 'style="width:140px"')}</div>
    <div class="row tight"><span class="mini-label">Time</span>
      ${inp(F('timeFrom'), 'style="width:104px"')}
      <span class="note">to</span>
      ${inp(F('timeTo'), 'style="width:104px"')}</div>
    <div style="margin-top:.5rem"><div class="mini-label" style="margin-bottom:.3rem">Conditions</div>
      <textarea id="dm_conditions" rows="2"
        placeholder="${escapeHtml(F('conditions').ph)}">${escapeHtml(v('conditions'))}</textarea></div>
    <div class="row" style="margin-top:.45rem">
      <button type="button" class="btn btn-ghost btn-sm" onclick="fillDsMetaFromImages('${ds.id}')"
        title="Read the date, time window and any GPS fix out of the images themselves">Fill from images</button>
    </div>`;
}

/* Writes into the open dialog's inputs, not into the record — nothing is saved
   until Save, so a wrong guess costs a Cancel and nothing else. */
function fillDsMetaFromImages(dsId) {
  const ds = dsById(dsId);
  if (!ds) return;
  const imgs = (state.curDs === dsId) ? state.images : [];
  if (!imgs.length) { setStatus('Open the dataset first — the metadata is read from the images in it.', 'error', 5000); return; }
  const g = dsMetaFromImages(ds, imgs);
  let n = 0;
  Object.keys(g).forEach(k => {
    const el = $('dm_' + k);
    if (el && g[k] !== '' && g[k] != null) { el.value = g[k]; n++; }
  });
  setStatus(n ? `Filled ${n} field(s) from the images. Check them, then Save.` : 'Nothing to fill — no capture times or GPS.',
    n ? 'success' : 'error', 5000);
}

/* Reads the dialog back. Returns true if anything solar-relevant moved, so the
   caller knows whether the sun needs recomputing. */
async function saveDsMetaFromDialog(ds) {
  const m = dsMeta(ds);
  const cfg = solarSettings(ds);
  let solarMoved = false;
  for (const f of DS_META_FIELDS) {
    const el = $('dm_' + f.key);
    if (!el) continue;
    const raw = el.value.trim();
    if (f.solar) {
      const val = raw === '' ? null : parseFloat(raw);
      const next = (val != null && isFinite(val)) ? val : null;
      if (next !== cfg[f.key]) { cfg[f.key] = next; solarMoved = true; }
    } else {
      m[f.key] = raw;
    }
  }
  return solarMoved;
}

/* ── Read-only view in the inspector ─────────────────────────────────────── */
function dsMetaPanelHtml(ds) {
  const rows = [];
  const add = (label, val) => { if (val) rows.push(`<dt>${label}</dt><dd>${escapeHtml(String(val))}</dd>`); };
  add('Site', dsMetaGet(ds, 'site'));
  const lat = dsMetaGet(ds, 'lat'), lon = dsMetaGet(ds, 'lon');
  if (lat != null && lon != null) add('Position', `${(+lat).toFixed(5)}°, ${(+lon).toFixed(5)}°`);
  const df = dsMetaGet(ds, 'dateFrom'), dt = dsMetaGet(ds, 'dateTo');
  if (df) add('Date', dt && dt !== df ? `${df} → ${dt}` : df);
  const tf = dsMetaGet(ds, 'timeFrom'), tt = dsMetaGet(ds, 'timeTo');
  if (tf) add('Time', tt && tt !== tf ? `${tf} – ${tt}` : tf);
  const cond = dsMetaGet(ds, 'conditions');

  if (!rows.length && !cond) {
    return `<div class="insp-sec">
      <div class="h">Session metadata</div>
      <p class="note">Nothing recorded yet — site, position, date, time and conditions.
      These travel into the exported CSV, where they are often the only record of the conditions.</p>
      <button class="btn btn-outline btn-sm" onclick="editDatasetDialog('${ds.id}')">Add session metadata…</button>
    </div>`;
  }
  return `<div class="insp-sec">
      <div class="h">Session metadata</div>
      ${rows.length ? `<dl class="kv">${rows.join('')}</dl>` : ''}
      ${cond ? `<p class="note" style="margin-top:.4rem;color:var(--text)">${escapeHtml(cond).replace(/\n/g, '<br>')}</p>` : ''}
      <button class="btn btn-ghost btn-sm" style="margin-top:.45rem"
              onclick="editDatasetDialog('${ds.id}')">Edit metadata…</button>
    </div>`;
}


/* ═══════════════════════════════════════════════════════════════════════════
   SIDE PANEL WIDTHS
   ---------------------------------------------------------------------------
   Both side panels resize by dragging their inner edge. The stored value is a
   PREFERENCE, not a width: it is what you get when there is room, and the
   panels give space back when there isn't, rather than squeezing the grid down
   to a column of thumbnails on a laptop screen.

   That distinction is why the CSS clamp() expressions are recomputed here in
   JS rather than merely overridden. One place decides how wide the panels are,
   it accounts for MIN_GRID_W, and it never overwrites what you asked for just
   because the window happened to be narrow for a moment. The CSS clamps remain
   as the answer before this code runs.
   ═══════════════════════════════════════════════════════════════════════════ */

const PANEL_LIMITS = { side: [160, 460], insp: [210, 560] };

/* The drag handles must cost the layout NOTHING, or the arithmetic below is
   wrong by however much they cost. At 8px wide on a −4px margin either side
   they net to zero; at 7px on −3px they netted 1px each, and the grid landed
   at 558 against a 560 minimum. The panels are border-box, so their own 1px
   borders are already inside the width. Asserted in the test suite, because
   this is the kind of thing a later CSS tweak breaks silently. */
const PANEL_CHROME = 0;

/* The CSS defaults, in numbers: clamp(178px, 22vw, 250px) and
   clamp(236px, 26vw, 310px). Kept in step with head.html by hand — they are
   two lines apart in intent even if not in the file. */
const defSideW = () => Math.round(Math.min(250, Math.max(178, window.innerWidth * 0.22)));
const defInspW = () => Math.round(Math.min(310, Math.max(236, window.innerWidth * 0.26)));

/* assumeOpen makes the inspector's width count even while it is collapsed,
   which is what enforceLayout needs to decide whether it could be re-opened
   without immediately having to fold it again. */
function effPanelWidths(assumeOpen) {
  const W = window.innerWidth;
  const open = assumeOpen || state.inspectorOpen;
  let side = clamp(state.sideW || defSideW(), PANEL_LIMITS.side[0], PANEL_LIMITS.side[1]);
  let insp = clamp(state.inspW || defInspW(), PANEL_LIMITS.insp[0], PANEL_LIMITS.insp[1]);
  /* Short of room, the inspector yields first: the library is a navigation
     surface you need to keep your place in, the inspector is a readout. */
  let over = side + (open ? insp : 0) + PANEL_CHROME + MIN_GRID_W - W;
  if (over > 0 && open) { const give = Math.min(over, insp - PANEL_LIMITS.insp[0]); insp -= give; over -= give; }
  if (over > 0)         { side -= Math.min(over, side - PANEL_LIMITS.side[0]); }
  return { side: Math.round(side), insp: Math.round(insp) };
}

function applyPanelWidths() {
  const w = effPanelWidths();
  const root = document.documentElement;
  root.style.setProperty('--side-w', w.side + 'px');
  root.style.setProperty('--insp-w', w.insp + 'px');
  const rz = $('rzInsp');
  if (rz) rz.classList.toggle('hidden', !state.inspectorOpen);
  [['rzSide', w.side], ['rzInsp', w.insp]].forEach(([id, val]) => {
    const h = $(id);
    if (h) { h.setAttribute('aria-valuenow', val); h.title = `${val} px — drag to resize, double-click to reset`; }
  });
  return w;
}

function setPanelWidth(which, px, save) {
  const [lo, hi] = PANEL_LIMITS[which];
  const other = which === 'side'
    ? (state.inspectorOpen ? effPanelWidths().insp : 0)
    : effPanelWidths().side;
  const roomy = Math.max(lo, Math.min(hi, window.innerWidth - other - PANEL_CHROME - MIN_GRID_W));
  const val = Math.round(clamp(px, lo, roomy));
  state[which === 'side' ? 'sideW' : 'inspW'] = val;
  applyPanelWidths();
  /* Narrowing the grid is exactly the condition the toolbar overflows under,
     and it has no other way to find out — nothing resized the WINDOW. Safe to
     call: layoutToolbar reaches applyPanelWidths but never comes back here. */
  layoutToolbar();
  if (save) saveSettings();
  return val;
}

function resetPanelWidth(which) {
  state[which === 'side' ? 'sideW' : 'inspW'] = null;
  applyPanelWidths();
  layoutToolbar();
  saveSettings();
  setStatus(`${which === 'side' ? 'Library' : 'Inspector'} width reset.`, 'success', 2500);
}

function wirePanelResize() {
  [['rzSide', 'side', 'sidebar'], ['rzInsp', 'insp', 'inspector']].forEach(([id, which, panel]) => {
    const h = $(id);
    if (!h) return;
    h.setAttribute('role', 'separator');
    h.setAttribute('aria-orientation', 'vertical');
    h.setAttribute('aria-label', which === 'side' ? 'Resize library panel' : 'Resize inspector panel');
    h.tabIndex = 0;

    h.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      const el = $(panel);
      const startX = ev.clientX, startW = el ? el.offsetWidth : effPanelWidths()[which];
      h.classList.add('drag');
      document.body.classList.add('rzing');
      try { h.setPointerCapture(ev.pointerId); } catch (e) { /* older engines */ }
      /* The inspector's handle sits on its LEFT edge, so dragging right makes
         it narrower — the sign flip is the whole difference between the two. */
      const move = e => setPanelWidth(which, which === 'side' ? startW + (e.clientX - startX)
                                                             : startW - (e.clientX - startX), false);
      const up = () => {
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        h.removeEventListener('pointercancel', up);
        h.classList.remove('drag');
        document.body.classList.remove('rzing');
        saveSettings();
        enforceLayout();
        layoutToolbar();
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
      h.addEventListener('pointercancel', up);
    });

    h.addEventListener('dblclick', () => resetPanelWidth(which));

    h.addEventListener('keydown', e => {
      const step = e.shiftKey ? 40 : 12;
      const cur = effPanelWidths(true)[which];
      if (e.key === 'ArrowLeft')  { setPanelWidth(which, cur + (which === 'side' ? -step : step), true); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { setPanelWidth(which, cur + (which === 'side' ? step : -step), true); e.preventDefault(); }
      else if (e.key === 'Home' || e.key === 'Escape') { resetPanelWidth(which); e.preventDefault(); }
    });
  });
  applyPanelWidths();
}


/* ═══════════════════════════════════════════════════════════════════════════
   PROJECTS
   ---------------------------------------------------------------------------
   A project is one body of work: its datasets, everything the tools make from
   them, and a record of what was run. It lives EITHER in a folder on disk or
   in this browser — chosen once, at the hub, and never both. That is why there
   is no sync code in this file. With two live copies there would always be a
   question of which one is right, and the answer would sometimes be wrong.

   Lifecycle — create, rename, delete — belongs to the hub on the Vis-O-Matic
   home page, which is the single place projects are managed. Everything else
   happens here: opening the current one, filing datasets into it, and writing
   changes through to it.

   THE PROJECT LIST IS NOT THIS TOOL'S. It lives in the shared `vom-suite`
   database, which every page on the origin can read. The Manager's own
   `projects` store predates that and held the same idea at a smaller scope —
   a grouping of datasets — so the two are now one thing, and the old records
   are migrated across on first load rather than left as a second list nobody
   maintains.
   ═══════════════════════════════════════════════════════════════════════════ */

const HUB_URL = 'https://www.jonathancinnamon.com/vis-o-matic/#projects';

/* ── Migration ────────────────────────────────────────────────────────────
   Runs once. Every project already in the local store becomes a browser
   project in the suite store, KEEPING ITS ID so every dataset's projectIds
   still point at the right thing. Idempotent by id, so a half-finished run
   simply completes next time. */
async function migrateProjectsToSuite() {
  let done = null;
  try { done = await dbGet('meta', 'projectsMigrated'); } catch (e) {}
  if (done) return 0;
  let local = [];
  try { local = await dbAll('projects'); } catch (e) { local = []; }
  let n = 0;
  for (const p of local) {
    if (await vomProjectGet(p.id)) continue;
    await vomProjectPut({
      id: p.id, name: p.name || 'Untitled project', store: 'browser',
      created: p.created || Date.now(), updated: p.created || Date.now(),
      datasets: 0, runs: 0, folderName: null,
      colour: p.colour || PROJECT_COLOURS[n % PROJECT_COLOURS.length],
      note: p.note || '',
    });
    n++;
  }
  await dbPut('meta', true, 'projectsMigrated');
  if (n) log(`migrated ${n} project(s) into the shared suite store`);
  return n;
}

/* ── Loading ──────────────────────────────────────────────────────────────
   Projects come from the suite store, so the sidebar and the hub cannot
   disagree about what exists. Colour and note are the Manager's own additions
   to the record — presentation and annotation, not lifecycle. */
async function loadProjects() {
  let ps = [];
  try { ps = await vomProjects(); } catch (e) { log('suite store unavailable: ' + e.message); }
  ps.forEach((p, i) => {
    if (!p.colour) p.colour = PROJECT_COLOURS[i % PROJECT_COLOURS.length];
    if (p.note == null) p.note = '';
  });
  state.projects = ps.sort((a, b) => (a.created || 0) - (b.created || 0));
  return state.projects;
}

/* The project the hub says is open.

   This ASKS the browser whether the folder grant still stands, which needs no
   user gesture, and connects silently when it does — Chrome increasingly keeps
   that grant for a folder you have used before, so most reloads now open
   straight into the project with nothing to press. What it still never does is
   REQUEST permission: that needs a gesture, and calling it without one fails
   silently in a way indistinguishable from a folder that has gone away. */
async function loadCurrentProject() {
  let id = null;
  try { id = await vomCurrentId(); } catch (e) {}
  state.project = id ? (prById(id) || await vomProjectGet(id)) : null;
  state.projectAccess = (state.project && state.project.store === 'browser') ? 'ok' : 'unknown';
  if (state.project && state.project.store === 'folder') {
    let q = { ok: false };
    try { q = await vomQuietAccess(state.project); } catch (e) {}
    if (q.ok) {
      state.projectHandle = q.handle;
      state.projectAccess = 'ok';
    }
  }
  return state.project;
}

/* Everything connecting normally does, minus the permission prompt — run after
   a silent reconnect so the folder's datasets appear without a click. */
async function afterFolderConnected(quiet) {
  const p = state.project;
  if (!p || state.projectAccess !== 'ok' || !state.projectHandle) return;
  try {
    const n = await scanProjectFolder();
    for (const ds of state.datasets.filter(isFolderDs)) await syncFolderDataset(ds, true);

    /* Anything FILED into this project that is not on disk yet gets copied now.
       Filing happens in four places — the hub, the row's + button, the import
       dialog, the add menu — and only the Manager ones ever called the copy, so
       a dataset filed from the hub stayed in the browser while a subset of it,
       made here, was written to the folder. The project then held the child and
       not the parent. Connecting is the moment that can see the whole list, so
       it is the right place to make the folder match what the project claims. */
    const owed = state.datasets.filter(d =>
      (d.projectIds || []).includes(p.id) && !isFolderDs(d));
    if (owed.length) await autoCopyIntoFolder(owed.map(d => d.id));

    if (state.curDs) state.images = await dbImagesOf(state.curDs);
    if (!quiet) {
      setStatus(`Connected to <b>${escapeHtml(p.folderName || p.name)}</b> · ${n} dataset(s). ` +
        `Changes are saved there as you make them.`, 'success', 6000);
    }
  } catch (e) {
    /* Said out loud even on the silent path: Drive's provider hands over files
       that are not fully downloaded, and a library that quietly came up four
       frames short is worse than one that says it could not read them. */
    setStatus('The project folder could not be read fully — ' +
      escapeHtml(e.message || String(e)), 'error', 9000);
  }
}

/* ── Folder access ────────────────────────────────────────────────────────
   A stored handle looks perfectly valid after a reload and then the FIRST
   WRITE throws NotAllowedError unless permission has been re-requested from a
   real user gesture. Asking on load would move that failure to save time,
   which is the worst possible moment for it to appear — so this runs from the
   button, and until it succeeds the bar says the folder is not connected
   rather than pretending everything is fine. */
async function connectProjectFolder() {
  const p = state.project;
  if (!p || p.store !== 'folder') return true;
  let r;
  try { r = await vomEnsureAccess(p); }
  catch (e) { r = { ok: false, reason: e.message || String(e) }; }
  if (r.ok) {
    state.projectHandle = r.handle;
    state.projectAccess = 'ok';
    setStatus(`Connected to <b>${escapeHtml(p.folderName || p.name)}</b>. Reading its datasets…`, 'progress');
    await afterFolderConnected(false);
    render();
  } else {
    state.projectHandle = null;
    state.projectAccess = 'denied';
    setStatus(escapeHtml(r.reason || 'Could not reach that folder.'), 'error', 9000);
  }
  renderProjectBar();
  return !!r.ok;
}

/* ── Writing through to a folder ──────────────────────────────────────────
   Only the STATE is written continuously: names, notes, session metadata,
   ratings, flags, tags and edit recipes. Rendered pixels are not, because
   every render of a JPEG is a re-encode and doing one per slider nudge would
   compound generation loss all afternoon — and because applying a geometry
   edit to a 2:1 equirectangular frame breaks the row-to-elevation mapping the
   Analyzer depends on, silently. Autosave is exactly the mechanism that could
   erode that guard rail without anyone noticing, so it stops short of it. */
function slugFor(name) {
  const s = String(name || 'dataset').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-');
  return s || 'dataset';
}
async function writeJson(dirHandle, name, obj) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(obj, null, 2));
  await w.close();
}
function datasetDoc(ds, imgs) {
  return {
    format: 'vom-dataset', version: 1,
    id: ds.id, name: ds.name, note: ds.note || '',
    created: ds.created, updated: Date.now(),
    meta: ds.meta || {}, solar: ds.solar || null,
    projectIds: ds.projectIds || [],
    /* Files this dataset has been told to leave alone. Without this a rescan
       would put back every image you removed, which would feel like the tool
       arguing with you. */
    excluded: ds.excluded || [],
    images: (imgs || []).map(r => ({
      file: r.origName || r.name, name: r.name,
      rating: r.rating || 0, flag: r.flag || '', tags: r.tags || [],
      note: r.note || '', edits: hasEdits(r) ? r.edits : null,
    })),
  };
}
/* The folder name is fixed at first write and kept on the record. Deriving it
   from the CURRENT name each time meant renaming a dataset wrote its manifest
   into a fresh folder while the images stayed in the old one — two half
   datasets and no error. The display name lives in dataset.json, where a
   rename belongs; the folder is just where the files are. */
async function fsWriteDataset(ds, imgs) {
  if (!state.projectHandle) throw new Error('the project folder is not connected');
  if (!ds.fs || !ds.fs.slug) {
    const dsRoot = await state.projectHandle.getDirectoryHandle('datasets', { create: true });
    let slug = slugFor(ds.name), n = 2;
    const taken = new Set();
    for await (const [name, h] of dsRoot.entries()) if (h.kind === 'directory') taken.add(name);
    while (taken.has(slug)) slug = slugFor(ds.name) + '-' + (n++);
    ds.fs = { slug };
    await dbPut('datasets', ds);
  }
  const dir = await fsDatasetDir(ds, true);
  await writeJson(dir, 'dataset.json', datasetDoc(ds, imgs));
  return dir;
}
/* The images themselves, copied in so the folder is self-contained — a
   collaborator who gets the folder gets everything, not a set of references to
   paths on your machine. Files already there are skipped by name and size,
   which is what makes this cheap to call again. */
async function fsWriteImages(ds, imgs, onProgress) {
  const dir = await fsWriteDataset(ds, imgs);
  const have = new Map();
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file' && name !== 'dataset.json') {
      try { have.set(name, (await h.getFile()).size); } catch (e) { have.set(name, -1); }
    }
  }
  let written = 0;
  for (let i = 0; i < imgs.length; i++) {
    if (state.job && state.job.cancel) break;
    const r = imgs[i];
    const fname = r.origName || r.name;
    const bytes = await originalBytes(r.id);
    if (!bytes) continue;
    if (have.get(fname) === bytes.length) continue;     // already there, same size
    const fh = await dir.getFileHandle(fname, { create: true });
    const w = await fh.createWritable();
    await w.write(bytes);
    await w.close();
    written++;
    if (onProgress) onProgress(i + 1, imgs.length);
  }
  return written;
}

/* ── Autosave ─────────────────────────────────────────────────────────────
   Browser projects are already continuous: every rating, flag and edit goes
   straight to IndexedDB as it happens. What this adds is the write-through to
   a folder project, debounced — rating ten images is one write, not ten.

   The indicator exists because "saved" and "the folder stopped responding"
   need to look different. A folder project can fail in ways a browser project
   cannot: the drive unmounts, Drive is still syncing, permission lapses. */
let _psaveTimer = null, _psaveState = 'idle';
function setSaveState(s, detail) {
  _psaveState = s;
  const el = $('projSave');
  if (!el) return;
  el.className = 'psave ' + s;
  el.textContent = s === 'saving' ? 'saving…' : s === 'error' ? 'not saved' : s === 'saved' ? 'saved' : '';
  el.title = detail || '';
}
function autosave() {
  if (!state.project) { setSaveState('idle'); return; }
  if (state.project.store !== 'folder') {
    setSaveState('saved');
    /* A browser project is already continuous in IndexedDB. What this adds is
       the mirror, if one is set — same debounce, same reason. */
    if (state.project.mirror && typeof vomMirrorTouch === 'function') vomMirrorTouch(state.project);
    return;
  }
  clearTimeout(_psaveTimer);
  setSaveState('saving');
  _psaveTimer = setTimeout(async () => {
    try {
      if (!state.projectHandle) { setSaveState('error', 'The project folder is not connected.'); return; }
      const ds = dsById(state.curDs);
      if (ds) await fsWriteDataset(ds, state.images);
      state.project.updated = Date.now();
      await vomProjectPut(state.project);
      setSaveState('saved');
    } catch (e) {
      /* Said at the moment it fails, not at the moment the file is next
         needed. A silent write failure on a research library is how a day's
         curation disappears. */
      setSaveState('error', e.message || String(e));
      setStatus('Could not write to the project folder — ' + escapeHtml(e.message || String(e)), 'error', 9000);
    }
  }, 1000);
}

/* ── The project bar ──────────────────────────────────────────────────────
   One line under the tool bar. Ignorable by design: someone who arrived to
   look at one folder of photographs should never have to think about
   projects, so with none open it is a single quiet link. */
function renderProjectBar() {
  const el = $('projBar');
  if (!el) return;
  const p = state.project;
  const hub = `<a class="pb-hub" href="${HUB_URL}"
       title="Create, rename, fill and delete projects"><span class="pb-hub-i">&#9638;</span>Projects hub</a>`;
  if (!p) {
    el.classList.add('empty');
    el.innerHTML = `<span class="pb-none">No project open — this is your whole library</span>` +
      `<span class="pb-mid"></span>` + hub;
    return;
  }
  el.classList.remove('empty');
  const pill = p.store === 'folder'
    ? `<span class="pb-pill folder" title="Lives in a folder on your computer">folder</span>`
    : `<span class="pb-pill browser" title="Lives in this browser">browser</span>`;
  const needsConnect = p.store === 'folder' && state.projectAccess !== 'ok';
  el.innerHTML =
    `<span class="pb-label">Project</span>` +
    /* Clickable: the name is what you reach for when you want to SEE the
       project, and it used to be the one part of the bar that did nothing. */
    `<a class="pb-name" href="${HUB_URL}" title="Open this project in the Projects hub"
        style="border-bottom-color:${p.colour || 'var(--accent)'}">${escapeHtml(p.name)}</a>` +
    pill +
    (p.store === 'folder' && p.folderName ? `<span class="pb-sub">${escapeHtml(p.folderName)}</span>` : '') +
    (p.mirror ? `<span class="pb-pill mirror" title="Mirrored to ${escapeHtml(p.mirror.name)}">mirrored</span>` : '') +
    (needsConnect
      ? `<button class="btn btn-outline btn-sm pb-warn" onclick="connectProjectFolder()">Reconnect folder</button>`
      : `<span class="psave" id="projSave"></span>`) +
    /* Actions in the middle, the hub pinned right. No "Copy into folder" any
       more: filing a dataset into a folder project copies it, so a button
       asking you to do by hand what the project already promised was only ever
       a sign the promise was not kept. */
    `<span class="pb-mid">` +
      (p.store === 'folder' && !needsConnect
        ? `<button class="btn btn-ghost btn-sm" onclick="rescanProjectFolder()"
             title="Read the folder again — for changes made outside this tab">Refresh</button>` : '') +
    `</span>` + hub;
  if (!needsConnect) setSaveState(_psaveState === 'idle' ? 'saved' : _psaveState);
}

async function saveProjectRecord(p) {
  p.updated = Date.now();
  await vomProjectPut(p);
}

/* ═══════════════════════════════════════════════════════════════════════════
   READING A FOLDER PROJECT
   ---------------------------------------------------------------------------
   This is what makes a folder project worth choosing rather than merely
   possible: its images are read FROM DISK and never copied into browser
   storage, so a hundred 2:1 frames cost nothing against the quota. What the
   browser keeps is a thumbnail and the measured numbers — a cache, rebuildable
   from the folder at any time.

   Every image's bytes already funnelled through two functions, so there is
   exactly one place that has to know where a file lives.
   ═══════════════════════════════════════════════════════════════════════════ */

function isFolderDs(ds) { return !!(ds && ds.fs && ds.fs.slug); }

async function fsDatasetDir(ds, create) {
  if (!state.projectHandle) throw new Error('the project folder is not connected');
  const root = await state.projectHandle.getDirectoryHandle('datasets', { create: !!create });
  return await root.getDirectoryHandle(ds.fs ? ds.fs.slug : slugFor(ds.name), { create: !!create });
}

/* ── Reading a dataset that lives in SOMEONE ELSE'S folder ────────────────
   A dataset belongs to a list of projects; its bytes live in exactly one
   place. Once adopted into a folder project the files are on disk and the
   browser copies are freed — so with a BROWSER project open, `fsDatasetDir`
   threw "the project folder is not connected" and every read failed. That is
   why a subset made in a browser project of a dataset that came from a folder
   project came out empty, while the same subset made inside the folder project
   was fine.

   So the folder is followed to whichever project owns it, asking QUIETLY for
   permission — no gesture, so this is safe to call from anywhere. Cached per
   dataset because the walk touches the projects store and a 300-image copy
   would otherwise do it 300 times. */
const _fsDirCache = new Map();                   // dsId -> handle | null

function invalidateFsDirCache() { _fsDirCache.clear(); }

async function foreignDatasetDir(ds) {
  if (!ds || !isFolderDs(ds)) return null;
  if (_fsDirCache.has(ds.id)) return _fsDirCache.get(ds.id);
  let dir = null;
  const owners = (ds.projectIds || []).slice();
  if (state.project && state.project.store === 'folder') owners.unshift(state.project.id);
  for (const pid of owners) {
    let p = prById(pid);
    if (!p) { try { p = await vomProjectGet(pid); } catch (e) { p = null; } }
    if (!p || p.store !== 'folder') continue;
    let q = { ok: false };
    try { q = await vomQuietAccess(p); } catch (e) {}
    if (!q.ok) continue;
    try {
      const root = await q.handle.getDirectoryHandle('datasets', { create: false });
      dir = await root.getDirectoryHandle(ds.fs.slug);
      break;
    } catch (e) { /* that project is not the one holding it */ }
  }
  _fsDirCache.set(ds.id, dir);
  return dir;
}

/* The one place that decides where an image's bytes come from. */
async function sourceBlob(id, rec) {
  const r = rec || state.images.find(x => x.id === id) || await dbGet('images', id);
  if (r && r.fsFile) {
    const ds = dsById(r.dsId);
    if (!ds) return null;
    let dir = null;
    try { dir = await fsDatasetDir(ds, false); } catch (e) { dir = null; }
    if (!dir) dir = await foreignDatasetDir(ds);
    if (!dir) {
      throw new Error('these images live in a project folder on your computer, and that folder is ' +
        'not reachable from here — open that folder project once and it will work from every ' +
        'project the dataset belongs to');
    }
    const fh = await dir.getFileHandle(r.fsFile);
    return await fh.getFile();
  }
  const b = await dbGet('blobs', id);
  return b ? b.blob : null;
}

/* Two shoots can both contain AH_0001.jpg. Overwriting the first with the
   second would be silent data loss in a folder the user owns. */
async function fsUniqueName(dir, name) {
  const taken = new Set();
  for await (const [n] of dir.entries()) taken.add(n);
  if (!taken.has(name)) return name;
  const stem = stemOf(name), ext = extOf(name);
  for (let i = 2; i < 10000; i++) {
    const cand = `${stem}_${i}.${ext}`;
    if (!taken.has(cand)) return cand;
  }
  return `${stem}_${Date.now()}.${ext}`;
}

/* ── Removing a folder dataset ────────────────────────────────────────────
   A folder project's datasets ARE its folders, so deleting the browser records
   removed nothing: the next scan found dataset.json still sitting there and
   built the dataset straight back. It came back "soon after" because that scan
   runs on every reconnect.

   Nothing on disk is deleted and nothing is moved. The manifest gains a
   `removed` stamp, the scan skips it, and the folder stays exactly where it
   was with every image in it — so this is undoable by hand as well as by the
   Restore button in the hub. The same idea as `excluded` one level up: the
   library is told to leave something alone rather than the files being taken
   away. */
async function markFolderDatasetRemoved(ds) {
  const dir = await fsDatasetDir(ds, false);
  let doc = {};
  try {
    const fh = await dir.getFileHandle('dataset.json');
    doc = JSON.parse(await (await fh.getFile()).text());
  } catch (e) { doc = datasetDoc(ds, await dbImagesOf(ds.id)); }
  doc.removed = Date.now();
  await writeJson(dir, 'dataset.json', doc);
}

/* ── Scanning ─────────────────────────────────────────────────────────────
   A folder project's datasets are whatever is in datasets/. Found by their
   dataset.json, because a bare folder of images is not yet a dataset — the
   manifest is what says the Manager made it and holds the curation. */
async function scanProjectFolder() {
  if (!state.projectHandle) return 0;
  let root;
  try { root = await state.projectHandle.getDirectoryHandle('datasets', { create: true }); }
  catch (e) { return 0; }
  let found = 0;
  for await (const [slug, h] of root.entries()) {
    if (h.kind !== 'directory') continue;
    let doc = null;
    try {
      const fh = await h.getFileHandle('dataset.json');
      doc = JSON.parse(await (await fh.getFile()).text());
    } catch (e) { continue; }               // not a dataset, leave it alone
    if (!doc || doc.format !== 'vom-dataset') continue;
    if (doc.removed) continue;              // removed here; the files stay put

    let ds = dsById(doc.id);
    if (!ds) {
      ds = { id: doc.id, name: doc.name || slug, note: doc.note || '',
             created: doc.created || Date.now(), projectIds: doc.projectIds || [],
             count: 0, fs: { slug } };
      state.datasets.push(ds);
    } else {
      ds.fs = { slug };
      ds.name = doc.name || ds.name;
      ds.note = doc.note || '';
    }
    ds.meta = doc.meta || ds.meta || {};
    if (doc.solar) ds.solar = doc.solar;
    ds.excluded = doc.excluded || [];
    await dbPut('datasets', ds);
    found++;
  }
  state.datasets.sort((a, b) => natCmp(a.name, b.name));
  return found;
}

/* ── Bringing a folder dataset's images in ────────────────────────────────
   Files on disk that have no record yet are decoded once — for the thumbnail,
   the quick metrics and the EXIF, exactly as an import does — but the BYTES
   ARE NOT STORED. Records whose file has gone are dropped, because a record
   pointing at a file that is not there is worse than no record: it looks like
   an image right up until you click it. */
async function syncFolderDataset(ds, quiet) {
  if (!isFolderDs(ds) || !state.projectHandle) return { added: 0, gone: 0 };
  const dir = await fsDatasetDir(ds, true);

  let doc = {};
  try {
    const fh = await dir.getFileHandle('dataset.json');
    doc = JSON.parse(await (await fh.getFile()).text());
  } catch (e) { doc = {}; }
  const byFile = new Map((doc.images || []).map(i => [i.file, i]));
  const excluded = new Set(doc.excluded || []);

  const onDisk = new Map();
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file' && name !== 'dataset.json' && IMG_RE.test(name) && !excluded.has(name)) {
      onDisk.set(name, h);
    }
  }

  const have = await dbImagesOf(ds.id);
  const haveByFile = new Map(have.map(r => [r.fsFile || r.origName, r]));

  /* Records whose file has gone. */
  const gone = have.filter(r => !onDisk.has(r.fsFile || r.origName));
  if (gone.length) {
    const ids = gone.map(r => r.id);
    for (let i = 0; i < ids.length; i += 300) await dbDelMany(['images', 'thumbs', 'blobs'], ids.slice(i, i + 300));
  }

  /* Files with no record. */
  const fresh = [...onDisk.entries()].filter(([name]) => !haveByFile.has(name));
  let added = 0, failed = 0;
  if (fresh.length && !quiet) setStatus(`Reading ${fresh.length} file(s) from the project folder…`, 'progress');

  const batchImgs = [], batchThumbs = [];
  for (let i = 0; i < fresh.length; i++) {
    const [name, h] = fresh[i];
    try {
      const f = await h.getFile();
      const bmp = await createImageBitmap(f);
      const t = drawTo(bmp, THUMB_MAX);
      const mSrc = drawTo(bmp, METRIC_MAX);
      const m = quickMetrics(mSrc.cx.getImageData(0, 0, mSrc.w, mSrc.h).data, mSrc.w * mSrc.h);
      const thumbBlob = await canvasToBlob(t.cv, 'image/jpeg', 0.82);
      const exif = await readExifHead(f);
      const W = bmp.width, H = bmp.height;
      bmp.close && bmp.close();
      const dt = exifToDate(exif.datetime);
      const saved = byFile.get(name) || {};
      const id = uid('i_');
      batchImgs.push({
        id, dsId: ds.id,
        name: saved.name || name, origName: name,
        fsFile: name,                       // ← the bytes live on disk, not in `blobs`
        size: f.size, type: f.type || ('image/' + extOf(name)),
        w: W, h: H, tw: t.w, th: t.h,
        folder: '', added: Date.now(),
        dateMs: dt ? dt.getTime() : null,
        exif, m,
        edits: saved.edits || null,
        rating: saved.rating || 0, flag: saved.flag || 'none',
        tags: saved.tags || [], note: saved.note || '',
      });
      batchThumbs.push({ id, blob: thumbBlob });
      added++;
    } catch (e) { failed++; }
    if (batchImgs.length >= 12) {
      await dbPutMany('thumbs', batchThumbs.splice(0));
      await dbPutMany('images', batchImgs.splice(0));
    }
    if (!quiet && (i % 4 === 0 || i === fresh.length - 1)) {
      setStatus(`Reading ${i + 1} / ${fresh.length} from the folder…`, 'progress');
      setProgress((i + 1) / fresh.length);
    }
  }
  if (batchThumbs.length) await dbPutMany('thumbs', batchThumbs);
  if (batchImgs.length) await dbPutMany('images', batchImgs);

  ds.count = await dbCountOf(ds.id);
  await dbPut('datasets', ds);
  if (!quiet) {
    const bits = [];
    if (added) bits.push(`<b>${added}</b> new file(s) read from the folder`);
    if (gone.length) bits.push(`${gone.length} no longer on disk`);
    if (failed) bits.push(`${failed} could not be read`);
    if (bits.length) setStatus(bits.join(' · ') + '.', failed ? 'error' : 'success', 7000);
    else clearStatus();
  }
  return { added, gone: gone.length, failed };
}

/* Rescan every folder dataset. Offered as a button rather than done on a
   timer: Drive sync and a collaborator both change the folder underneath you,
   and a library that silently reshuffled itself while you were curating would
   be worse than one you have to ask. */
async function rescanProjectFolder() {
  if (!state.project || state.project.store !== 'folder') { setStatus('This is not a folder project.', 'error', 5000); return; }
  if (state.projectAccess !== 'ok' && !(await connectProjectFolder())) return;
  setStatus('Rescanning the project folder…', 'progress');
  try {
    const n = await scanProjectFolder();
    let added = 0, gone = 0, failed = 0;
    for (const ds of state.datasets.filter(isFolderDs)) {
      const r = await syncFolderDataset(ds, true);
      added += r.added; gone += r.gone; failed += r.failed || 0;
    }
    if (state.curDs) state.images = await dbImagesOf(state.curDs);
    render();
    const bits = [`${n} dataset(s) in the folder`];
    if (added) bits.push(`${added} new image(s)`);
    if (gone) bits.push(`${gone} gone`);
    if (failed) bits.push(`<b>${failed} could not be read</b>`);
    setStatus(bits.join(' · ') + '.', failed ? 'error' : 'success', 8000);
  } catch (e) {
    /* Drive's file provider is lazy and will hand over files that are not
       fully downloaded. Reported rather than skipped: a dataset that quietly
       loses four frames is far worse than one that says it could not read
       them. */
    setStatus('Could not read the project folder — ' + escapeHtml(e.message || String(e)), 'error', 9000);
  }
}

/* Removing an image from a FOLDER dataset never deletes the file. The folder
   is yours; the Manager records that this dataset excludes it, so a rescan
   does not simply put it back. */
async function excludeFromFolderDataset(ds, names) {
  if (!isFolderDs(ds)) return;
  ds.excluded = Array.from(new Set([...(ds.excluded || []), ...names]));
  await dbPut('datasets', ds);
  autosave();
}

/* Copy the open dataset into the project folder, images and all. Explicit
   rather than automatic: it can move hundreds of megabytes, and a background
   task that quietly does that is not a kindness. */
/* ── Joining a folder project puts a dataset ON DISK ──────────────────────
   Filing a browser-held dataset into a folder project used to leave it in the
   browser with a "Copy into folder" button beside it — so a project that says
   it lives in a folder had datasets that did not, and the only sign was a
   button you had to know to press.

   Now it copies itself. The records are then repointed at the folder and their
   browser copies FREED, because keeping both would mean two originals and a
   question about which one is right — and not filling browser storage is the
   entire reason for choosing a folder project.

   The files it writes are the untouched originals; nothing is re-encoded, so
   this cannot alter a single measured pixel. */
async function adoptIntoFolder(ds, imgs, onProgress) {
  const dir = await fsWriteDataset(ds, imgs);          // allocates the slug on first write
  const taken = new Set();
  for await (const [n, h] of dir.entries()) if (h.kind === 'file') taken.add(n);

  const changed = [];
  let written = 0;
  for (let i = 0; i < imgs.length; i++) {
    if (state.job && state.job.cancel) break;
    const r = imgs[i];
    if (r.fsFile) continue;                             // already on disk
    let bytes = null;
    try { bytes = await sourceBlob(r.id, r); } catch (e) { bytes = null; }
    if (!bytes) continue;
    let name = r.origName || r.name;
    if (taken.has(name)) name = await fsUniqueName(dir, name);
    taken.add(name);
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(bytes);
    await w.close();
    r.fsFile = name;
    changed.push(r);
    written++;
    if (onProgress) onProgress(i + 1, imgs.length);
  }
  if (changed.length) {
    await dbPutMany('images', changed);
    /* Only after every write has closed. Freeing the browser copy before the
       file is safely on disk would be the one ordering that can lose an image. */
    const ids = changed.map(r => r.id);
    for (let i = 0; i < ids.length; i += 300) await dbDelMany(['blobs'], ids.slice(i, i + 300));
  }
  await fsWriteDataset(ds, imgs);                       // manifest matches the folder
  return written;
}

/* Called wherever a dataset can join a project. Silent and instant when there
   is nothing to do, which is most of the time. */
async function autoCopyIntoFolder(dsIds) {
  const p = state.project;
  if (!p || p.store !== 'folder' || state.projectAccess !== 'ok' || !state.projectHandle) return 0;
  const todo = (dsIds || []).map(dsById)
    .filter(d => d && (d.projectIds || []).includes(p.id) && !isFolderDs(d));
  if (!todo.length) return 0;

  state.job = { cancel: false };
  let total = 0, failed = 0;
  try {
    for (const ds of todo) {
      /* ALWAYS from the database, never from `state.images`.

         This used to prefer the in-memory list when the dataset was the open
         one, which is faster and was wrong at the only moment that matters:
         running from `afterFolderConnected`, the page has just loaded and
         `state.images` is still empty. The dataset then looked like it had no
         images, so it was given a folder and nothing was put in it — the exact
         shape of the bug this call was added to fix, one layer down. */
      const imgs = await dbImagesOf(ds.id);
      if (!imgs.length) { await fsWriteDataset(ds, imgs); continue; }
      setSaveState('saving', `Copying ${ds.name} into ${p.folderName || p.name}`);
      setStatus(`Copying <b>${escapeHtml(ds.name)}</b> into ` +
                `<b>${escapeHtml(p.folderName || p.name)}</b>…`, 'progress');
      try {
        total += await adoptIntoFolder(ds, imgs, (i, n) => {
          setStatus(`Copying <b>${escapeHtml(ds.name)}</b> — ${i} / ${n}…`, 'progress');
          setProgress(i / n);
        });
        if (ds.id === state.curDs) state.images = await dbImagesOf(ds.id);
      } catch (e) {
        failed++;
        setStatus(`Could not copy <b>${escapeHtml(ds.name)}</b> into the project folder — ` +
          escapeHtml(e.message || String(e)), 'error', 9000);
      }
    }
  } finally {
    state.job = null;
  }
  await updateQuota();
  renderProjectBar();
  render();
  if (!failed) {
    setSaveState('saved');
    setStatus(total
      ? `<b>${total}</b> file(s) copied into <b>${escapeHtml(p.folderName || p.name)}</b>. ` +
        `They are read from there now, so they no longer count against browser storage.`
      : 'Already in the project folder.', 'success', 7000);
  }
  return total;
}

/* ── Init ─────────────────────────────────────────────────────────────────
   Deliberately tolerant: the suite store being unavailable — a private window,
   blocked site data — must leave the Manager working as a plain local library
   rather than failing outright. */
async function initProjects() {
  try {
    await migrateProjectsToSuite();
    await loadProjects();
    await loadCurrentProject();
  } catch (e) {
    log('projects unavailable: ' + (e.message || e));
    if (!state.projects) state.projects = [];
    state.project = null;
  }
  renderProjectBar();
  /* Not awaited: the library must paint whether or not a folder is reachable,
     and reading a project folder over a network drive can take a while. */
  if (state.projectAccess === 'ok' && state.projectHandle) {
    afterFolderConnected(true).then(render);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   OUTPUTS AND THE RUN LOG
   ---------------------------------------------------------------------------
   Where a tool's output goes. The rule everywhere in the suite is that a
   project never silently takes over: the destination is a line in the export
   dialog, defaulting to the project when one is open, and Downloads is always
   still there. A tool that quietly stopped putting files where you expected
   them would be worse than one that never offered.
   ═══════════════════════════════════════════════════════════════════════════ */

const outputDest = { mode: 'auto' };     // 'auto' | 'download' | 'project' | 'both'

function projectWritable() {
  return !!(state.project && (state.project.store !== 'folder' || state.projectAccess === 'ok'));
}
function effectiveDest() {
  if (outputDest.mode !== 'auto') return outputDest.mode;
  return projectWritable() ? 'project' : 'download';
}

/* The Manager's equivalent of the other tools' split button. It is a dialog
   rather than a button, so the destination is a line in the dialog — same three
   choices, same words, so the two never read as different features. */
function outputDestHtml() {
  if (!state.project) {
    return `<p class="note" style="margin-top:.5rem">No project open, so this downloads to your computer.
      <a href="${HUB_URL}">Start a project</a> to keep outputs with the work that made them.</p>`;
  }
  const p = state.project;
  const blocked = p.store === 'folder' && state.projectAccess !== 'ok';
  const cur = effectiveDest();
  const opt = (v, label) => `<option value="${v}"${cur === v ? ' selected' : ''}>${label}</option>`;
  return `<div class="row" style="margin-top:.5rem">
      <span class="mini-label">Save as</span>
      <select id="expDest" onchange="outputDest.mode=this.value">
        ${opt('project', `into ${escapeHtml(p.name)}`)}
        ${opt('download', 'download to computer')}
        ${opt('both', 'save to both')}
      </select>
    </div>` +
    (blocked ? `<div class="warn" style="margin-top:.4rem">The project folder is not connected, so this will
       download instead. <b>Reconnect folder</b> in the project bar first to save it there.</div>` : '');
}

/* One call for every tool output: puts the file where it was asked to go and
   records what produced it. The run log is what turns a folder of CSVs into
   something you could write a methods section from — which of these answered
   "what settings produced this figure" is otherwise nobody's memory. */
async function deliverOutput(blob, filename, meta) {
  const dest = effectiveDest();
  const done = [];
  if (dest === 'download' || dest === 'both') { downloadBlob(blob, filename); done.push('downloaded'); }
  if ((dest === 'project' || dest === 'both') && state.project) {
    try {
      if (state.project.store === 'folder' && state.projectAccess !== 'ok' && !(await connectProjectFolder())) {
        throw new Error('the project folder is not connected');
      }
      const saved = await vomSaveOutput(state.project, state.projectHandle,
        { tool: (meta && meta.tool) || 'manager', name: filename, blob,
          /* Filed under the dataset it came from, so two sets exported with the
             same settings do not produce two files of the same name in one
             directory where only a _2 suffix tells them apart. */
          datasetName: (dsById(state.curDs) || {}).name || '',
          datasetId: state.curDs || null });
      await vomLogRun(state.project, state.projectHandle, {
        tool: (meta && meta.tool) || 'manager',
        version: MANAGER_VERSION,
        datasetId: state.curDs, datasetName: (dsById(state.curDs) || {}).name || '',
        params: (meta && meta.params) || {},
        outputs: [saved.name],
      });
      done.push(state.project.store === 'folder' ? 'saved into the project folder' : 'saved into the project');
    } catch (e) {
      /* Fall back to a download rather than losing the file. Losing an export
         because a folder went away would be the worst possible trade. */
      if (dest === 'project') { downloadBlob(blob, filename); done.push('downloaded instead'); }
      setStatus('Could not save into the project — ' + escapeHtml(e.message || String(e)) +
        (dest === 'project' ? ' It was downloaded instead.' : ''), 'error', 9000);
    }
  }
  return done;
}

/* ── Showing them back ────────────────────────────────────────────────────
   Two readings of the same project: "what did I do" and "what is in here". */
function fmtWhen(ms) {
  if (!ms) return '';
  const d = new Date(ms), n = Date.now();
  if (n - ms < 864e5) return 'today ' + d.toTimeString().slice(0, 5);
  if (n - ms < 7 * 864e5) return Math.round((n - ms) / 864e5) + 'd ago';
  return d.toISOString().slice(0, 10);
}
function paramsSummary(params) {
  const ks = Object.keys(params || {});
  if (!ks.length) return '';
  return ks.slice(0, 5).map(k => `${k} ${params[k]}`).join(' · ');
}
let _projPanel = { runs: [], outputs: [], loaded: false };
async function loadProjectActivity() {
  if (!state.project) { _projPanel = { runs: [], outputs: [], loaded: true }; return; }
  try {
    _projPanel.runs = await vomRuns(state.project, state.projectHandle);
    _projPanel.outputs = await vomOutputs(state.project, state.projectHandle);
  } catch (e) { _projPanel.runs = []; _projPanel.outputs = []; }
  _projPanel.loaded = true;
  renderInspector();
}
function projectActivityHtml() {
  const p = state.project;
  if (!p) return '';
  if (!_projPanel.loaded) { setTimeout(loadProjectActivity, 0); }
  const runs = _projPanel.runs.slice(0, 12);
  const byTool = {};
  _projPanel.outputs.forEach(o => { (byTool[o.tool] = byTool[o.tool] || []).push(o); });
  const tools = Object.keys(byTool).sort();

  return `<details class="insp-sec"${_op('projruns')} ontoggle="inspToggle('projruns',this.open)">
      <summary>Project activity</summary>
      <div class="mini-label" style="margin:.2rem 0 .3rem">What was run</div>
      ${runs.length ? `<div class="runlist">${runs.map(r => `
        <div class="run">
          <div class="rt"><b>${escapeHtml(r.tool)}</b> <span class="v">${escapeHtml(r.version || '')}</span>
            <span class="w">${fmtWhen(r.created)}</span></div>
          ${r.datasetName ? `<div class="rd">${escapeHtml(r.datasetName)}</div>` : ''}
          ${paramsSummary(r.params) ? `<div class="rp">${escapeHtml(paramsSummary(r.params))}</div>` : ''}
          ${(r.outputs || []).length ? `<div class="ro">${r.outputs.map(escapeHtml).join(', ')}</div>` : ''}
        </div>`).join('')}</div>`
        : `<p class="note">Nothing yet. Exports made with this project open are recorded here — which tool,
           which dataset, what settings, and the files it produced.</p>`}

      <div class="mini-label" style="margin:.8rem 0 .3rem">Files in the project</div>
      ${tools.length ? tools.map(t => `
        <div class="outgrp"><b>${escapeHtml(t)}</b>
          ${byTool[t].slice(0, 10).map(o => `<div class="outf">${escapeHtml(o.name)}
            <span class="sz">${fmtBytes(o.size || 0)}</span></div>`).join('')}
          ${byTool[t].length > 10 ? `<div class="outf note">…and ${byTool[t].length - 10} more</div>` : ''}
        </div>`).join('')
        : `<p class="note">No output files yet.</p>`}
      <p class="note" style="margin-top:.5rem">Runs are recorded one file each, so two tools finishing at the
      same moment cannot overwrite one another's record.</p>
    </details>`;
}

</script>
