/*__VOM_TOKENS_START__ — generated from shared/vom_shared.py, do not edit here */
:root{
  --primary:#2c5f7a; --primary-dark:#1e4358;
  --accent:#1a9080; --accent-hover:#168070; --accent-light:#e6f4f1;
  --border:#dde8ed; --bg-page:#f0f4f7; --bg-white:#ffffff;
  --text:#1a2332; --text-muted:#6b7a8d;
  --danger:#c0392b; --danger-bg:#fef0ef;
  --warning-bg:#fff8e6; --warning-border:#f0a500;
  --success-bg:#e6f4f1;
  --vom-bar:#16323f;      /* suite ribbon, deepest */
  --vom-tool:#2c5f7a;     /* tool ribbon, mid blue */
  --radius:6px;
  --vom-font:'Inter',system-ui,-apple-system,sans-serif;
  --vom-display:'VisOmatic','Courier New',ui-monospace,monospace;
  --vom-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --vom-teal:#5fd0bd;     /* the suite tagline, and only that */
  /* Legacy aliases — the Cutter and the landing page use the short names. */
  --font:var(--vom-font); --display:var(--vom-display); --mono:var(--vom-mono);
}
/*__VOM_TOKENS_END__*/

/* Tokens specific to this tool. Outside the markers on purpose —
   anything inside them is replaced wholesale by the next sync.
   The side panels yield before the centre column does. Fixed 250 + 310 left a
   620px window with about 60px of grid, and no amount of toolbar collapsing
   can rescue that. */
:root{ --side-w:clamp(178px, 22vw, 250px); --insp-w:clamp(236px, 26vw, 310px); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg-page);color:var(--text);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden}

.vom-toolbar{background:var(--vom-tool);color:#fff;padding:.45rem 1.5rem .5rem;
  box-shadow:0 2px 6px rgba(0,0,0,.15);flex:0 0 auto;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.vom-toolbar h1{font-family:var(--vom-display);font-size:1.16rem;font-weight:400;letter-spacing:.01em;margin:0;line-height:1.2}
.vom-toolbar p{margin:0;font-size:.78rem;opacity:.8}
.vom-toolbar .tb-right{margin-left:auto;display:flex;gap:.4rem;align-items:center}
@media(max-width:640px){.vom-bar,.vom-toolbar{padding-left:.9rem;padding-right:.9rem}}

/* ── App shell ─────────────────────────────────────────────────────────── */
#app{flex:1 1 auto;display:flex;min-height:0}
#sidebar{width:var(--side-w);flex:0 0 auto;background:var(--bg-white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
#centre{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
#inspector{width:var(--insp-w);flex:0 0 auto;background:var(--bg-white);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
#inspector.collapsed{display:none}

/* ── Panel resize handles ───────────────────────────────────────────────
   Seven pixels wide on a −3px margin, so the handle straddles the 1px border
   and costs the layout nothing. The visible line only appears on hover or
   drag; the rest of the time the border is the border. */
.rzh{flex:0 0 auto;width:8px;margin:0 -4px;z-index:6;position:relative;cursor:col-resize;
  background:transparent;touch-action:none}
.rzh.hidden{display:none}
.rzh::after{content:'';position:absolute;left:2.5px;top:0;bottom:0;width:3px;border-radius:2px;
  background:transparent;transition:background .12s}
.rzh:hover::after,.rzh.drag::after,.rzh:focus-visible::after{background:var(--primary)}
.rzh:focus-visible{outline:none}
body.rzing{cursor:col-resize;user-select:none}
body.rzing *{cursor:col-resize !important}
.pane-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin}
.pane-head{flex:0 0 auto;padding:.55rem .8rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.4rem;background:var(--bg-page)}
.pane-title{font-family:var(--vom-display);font-size:.98rem;color:var(--primary-dark);letter-spacing:.01em}
.pane-head .right{margin-left:auto;display:flex;gap:.25rem}

/* ── Library head and scope ────────────────────────────────────────────────
   The two tabs are gone. Organising projects lives at the hub now, so the
   sidebar is one list with a filter over it. */
.lib-scope{flex:0 0 auto;display:block;padding:.55rem .7rem;
  background:var(--bg-page);border-bottom:1px solid var(--border)}
.lib-where{display:block;min-width:0;font-size:.86rem;color:var(--text);line-height:1.25;
  overflow:hidden;text-overflow:ellipsis}
.lib-where b.lib-proj{font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:1px}
/* The two-state toggle. Segmented rather than two loose buttons so it reads as
   one control with one answer — and so the unpressed half is visibly the way
   back rather than a second thing to do. */
.lib-tog{display:flex;width:100%;border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;background:var(--bg-white)}
.lib-tog button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:.32rem;
  padding:.34rem .4rem;font:inherit;font-size:.78rem;line-height:1.2;color:var(--text-muted);
  background:transparent;border:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-tog button+button{border-left:1px solid var(--border)}
.lib-tog button:hover{background:var(--bg-page);color:var(--text)}
.lib-tog button.on{background:var(--accent);color:#fff;font-weight:600}
.lib-tog button.on:hover{background:var(--accent)}
.lib-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.lib-tog button.on .lib-dot{box-shadow:0 0 0 1px rgba(255,255,255,.65)}
.lib-sub{margin:.34rem .1rem 0;font-size:.74rem;color:var(--text-muted);line-height:1.3}
.lib-addrow{margin-top:.45rem}
.lib-addrow .btn{width:100%;justify-content:center}
.lib-outside{padding:.3rem .7rem;font-size:.74rem;color:var(--text-muted);background:var(--warning-bg);
  border-bottom:1px solid var(--border)}
.lib-outside a{color:var(--primary);cursor:pointer;text-decoration:underline}
.pchip{display:inline-flex;align-items:center;gap:.22rem;font-size:.78rem;padding:.1rem .34rem;
  border:1px solid var(--border);border-radius:3px;background:var(--bg-page);white-space:nowrap}

.lib-action{padding:.55rem .7rem .3rem}
.lib-action .btn{width:100%;justify-content:center}
.crumb{display:flex;align-items:center;gap:.4rem;padding:.45rem .7rem;font-size:.78rem;
  border-bottom:1px solid var(--border);background:var(--bg-page)}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer;white-space:nowrap}
.crumb a:hover{text-decoration:underline}
.crumb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Library rows ──────────────────────────────────────────────────────── */
.sec-label{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);padding:.7rem .8rem .25rem;display:flex;align-items:center;gap:.35rem}
.sec-label .right{margin-left:auto}
.lrow{display:flex;align-items:flex-start;gap:.4rem;padding:.35rem .7rem;font-size:.82rem;cursor:pointer;
  border-left:3px solid transparent;user-select:none;border-bottom:1px solid var(--bg-page)}
.lrow:hover{background:var(--bg-page)}
.lrow.active{background:var(--accent-light);border-left-color:var(--accent);color:var(--primary-dark)}
.lrow.active .nm{font-weight:600}
.lrow .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto;margin-top:5px}
.lrow .body{flex:1 1 auto;min-width:0}
.lrow .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{display:block;font-size:.67rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow .acts{flex:0 0 auto;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.lrow:hover .acts,.lrow.active .acts{opacity:1}
.lrow .acts button{border:none;background:transparent;cursor:pointer;font-size:.78rem;line-height:1;
  padding:2px 4px;border-radius:4px;color:var(--text-muted)}
.lrow .acts button:hover{background:var(--bg-white);color:var(--text)}
.lrow .acts button.del:hover{color:var(--danger)}
.lrow input.ren{width:100%;font-size:.8rem;padding:.15rem .3rem}
.tree-empty{padding:.5rem .8rem;font-size:.73rem;color:var(--text-muted);font-style:italic;line-height:1.5}

/* ── Toolbar above the grid ────────────────────────────────────────────── */
/* The main bar must never wrap onto a second row. It is nowrap + hidden
   overflow, and anything that stops fitting is MOVED (not restyled) into the
   overflow tray by layoutToolbar(), so every control keeps its element,
   its id and its handlers. */
.gridbar{flex:0 0 auto;background:var(--bg-white);border-bottom:1px solid var(--border);
  padding:.45rem .8rem;display:flex;align-items:center;gap:.5rem;flex-wrap:nowrap;overflow:hidden;
  min-height:40px}
.gridbar > *{flex:0 0 auto}
.gridbar .grow{flex:1 1 0;min-width:0}
#selbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}

#gbTray{position:fixed;z-index:680;background:var(--bg-white);border:1px solid var(--border);
  border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:.6rem .7rem;display:none;
  flex-direction:column;gap:.55rem;max-width:min(92vw,340px)}
#gbTray.show{display:flex}
#gbTray .sep{display:none}
#gbTray .ctrl-grp{flex-wrap:wrap}
#gbTray .gb-label{min-width:52px}
.gridbar .sep{width:1px;height:20px;background:var(--border);flex:0 0 auto}
.gb-label{font-size:.7rem;color:var(--text-muted);white-space:nowrap}
/* Keep each label with the controls it names, so the bar wraps between groups
   rather than orphaning "Filter" at the end of a line. */
.ctrl-grp{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:nowrap}
select,input[type=text],input[type=number],input[type=search],textarea{
  padding:.3rem .5rem;border:1px solid var(--border);border-radius:var(--radius);
  font-family:var(--font);font-size:.8rem;color:var(--text);background:var(--bg-white);outline:none;
  transition:border-color .15s;max-width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
select.sm,input.sm{padding:.22rem .4rem;font-size:.76rem}
/* Long option text ("colour distance from reference") sized the select to the
   whole window and pushed everything else into the overflow on a normal
   display. The select shows a truncated label; the tooltip and the open list
   still give the full text. */
#gridbar #sortSel{max-width:186px}
#gridbar #groupSel{max-width:148px}
#gridbar #filterTxt{width:104px}
#gbTray #sortSel,#gbTray #groupSel{max-width:none}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
input[type=range]{accent-color:var(--accent)}
textarea{font-family:monospace;font-size:.78rem;resize:vertical;width:100%}
label.ck{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;cursor:pointer;white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:5px;padding:.36rem .8rem;border:none;border-radius:var(--radius);
  font-family:var(--font);font-size:.8rem;font-weight:500;cursor:pointer;transition:background .15s,opacity .15s;
  white-space:nowrap;line-height:1.3}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg-page);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:.2rem .55rem;font-size:.74rem}
.btn-icon{padding:.2rem .42rem;font-size:.85rem;line-height:1}
.btn.on{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}

/* ── The grid ──────────────────────────────────────────────────────────── */
#gridWrap{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0;padding:.7rem .8rem 2.5rem;position:relative}
.grp-head{font-family:var(--vom-display);font-size:.92rem;color:var(--primary-dark);
  padding:.7rem 0 .3rem;border-bottom:1px solid var(--border);margin-bottom:.55rem;
  display:flex;align-items:center;gap:.5rem}
.grp-head:first-child{padding-top:0}
.grp-head .cnt{font-family:var(--font);font-size:.7rem;color:var(--text-muted);font-weight:400}
.grp-head .pick{margin-left:auto}
/* align-items:start is load-bearing — without it every tile in a row stretches to
   the tallest one, so a single portrait frame gives its whole row a slab of dead
   white space under each landscape image. */
.grid{display:grid;gap:10px;margin-bottom:.4rem;align-items:start}
.tile{position:relative;background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;user-select:none;transition:border-color .1s,box-shadow .1s}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset,0 2px 6px rgba(26,144,128,.25)}
.tile.cursor{outline:2px dashed var(--primary);outline-offset:1px}
.tile.rejected{opacity:.42}
/* The image and its overlays live in their own relative box so that badges,
   swatch and stars anchor to the PICTURE, not to the tile — otherwise the star
   strip lands on top of the filename caption. */
.tile .tw{position:relative;display:block;line-height:0}
.tile .ph{width:100%;display:block;background:
   linear-gradient(45deg,#e6ecf0 25%,transparent 25%,transparent 75%,#e6ecf0 75%),
   linear-gradient(45deg,#e6ecf0 25%,#f6f9fb 25%,#f6f9fb 75%,#e6ecf0 75%);
  background-size:14px 14px;background-position:0 0,7px 7px}
.tile img{width:100%;display:block;object-fit:contain;background:#eef2f5}
.tile.fitcover img{object-fit:cover}
/* Caption = filename · metric. The filename is 20% smaller and elides in the
   MIDDLE, so a sequential camera name keeps both its head and its frame number
   while the metric — the thing you changed the sort to see — stays full size and
   never gets pushed out. Middle elision is not something CSS can do to one
   string, hence the head/tail split: the head shrinks and ellipsises, the tail
   never shrinks. */
.tile .cap{font-size:.68rem;font-family:monospace;color:var(--text-muted);padding:3px 5px;
  border-top:1px solid var(--border);background:var(--bg-white);
  display:flex;align-items:baseline;gap:4px;overflow:hidden}
.tile .cap .nm{flex:0 1 auto;min-width:0;display:flex;font-size:.8em;color:var(--text);font-weight:600}
.tile .cap .nm .hd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tile .cap .nm .tl{flex:0 0 auto;white-space:pre}
.tile .cap .mt{flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badges{position:absolute;top:4px;left:4px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 8px)}
.bdg{font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:999px;background:rgba(22,50,63,.82);color:#fff;
  letter-spacing:.02em}
.bdg.edit{background:var(--warning-border);color:#3a2a00}
.bdg.rej{background:var(--danger)}
.bdg.pick{background:var(--accent)}
.tile .stars{position:absolute;bottom:0;left:0;right:0;padding:2px 4px;font-size:.72rem;color:#ffd166;
  background:linear-gradient(transparent,rgba(22,50,63,.72));opacity:0;transition:opacity .12s;letter-spacing:1px}
.tile:hover .stars,.tile .stars.has{opacity:1}
/* ── The status dot ───────────────────────────────────────────────────────
   One mark, read at a glance across a whole grid:
     hollow          nothing
     filled yellow   selected
     filled green    picked          filled red   rejected
     + yellow ring   also selected
   Flag fills and selection rings, rather than one overriding the other, because
   the normal move is to select a batch and then flag it — you need to watch the
   flags land without losing sight of what is still selected.
   It replaces the mean-colour swatch that used to sit here, which was ambiguous
   enough that it had to be asked about. Mean colour lives in the inspector, the
   dataset colour summary and the CSV. */
.tile .sdot{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;
  background:transparent;border:2px solid rgba(255,255,255,.92);
  box-shadow:0 0 0 1px rgba(16,26,32,.45), 0 1px 3px rgba(0,0,0,.4);
  transition:background .1s, box-shadow .1s}
.tile .sdot.sel{background:#ffd23f}
.tile .sdot.pick{background:#34c759}
.tile .sdot.rej{background:#e74c3c}
/* selected AND flagged: the flag keeps the fill, selection becomes the ring */
.tile .sdot.sel.pick,.tile .sdot.sel.rej{
  box-shadow:0 0 0 2px #ffd23f, 0 0 0 3px rgba(16,26,32,.45), 0 1px 3px rgba(0,0,0,.4)}
.empty-state{padding:2.5rem 1rem;text-align:center;color:var(--text-muted);font-size:.88rem}
.empty-state b{display:block;font-family:var(--vom-display);font-size:1.1rem;color:var(--primary-dark);margin-bottom:.4rem}

/* ── Drop zone ─────────────────────────────────────────────────────────── */
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:1.2rem 1rem;text-align:center;
  color:var(--text-muted);font-size:.82rem;cursor:pointer;transition:border-color .15s,background .15s;margin:.5rem 0}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-light)}
.drop-zone b{color:var(--accent)}
.drop-zone .sub{font-size:.71rem;opacity:.8;margin-top:3px}
#dropOverlay{position:fixed;inset:0;background:rgba(26,144,128,.14);border:4px dashed var(--accent);
  z-index:400;display:none;align-items:center;justify-content:center;pointer-events:none}
#dropOverlay div{background:var(--bg-white);padding:1rem 1.6rem;border-radius:var(--radius);
  font-family:var(--vom-display);font-size:1.2rem;color:var(--primary-dark);box-shadow:0 6px 24px rgba(0,0,0,.2)}

/* ── Inspector ─────────────────────────────────────────────────────────── */
.insp-sec{border-bottom:1px solid var(--border);padding:.6rem .8rem}
.insp-sec > .h{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);margin-bottom:.45rem;display:flex;align-items:center;gap:.3rem}
.insp-sec > .h .right{margin-left:auto}
details.insp-sec > summary{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);cursor:pointer;list-style:none;user-select:none}
details.insp-sec > summary::-webkit-details-marker{display:none}
details.insp-sec > summary::before{content:'\25B6  ';font-size:.55rem;opacity:.6}
details.insp-sec[open] > summary::before{content:'\25BC  '}
details.insp-sec > *:not(summary){margin-top:.5rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px .6rem;font-size:.74rem}
.kv dt{color:var(--text-muted);white-space:nowrap}
.kv dd{color:var(--text);word-break:break-word;font-variant-numeric:tabular-nums}
.insp-img{width:100%;border:1px solid var(--border);border-radius:4px;background:#eef2f5;display:block}
.row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.row.tight{gap:.25rem}
.stack{display:flex;flex-direction:column;gap:.45rem}
.mini-label{font-size:.7rem;color:var(--text-muted);min-width:62px}
.slider-row{display:flex;align-items:center;gap:.4rem;font-size:.72rem}
.slider-row input[type=range]{flex:1 1 auto;min-width:0}
.slider-row .val{font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--text)}
.slider-row .lb{min-width:64px;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg-page);border:1px solid var(--border);
  border-radius:999px;padding:1px 8px;font-size:.7rem;color:var(--text-muted)}
.chip b{color:var(--text)}
.chip button{border:none;background:none;cursor:pointer;color:var(--danger);font-size:.75rem;line-height:1;padding:0}
.note{font-size:.7rem;color:var(--text-muted);line-height:1.45}
.warn{background:var(--warning-bg);border-left:3px solid var(--warning-border);padding:.45rem .6rem;
  border-radius:4px;font-size:.71rem;color:#7a5500;line-height:1.45}
.danger-note{background:var(--danger-bg);border-left:3px solid var(--danger);padding:.45rem .6rem;
  border-radius:4px;font-size:.71rem;color:#8d2b20;line-height:1.45}
.ok-note{background:var(--success-bg);border-left:3px solid var(--accent);padding:.45rem .6rem;
  border-radius:4px;font-size:.71rem;color:#0f6a5d;line-height:1.45}

/* ── Storage meter ─────────────────────────────────────────────────────── */
.meter{height:6px;background:var(--bg-page);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meter.hot i{background:var(--warning-border)}
.meter.full i{background:var(--danger)}

/* ── Status / progress ─────────────────────────────────────────────────── */
#statusBar{flex:0 0 auto;padding:.4rem .8rem;font-size:.78rem;display:none;align-items:center;gap:.6rem}
#statusBar.show{display:flex}
#statusBar.progress{background:var(--warning-bg);border-top:1px solid var(--warning-border);color:#7a5500}
#statusBar.success{background:var(--success-bg);border-top:1px solid var(--accent);color:#0f6a5d}
#statusBar.error{background:var(--danger-bg);border-top:1px solid var(--danger);color:var(--danger)}
#statusBar .bar{flex:0 0 160px;height:6px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden}
#statusBar .bar i{display:block;height:100%;background:currentColor;width:0}

/* ── Lightbox ──────────────────────────────────────────────────────────── */
#lightbox{position:fixed;inset:0;background:#0f181d;z-index:500;display:none;flex-direction:column}
#lightbox.show{display:flex}
#lbTop{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;color:#fff;
  background:rgba(0,0,0,.35);flex-wrap:wrap}
#lbTop .name{font-family:monospace;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbTop .pos{font-size:.75rem;opacity:.7;font-variant-numeric:tabular-nums}
#lbTop .right{margin-left:auto;display:flex;gap:.35rem;align-items:center}
#lbTop .btn-ghost{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.3)}
#lbTop .btn-ghost:hover{background:rgba(255,255,255,.14);color:#fff}
#lbBody{flex:1 1 auto;display:flex;min-height:0}
#lbStage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;
  position:relative;overflow:hidden}
#lbStage canvas{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 4px 30px rgba(0,0,0,.5)}
#lb360Canvas{max-width:none;max-height:none;box-shadow:none;cursor:grab;touch-action:none;display:block}
#lb360Bar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;
  gap:.6rem;background:rgba(12,20,25,.82);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:.35rem .8rem;color:#fff;font-size:.76rem;backdrop-filter:blur(6px);z-index:3;max-width:92%}
#lb360Bar.hidden{display:none}
#lb360Bar select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
#lb360Bar select option{color:var(--text)}
#lb360Bar .btn-ghost{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.28)}
#lb360Bar .btn-ghost:hover{background:rgba(255,255,255,.14);color:#fff}
#lb360Bar #lb360Zoom{font-variant-numeric:tabular-nums;opacity:.85;min-width:56px}
#lb360Bar #lb360Hint{opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lbStage.is360{overflow:hidden}
#lbStage.zoom{overflow:auto;align-items:flex-start;justify-content:flex-start;cursor:grab}
#lbStage.zoom canvas{max-width:none;max-height:none}
#lbSide{width:290px;flex:0 0 auto;background:var(--bg-white);overflow-y:auto;border-left:1px solid rgba(0,0,0,.2)}
#lbSide.hidden{display:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;
  border:none;font-size:1.6rem;padding:.5rem .7rem;cursor:pointer;border-radius:var(--radius);line-height:1}
.lb-nav:hover{background:rgba(0,0,0,.65)}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}

/* ── Anchored menu (right-click, the add button, the overflow button) ───── */
#ctxMenu{position:fixed;z-index:700;background:var(--bg-white);border:1px solid var(--border);
  border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:4px;min-width:186px;display:none}
#ctxMenu.show{display:block}
#ctxMenu button{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:.36rem .6rem;font-size:.8rem;border-radius:4px;color:var(--text);font-family:var(--font);
  white-space:nowrap}
#ctxMenu button:hover{background:var(--accent-light)}
#ctxMenu button.danger{color:var(--danger)}
#ctxMenu button.danger:hover{background:var(--danger-bg)}
#ctxMenu button:disabled{opacity:.45;cursor:default}
#ctxMenu button:disabled:hover{background:none}
#ctxMenu .mtitle{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);
  padding:.3rem .6rem .2rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#ctxMenu .msep{height:1px;background:var(--border);margin:4px 2px}

/* ── Chooser lists inside dialogs ──────────────────────────────────────── */
.chooser{max-height:46vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius)}
.chooser label{display:flex;align-items:center;gap:.5rem;padding:.35rem .6rem;font-size:.82rem;
  cursor:pointer;border-bottom:1px solid var(--bg-page)}
.chooser label:hover{background:var(--bg-page)}
.chooser label:last-child{border-bottom:none}
.chooser .meta{margin-left:auto;font-size:.68rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.chooser .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.swatch-pick{display:flex;gap:6px;flex-wrap:wrap}
.swatch-pick span{width:22px;height:22px;border-radius:5px;cursor:pointer;display:inline-block}
.swatch-pick span.on{outline:2px solid var(--text);outline-offset:2px}

/* ── Modal ─────────────────────────────────────────────────────────────── */
#modalBack{position:fixed;inset:0;background:rgba(16,26,32,.55);z-index:600;display:none;
  align-items:center;justify-content:center;padding:1rem}
#modalBack.show{display:flex}
.modal{background:var(--bg-white);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.3);
  max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modal .mh{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-family:var(--vom-display);
  font-size:1.05rem;color:var(--primary-dark)}
.modal .mb{padding:.9rem 1rem;overflow-y:auto;font-size:.84rem}
.modal .mf{padding:.7rem 1rem;border-top:1px solid var(--border);display:flex;gap:.4rem;justify-content:flex-end}
.modal .mf .left{margin-right:auto}
/* A labelled rule, for dialogs that have grown a second half. */
.dlg-rule{display:flex;align-items:center;gap:.55rem;margin:1rem 0 .1rem;
  font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.dlg-rule::after{content:'';flex:1 1 auto;height:1px;background:var(--border)}

/* ── Tables ────────────────────────────────────────────────────────────── */
table.mini{width:100%;border-collapse:collapse;font-size:.74rem}
table.mini th,table.mini td{padding:3px 6px;border-bottom:1px solid var(--border);text-align:left}
table.mini th{color:var(--text-muted);font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em}
table.mini td.num{text-align:right;font-variant-numeric:tabular-nums}

.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c6d4dc;border-radius:6px;border:2px solid var(--bg-page)}
::-webkit-scrollbar-track{background:transparent}

/* ── Project bar ─────────────────────────────────────────────────────────
   One line under the tool bar. When nothing is open it is deliberately quiet:
   a person who came to look at one folder of photographs should not have to
   read anything about projects to get on with it. */
#projBar{flex:0 0 auto;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
  padding:.34rem 1.5rem;background:var(--bg-white);border-bottom:1px solid var(--border);
  font-size:.8rem;min-height:30px}
#projBar.empty{background:var(--bg-page)}
#projBar .pb-label{font-family:var(--vom-mono);font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-muted)}
#projBar .pb-name{font-weight:600;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:1px;text-decoration:none;cursor:pointer}
#projBar a.pb-name:hover{color:var(--primary)}
#projBar .pb-sub{color:var(--text-muted);font-size:.76rem}
#projBar .pb-none{color:var(--text-muted)}
#projBar .pb-mid{flex:1 1 auto;display:flex;align-items:center;gap:.4rem;min-width:0}
#projBar .pb-link{color:var(--primary);text-decoration:none;font-size:.78rem}
#projBar .pb-link:hover{text-decoration:underline}
/* The one control every page in the suite shares, so it looks like one. */
#projBar .pb-hub{flex:0 0 auto;display:inline-flex;align-items:center;gap:.32rem;font-size:.78rem;
  text-decoration:none;padding:.22rem .6rem;border-radius:var(--radius);
  border:1px solid var(--primary);color:var(--primary);background:var(--bg-white)}
#projBar .pb-hub:hover{background:var(--primary);color:#fff}
#projBar .pb-hub-i{font-size:.72rem;opacity:.85}
#projBar .pb-pill.mirror{background:#eef3f7;color:var(--primary);border:1px solid var(--border)}
#projBar .pb-warn{border-color:var(--warning-border)!important;background:var(--warning-bg)!important;color:#7a5200!important}
#projBar .pb-pill{font-family:var(--vom-mono);font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:.1rem .34rem;border-radius:3px}
#projBar .pb-pill.folder{background:var(--accent-light);color:#12695c}
#projBar .pb-pill.browser{background:var(--bg-page);color:var(--text-muted);border:1px solid var(--border)}
/* "Saved" and "the folder stopped responding" must not look alike. */
.psave{font-size:.74rem;color:var(--text-muted);min-width:3.4rem}
.psave.saving{color:var(--text-muted)}
.psave.saved{color:var(--accent)}
.psave.error{color:var(--danger);font-weight:600}
.lrow.proj-open{background:var(--accent-light)}

/* Project activity — runs and output files. */
.runlist{display:flex;flex-direction:column;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.run{background:var(--bg-white);padding:.4rem .55rem;font-size:.76rem;line-height:1.4}
