/* ══════════ Projects & datasets ══════════ */
const PROJECT_COLOURS = ['#1a9080', '#2c5f7a', '#b5651d', '#7a4f9e', '#c0392b', '#4a7c2f', '#c99700', '#5d6d7e'];

function dsById(id) { return state.datasets.find(d => d.id === id) || null; }
function prById(id) { return state.projects.find(p => p.id === id) || null; }

/* Kept because filing a dataset can offer to make a project on the spot, which
   is a convenience worth having. Everything else about a project's life —
   renaming, deleting, choosing where it lives — belongs to the hub, so a
   project made here is a BROWSER project; the folder choice is only offered
   where the whole lifecycle is. */
async function createProject(name) {
  const p = { id: uid('p_'), name: name, store: 'browser', note: '',
              created: Date.now(), updated: Date.now(),
              datasets: 0, runs: 0, folderName: null,
              colour: PROJECT_COLOURS[state.projects.length % PROJECT_COLOURS.length] };
  await vomProjectPut(p);
  state.projects.push(p);
  return p;
}
async function createDataset(name, projectIds) {
  const d = { id: uid('d_'), name: name, note: '', created: Date.now(),
              projectIds: projectIds || [], count: 0 };
  await dbPut('datasets', d);
  state.datasets.push(d);
  return d;
}
/* The two funnels every state change already goes through. Hooking the folder
   write-through here rather than at each call site means nothing has to
   remember to do it — and the debounce inside autosave() collapses a burst of
   changes into one write. */
async function saveDataset(d) { await dbPut('datasets', d); if (typeof autosave === 'function') autosave(); }
async function saveProject(p) { p.updated = Date.now(); await vomProjectPut(p); }

async function deleteDataset(id) {
  const imgs = await dbImagesOf(id);
  const ids = imgs.map(i => i.id);
  // Chunked so a 2,000-image dataset does not build one enormous transaction.
  for (let i = 0; i < ids.length; i += 300) {
    await dbDelMany(['images', 'thumbs', 'blobs'], ids.slice(i, i + 300));
  }
  await dbDel('datasets', id);
  state.datasets = state.datasets.filter(d => d.id !== id);
  if (state.curDs === id) { state.curDs = null; state.images = []; state.sel.clear(); }
}
async function deleteProject(id, alsoDatasets) {
  if (alsoDatasets) {
    for (const d of state.datasets.filter(d => (d.projectIds || []).includes(id))) await deleteDataset(d.id);
  } else {
    for (const d of state.datasets) {
      if ((d.projectIds || []).includes(id)) {
        d.projectIds = d.projectIds.filter(p => p !== id);
        await saveDataset(d);
      }
    }
  }
  await dbDel('projects', id);
  state.projects = state.projects.filter(p => p.id !== id);
  if (state.curProject === id) state.curProject = null;
}

async function refreshCounts() {
  for (const d of state.datasets) {
    try { d.count = await dbCountOf(d.id); } catch (e) { d.count = 0; }
  }
}
async function loadLibrary() {
  /* Projects deliberately NOT read here any more. They live in the shared
     suite store so the hub and this sidebar cannot disagree about what exists;
     initProjects() loads them, and migrates the old local records across. */
  state.datasets = (await dbAll('datasets')).sort((a, b) => natCmp(a.name, b.name));
  await refreshCounts();
}
async function openDataset(id) {
  state.curDs = id;
  state.sel.clear();
  state.cursor = null;
  state.images = id ? await dbImagesOf(id) : [];
  saveSettings();
  render();
}
async function saveImages(recs) {
  await dbPutMany('images', recs);
  if (typeof autosave === 'function') autosave();
}


/* ═══════════════════════════════════════════════════════════════════════════
   IMPORT
   ---------------------------------------------------------------------------
   Per file: decode once, then derive three things from that single decode —
   a cached thumbnail, a small metrics raster, and the EXIF block. Decoding is
   by far the expensive step, so everything that needs pixels happens while the
   bitmap is in hand, and the bitmap is closed immediately after.

   The colour numbers computed here are THUMBNAIL-LEVEL and unweighted. They
   exist to arrange a grid, not to be published — the Batch Image Analyzer is
   where measurement happens, with projection weighting, masking and the
   resolution actually declared. The inspector says so on screen.
   ═══════════════════════════════════════════════════════════════════════════ */

const THUMB_MAX  = 480;   // long side of the cached thumbnail, px
const METRIC_MAX = 96;    // long side of the raster the quick metrics run on

let _statusTimer = null;
function setStatus(msg, kind, autoHideMs) {
  const bar = $('statusBar');
  if (!bar) return;
  $('statusTxt').innerHTML = msg;
  bar.className = 'show ' + (kind || '');
  bar.querySelector('.bar').style.display = kind === 'progress' ? '' : 'none';
  $('statusCancel').style.display = kind === 'progress' && state.job ? '' : 'none';
  clearTimeout(_statusTimer);
  if (autoHideMs) _statusTimer = setTimeout(clearStatus, autoHideMs);
}
function setProgress(frac) {
  const f = $('statusFill'); if (f) f.style.width = (clamp(frac, 0, 1) * 100).toFixed(1) + '%';
}
function clearStatus() { const bar = $('statusBar'); if (bar) bar.className = ''; }
function log(msg) { try { console.log('[Manager] ' + msg); } catch (e) {} }
function cancelJob() { if (state.job) state.job.cancel = true; setStatus('Cancelling…', 'progress'); }

/* ── Quick colour metrics from a small RGBA raster ─────────────────────────
   Per-pixel conversion then averaging, matching how the Analyzer aggregates:
   hue is averaged circularly (a plain mean of 350° and 10° would give 180°,
   which is the opposite colour). Fully transparent pixels are skipped. */
function quickMetrics(data, n) {
  let sR = 0, sG = 0, sB = 0, sL = 0, sA = 0, sBb = 0, sC = 0, sS = 0, sV = 0;
  let hx = 0, hy = 0, cnt = 0;
  let sRg = 0, sRg2 = 0, sYb = 0, sYb2 = 0;
  for (let i = 0; i < n * 4; i += 4) {
    if (data[i + 3] < 8) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    sR += r; sG += g; sB += b;
    const [L, a, bb] = rgbToLab(r, g, b);
    sL += L; sA += a; sBb += bb;
    const [C, H] = labToLch(L, a, bb);
    sC += C;
    const hr = H * Math.PI / 180; hx += Math.cos(hr); hy += Math.sin(hr);
    const [, S, V] = rgbToHsv(r, g, b);
    sS += S; sV += V;
    const rg = r - g, yb = 0.5 * (r + g) - b;
    sRg += rg; sRg2 += rg * rg; sYb += yb; sYb2 += yb * yb;
    cnt++;
  }
  if (!cnt) return null;
  const mR = sR / cnt, mG = sG / cnt, mB = sB / cnt;
  let mH = Math.atan2(hy / cnt, hx / cnt) * 180 / Math.PI; if (mH < 0) mH += 360;
  const mRg = sRg / cnt, mYb = sYb / cnt;
  const vRg = Math.max(0, sRg2 / cnt - mRg * mRg), vYb = Math.max(0, sYb2 / cnt - mYb * mYb);
  const colourfulness = Math.sqrt(vRg + vYb) + 0.3 * Math.sqrt(mRg * mRg + mYb * mYb);
  const [u, v] = rgbToUV(mR, mG, mB);
  const pk = planckianNearest(u, v);
  return {
    R: +mR.toFixed(2), G: +mG.toFixed(2), B: +mB.toFixed(2),
    L: +(sL / cnt).toFixed(2), a: +(sA / cnt).toFixed(2), b: +(sBb / cnt).toFixed(2),
    C: +(sC / cnt).toFixed(2), H: +mH.toFixed(2),
    S: +(sS / cnt).toFixed(2), V: +(sV / cnt).toFixed(2),
    colourfulness: +colourfulness.toFixed(2),
    cct: pk.cct, duv: pk.duv,
    hex: rgbToHex(mR, mG, mB),
    n: cnt,
  };
}

/* EXIF lives in the first bytes of a JPEG, so only the head of the file is read.
   On a 400-frame folder this is the difference between a few MB and several GB
   of pointless I/O. */
async function readExifHead(file) {
  try {
    const head = file.slice(0, Math.min(file.size, 262144));
    const buf = await head.arrayBuffer();
    const ex = parseExif(buf);
    delete ex._app1;                      // recovered again at export time
    return ex;
  } catch (e) { return {}; }
}

function drawTo(bitmap, maxDim) {
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(bitmap, 0, 0, w, h);
  return { cv, cx, w, h };
}
function canvasToBlob(cv, type, quality) {
  return new Promise(res => cv.toBlob(res, type || 'image/jpeg', quality == null ? 0.82 : quality));
}

/* ── The import job ──────────────────────────────────────────────────────── */
async function importFiles(fileList, targetDsId) {
  const files = Array.from(fileList).filter(f => IMG_RE.test(f.name) || (f.type && f.type.startsWith('image/')));
  const skipped = fileList.length - files.length;
  if (!files.length) { setStatus('No image files found in that drop.' + (skipped ? ` ${skipped} non-image file(s) ignored.` : ''), 'error', 6000); return; }

  /* Ask where these go. The dialog preselects the open dataset and suggests the
     dropped folder's name for a new one, so the common cases are one keystroke —
     but a folder dropped onto the wrong open dataset is no longer silent, and
     mixing two shoots together has no undo. */
  let dsId = targetDsId;
  if (!dsId) {
    dsId = await chooseImportTarget(files);
    if (!dsId) { setStatus('Import cancelled.', '', 3000); return; }
  }
  const ds = dsById(dsId);
  if (!ds) { setStatus('That dataset no longer exists.', 'error', 5000); return; }

  const existing = await dbImagesOf(dsId);
  const seen = new Set(existing.map(r => r.origName + '|' + r.size));

  /* In a folder project the images go INTO THE FOLDER, not into browser
     storage — that is the whole reason for choosing one. The dataset gets its
     folder on first import, and from then on the bytes live on disk and this
     database holds only a thumbnail and the measured numbers. */
  const toFolder = !!(state.project && state.project.store === 'folder'
                      && typeof isFolderDs === 'function');
  let fsDir = null;
  if (toFolder) {
    if (state.projectAccess !== 'ok' && !(await connectProjectFolder())) {
      setStatus('The project folder is not connected, so there is nowhere to put these.', 'error', 8000);
      return;
    }
    try { fsDir = await fsWriteDataset(ds, existing); }
    catch (e) {
      setStatus('Could not open the project folder — ' + escapeHtml(e.message || String(e)), 'error', 9000);
      return;
    }
  }

  state.job = { cancel: false };
  const job = state.job;
  let added = 0, dupes = 0, failed = 0;
  const batchImgs = [], batchThumbs = [], batchBlobs = [];

  const flush = async () => {
    if (!batchImgs.length) return;
    await dbPutMany('blobs', batchBlobs.splice(0));
    await dbPutMany('thumbs', batchThumbs.splice(0));
    await dbPutMany('images', batchImgs.splice(0));
  };

  setStatus(`Importing 0 / ${files.length}…`, 'progress');
  for (let i = 0; i < files.length; i++) {
    if (job.cancel) break;
    const f = files[i];
    const key = f.name + '|' + f.size;
    if (seen.has(key)) { dupes++; continue; }
    seen.add(key);

    try {
      const bmp = await createImageBitmap(f);
      const t = drawTo(bmp, THUMB_MAX);
      const mSrc = drawTo(bmp, METRIC_MAX);
      const md = mSrc.cx.getImageData(0, 0, mSrc.w, mSrc.h).data;
      const m = quickMetrics(md, mSrc.w * mSrc.h);
      const thumbBlob = await canvasToBlob(t.cv, 'image/jpeg', 0.82);
      const exif = await readExifHead(f);
      const W = bmp.width, H = bmp.height;
      bmp.close && bmp.close();

      const rel = f.webkitRelativePath || '';
      const folder = rel ? rel.split('/').slice(0, -1).join('/') : '';
      const dt = exifToDate(exif.datetime);
      const id = uid('i_');

      /* Written to disk BEFORE the record exists. A record pointing at a file
         that was never written is worse than no record: it looks like an image
         right up until you click it. */
      let fsFile = null;
      if (fsDir) {
        fsFile = await fsUniqueName(fsDir, f.name);
        const fh = await fsDir.getFileHandle(fsFile, { create: true });
        const w = await fh.createWritable();
        await w.write(f);
        await w.close();
      }

      batchImgs.push({
        id, dsId,
        name: f.name, origName: f.name,
        fsFile,
        size: f.size, type: f.type || ('image/' + extOf(f.name)),
        w: W, h: H, tw: t.w, th: t.h,
        folder,
        added: Date.now(),
        dateMs: dt ? dt.getTime() : null,
        exif, m,
        edits: null,
        rating: 0, flag: 'none', tags: [], note: '',
      });
      batchThumbs.push({ id, blob: thumbBlob });
      if (!fsDir) batchBlobs.push({ id, blob: f });
      added++;
    } catch (e) {
      failed++;
    }

    if (batchImgs.length >= 12) await flush();
    if (i % 4 === 0 || i === files.length - 1) {
      setStatus(`Importing ${i + 1} / ${files.length}… <b>${added}</b> added${dupes ? `, ${dupes} already in dataset` : ''}${failed ? `, ${failed} failed` : ''}`, 'progress');
      setProgress((i + 1) / files.length);
      await sleep(0);
    }
  }
  await flush();
  state.job = null;

  ds.count = await dbCountOf(dsId);
  await saveDataset(ds);
  await openDataset(dsId);
  // Solar geometry needs nothing but the EXIF just parsed, so compute it now
  // rather than making it a step the user has to remember.
  try { await recomputeSolar(dsId, true); render(); } catch (e) { log('solar: ' + e.message); }
  await updateQuota();

  const parts = [`<b>${added}</b> image${added === 1 ? '' : 's'} added to “${escapeHtml(ds.name)}”`];
  if (dupes)   parts.push(`${dupes} already in the dataset`);
  if (failed)  parts.push(`${failed} could not be decoded`);
  if (skipped) parts.push(`${skipped} non-image file${skipped === 1 ? '' : 's'} ignored`);
  setStatus(parts.join(' · '), failed ? 'error' : 'success', 8000);
}

/* ── Entry points ────────────────────────────────────────────────────────── */
function pickFiles()  { $('fileInput').value = '';   $('fileInput').click(); }
function pickFolder() { $('folderInput').value = ''; $('folderInput').click(); }

/* ── Drag and drop ────────────────────────────────────────────────────────
   Written defensively, because a drop that quietly does nothing is the worst
   possible outcome: the page looks fine and the user has no idea whether the
   files were rejected, the handler threw, or the browser never delivered them.

   Three things this now does that the first version did not:
     · listens in the CAPTURE phase on both window and document, so nothing
       downstream can swallow the event first;
     · snapshots dataTransfer.files SYNCHRONOUSLY as a fallback — the FileList
       survives, whereas the DataTransferItemList is neutered the moment the
       handler yields, so an entry walk that comes back empty can still recover;
     · reports every failure to the status bar instead of dropping a rejected
       promise on the floor.
   It also refuses to be silent about environments where OS drops cannot work
   at all — see checkDropEnvironment(). */
function wireDropTarget() {
  const ov = $('dropOverlay');
  let depth = 0;
  const isFileDrag = e => {
    try {
      const t = e.dataTransfer && e.dataTransfer.types;
      if (!t) return false;
      return Array.from(t).includes('Files');
    } catch (err) { return false; }
  };
  const showOverlay = () => {
    const ds = state.curDs ? dsById(state.curDs) : null;
    $('dropTarget').textContent = ds ? ds.name : 'a new dataset';
    ov.style.display = 'flex';
  };
  const hideOverlay = () => { depth = 0; ov.style.display = 'none'; };

  const onEnter = e => { if (!isFileDrag(e)) return; e.preventDefault(); depth++; showOverlay(); };
  const onOver  = e => {
    if (!isFileDrag(e)) return;
    e.preventDefault();                      // required, or the browser navigates to the file
    try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {}
    if (ov.style.display !== 'flex') showOverlay();   // recover if dragenter was missed
  };
  const onLeave = e => { if (!isFileDrag(e)) return; depth = Math.max(0, depth - 1); if (!depth) hideOverlay(); };
  const onDrop = e => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    e.stopPropagation();
    hideOverlay();
    // Both grabbed before yielding: the item list dies at the end of this task.
    const dt = e.dataTransfer;
    const fallback = Array.from((dt && dt.files) || []);
    handleDrop(dt, fallback);
  };

  for (const target of [window, document]) {
    target.addEventListener('dragenter', onEnter, true);
    target.addEventListener('dragover', onOver, true);
    target.addEventListener('dragleave', onLeave, true);
    target.addEventListener('drop', onDrop, true);
  }
  // Anything that reaches the document without being handled would otherwise
  // navigate away and lose the session.
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
}

async function handleDrop(dt, fallback) {
  let files = [];
  try {
    files = await filesFromDataTransfer(dt);
  } catch (err) {
    files = [];
    log('Drop: entry walk failed — ' + err.message);
  }
  // An entry walk can come back empty where a plain FileList did not.
  if (!files.length && fallback.length) files = fallback;

  if (!files.length) {
    setStatus('Nothing arrived from that drop. If you dragged a folder, try <b>+ Folder</b> instead — some browsers do not hand folder contents to a web page.', 'error', 9000);
    return;
  }
  importFiles(files);
}

/* Some environments deliver drag events but never the files: a sandboxed
   preview iframe is the common one, and viewing the page as a file:// URL is
   the other. Both look like "drag and drop is broken" and neither is fixable
   from inside the page, so say so rather than let the user keep trying. */
function checkDropEnvironment() {
  const notes = [];
  let framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) notes.push('This page is running inside a frame or preview pane. Browsers do not hand dropped files to a sandboxed frame — <b>open it in its own browser tab</b> and drag and drop will work.');
  if (location.protocol === 'file:') notes.push('This page was opened as a <code>file://</code> URL. Storage and file drops are both unreliable there — serve it over http(s), or open the hosted copy.');
  if (notes.length) setStatus(notes.join(' '), 'error', 20000);
  return notes.length === 0;
}

/* A dropped FOLDER arrives as a directory entry, not as its files. Walk it so
   dropping a folder behaves the same as choosing one. */
async function filesFromDataTransfer(dt) {
  if (!dt) return [];
  const items = Array.from(dt.items || []);
  const canWalk = items.length && typeof items[0].webkitGetAsEntry === 'function';
  if (!canWalk) return Array.from(dt.files || []);

  /* Every entry must be taken from the item list NOW, synchronously. The list
     is neutered the moment this function yields, so pulling entries after the
     first await would return null for all of them. */
  const entries = items.map(i => { try { return i.webkitGetAsEntry(); } catch (e) { return null; } }).filter(Boolean);
  if (!entries.length) return Array.from(dt.files || []);

  const out = [];
  const seen = new Set();
  const walk = async (entry, prefix, depth) => {
    if (!entry || depth > 12) return;                // a symlink loop would otherwise hang the tab
    if (entry.isFile) {
      // entry.file() invokes neither callback if the entry has expired, so the
      // promise is raced against a timeout rather than left to hang forever.
      const file = await Promise.race([
        new Promise(res => { try { entry.file(res, () => res(null)); } catch (e) { res(null); } }),
        new Promise(res => setTimeout(() => res(null), 8000)),
      ]);
      if (file) {
        try { Object.defineProperty(file, 'webkitRelativePath', { value: prefix + file.name }); } catch (e) {}
        out.push(file);
      }
      return;
    }
    if (entry.isDirectory) {
      const key = prefix + entry.name + '/';
      if (seen.has(key)) return;
      seen.add(key);
      const reader = entry.createReader();
      let batch;
      do {
        // Chrome returns at most 100 entries per call and signals the end with [].
        batch = await Promise.race([
          new Promise(res => { try { reader.readEntries(res, () => res([])); } catch (e) { res([]); } }),
          new Promise(res => setTimeout(() => res([]), 8000)),
        ]);
        for (const e2 of batch) await walk(e2, key, depth + 1);
      } while (batch.length);
    }
  };
  for (const en of entries) await walk(en, '', 0);
  return out;
}

   LIBRARY TREE, ARRANGEMENT AND GRID
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Sort keys ────────────────────────────────────────────────────────────
   Each is [value, label, accessor]. A null accessor result always sorts last,
   whichever direction is active: "no capture time" is not the earliest time,
   it is missing, and burying it at the end is the readable behaviour. */
const SORTS = [
  ['name',    'filename',            r => r.name, 'str'],
  ['added',   'date added',          r => r.added],
  ['taken',   'capture time',        r => r.dateMs],
  ['size',    'file size',           r => r.size],
  ['mp',      'megapixels',          r => r.w * r.h],
  ['aspect',  'aspect ratio',        r => r.h ? r.w / r.h : null],
  ['format',  'file format',         r => extOf(r.name), 'str'],
  ['rating',  'rating',              r => r.rating || 0],
  ['L',       'lightness L*',        r => r.m && r.m.L],
  ['a',       'a*  green–red',  r => r.m && r.m.a],
  ['b',       'b*  blue–yellow', r => r.m && r.m.b],
  ['C',       'chroma C*',           r => r.m && r.m.C],
  ['H',       'hue angle',           r => r.m && r.m.H],
  ['S',       'saturation',          r => r.m && r.m.S],
  ['V',       'brightness',          r => r.m && r.m.V],
  ['colourfulness', 'colourfulness', r => r.m && r.m.colourfulness],
  ['cct',     'colour temperature',  r => r.m && r.m.cct],
  ['duv',     'duv (green–magenta)', r => r.m && r.m.duv],
  ['ramp',    'colour ramp (hue → lightness)', null],
  ['dist',    'colour distance from reference', null],
  ['sol_el',  'solar elevation',     r => r.sol && r.sol.el],
  ['sol_az',  'solar azimuth',       r => r.sol && r.sol.az],
  ['airmass', 'air mass',            r => r.sol && r.sol.am],
];
const SORT_GROUPS = [
  ['File',   ['name', 'added', 'size', 'format', 'mp', 'aspect', 'rating']],
  ['Capture', ['taken']],
  ['Colour', ['L', 'a', 'b', 'C', 'H', 'S', 'V', 'colourfulness', 'cct', 'duv', 'ramp', 'dist']],
  ['Solar',  ['sol_el', 'sol_az', 'airmass']],
];
let SOL_BAND_DEG = 5;
let SESSION_GAP_MIN = 20;

function buildSortSelect() {
  const sel = $('sortSel');
  sel.innerHTML = SORT_GROUPS.map(([g, keys]) =>
    `<option disabled style="font-weight:700">— ${g} —</option>` +
    keys.map(k => { const s = SORTS.find(s => s[0] === k); return `<option value="${k}">${s[1]}</option>`; }).join('')
  ).join('');
  sel.value = state.sort;
}

function sortValue(r, key) {
  const s = SORTS.find(s => s[0] === key);
  return s && s[2] ? s[2](r) : null;
}
function isStringSort(key) { const s = SORTS.find(s => s[0] === key); return s && s[3] === 'str'; }

function applySort(arr) {
  const dir = state.sortDir;
  const key = state.sort;

  if (key === 'ramp') {
    /* Hue is circular, so a plain numeric sort puts red at both ends. Sorting by
       hue then lightness gives the familiar colour-ramp arrangement, and near-
       neutral images (chroma under 4) are pushed to one end because their hue
       angle is numerically real but visually meaningless. */
    return arr.slice().sort((x, y) => {
      const mx = x.m, my = y.m;
      if (!mx || !my) return !mx && !my ? 0 : (!mx ? 1 : -1);
      const nx = mx.C < 4 ? 1 : 0, ny = my.C < 4 ? 1 : 0;
      if (nx !== ny) return nx - ny;
      if (nx) return dir * (mx.L - my.L);
      const d = mx.H - my.H;
      return dir * (Math.abs(d) > 1e-9 ? d : mx.L - my.L);
    });
  }
  if (key === 'dist') {
    const ref = state.refLab;
    if (!ref) return arr;
    return arr.slice().sort((x, y) => {
      const dx = x.m ? deltaE2000(ref[0], ref[1], ref[2], x.m.L, x.m.a, x.m.b) : Infinity;
      const dy = y.m ? deltaE2000(ref[0], ref[1], ref[2], y.m.L, y.m.a, y.m.b) : Infinity;
      return dir * (dx - dy);
    });
  }

  const str = isStringSort(key);
  return arr.slice().sort((x, y) => {
    const a = sortValue(x, key), b = sortValue(y, key);
    const an = (a == null || a === ''), bn = (b == null || b === '');
    if (an || bn) return an && bn ? natCmp(x.name, y.name) : (an ? 1 : -1);   // missing always last
    const c = str ? natCmp(a, b) : (a - b);
    return c !== 0 ? dir * c : natCmp(x.name, y.name);                        // stable, readable tie-break
  });
}

function passesFilter(r) {
  const t = state.filterTxt.trim().toLowerCase();
  if (t && !(r.name.toLowerCase().includes(t) || (r.tags || []).some(g => g.toLowerCase().includes(t)) ||
             (r.folder || '').toLowerCase().includes(t))) return false;
  const f = state.filterFlag;
  if (f === 'pick'      && r.flag !== 'pick')   return false;
  if (f === 'reject'    && r.flag !== 'reject') return false;
  if (f === 'none'      && r.flag !== 'none')   return false;
  if (f === 'notreject' && r.flag === 'reject') return false;
  if (f === 'edited'    && !hasEdits(r))        return false;
  if (state.filterRating && (r.rating || 0) < state.filterRating) return false;
  return true;
}

function computeView() {
  state.view = applySort(state.images.filter(passesFilter));
}

/* ── Grouping ─────────────────────────────────────────────────────────────
   Returns [{label, rows}]. Session grouping is the one that does real work:
   it walks the images in capture-time order and starts a new group whenever
   the gap exceeds the threshold, which is how a day of fieldwork actually
   divides itself. Images with no capture time form their own group rather
   than being silently folded into the first session. */
function ASPECT_LABEL(w, h) {
  if (!w || !h) return 'unknown';
  const r = w / h;
  const named = [[2, '2:1 (equirectangular)'], [1.7778, '16:9'], [1.5, '3:2'], [1.3333, '4:3'], [1, '1:1 square'],
                 [0.75, '3:4 portrait'], [0.6667, '2:3 portrait'], [0.5625, '9:16 portrait']];
  let best = null, bd = Infinity;
  for (const [v, lab] of named) { const d = Math.abs(r - v) / v; if (d < bd) { bd = d; best = lab; } }
  return bd < 0.03 ? best : (r > 1 ? `landscape ${r.toFixed(2)}:1` : `portrait 1:${(1 / r).toFixed(2)}`);
}
function groupRows(rows) {
  const g = state.group;
  if (g === 'none') return [{ label: null, rows }];

  if (g === 'session') {
    const timed = rows.filter(r => r.dateMs != null);
    const untimed = rows.filter(r => r.dateMs == null);
    const ordered = timed.slice().sort((a, b) => a.dateMs - b.dateMs);
    const out = []; let cur = [];
    const gap = SESSION_GAP_MIN * 60000;
    for (let i = 0; i < ordered.length; i++) {
      if (cur.length && ordered[i].dateMs - ordered[i - 1].dateMs > gap) { out.push(cur); cur = []; }
      cur.push(ordered[i]);
    }
    if (cur.length) out.push(cur);
    const groups = out.map(rs => {
      const a = new Date(rs[0].dateMs), b = new Date(rs[rs.length - 1].dateMs);
      const p = n => String(n).padStart(2, '0');
      const mins = Math.round((b - a) / 60000);
      return { label: `${a.getFullYear()}-${p(a.getMonth() + 1)}-${p(a.getDate())} · ${p(a.getHours())}:${p(a.getMinutes())}–${p(b.getHours())}:${p(b.getMinutes())} (${mins} min)`,
               rows: applySort(rs) };
    });
    if (untimed.length) groups.push({ label: 'no capture time in EXIF', rows: untimed });
    return groups;
  }

  if (g === 'solband') {
    /* Bands are labelled by the interval they cover, and sorted numerically —
       a plain string sort would put "10–15°" before "5–10°". */
    const map = new Map();
    for (const r of rows) {
      const el = r.sol ? r.sol.el : null;
      const k = el == null ? null : Math.floor(el / SOL_BAND_DEG) * SOL_BAND_DEG;
      const label = k == null ? 'no solar geometry' : `sun ${k}° to ${k + SOL_BAND_DEG}°`;
      if (!map.has(label)) map.set(label, { k, rows: [] });
      map.get(label).rows.push(r);
    }
    return Array.from(map.entries())
      .sort((a, b) => (a[1].k == null ? 1 : b[1].k == null ? -1 : a[1].k - b[1].k))
      .map(([label, v]) => ({ label, rows: v.rows }));
  }

  const keyOf = {
    day:    r => r.dateMs ? new Date(r.dateMs).toDateString() : 'no capture time',
    hour:   r => { if (!r.dateMs) return 'no capture time'; const d = new Date(r.dateMs);
                   return `${d.toDateString()} ${String(d.getHours()).padStart(2, '0')}:00`; },
    camera: r => [r.exif && r.exif.make, r.exif && r.exif.model].filter(Boolean).join(' ') || 'no camera in EXIF',
    folder: r => r.folder || '(dropped loose)',
    rating: r => (r.rating ? `${r.rating}★` : 'unrated'),
    flag:   r => r.flag === 'pick' ? 'picked' : r.flag === 'reject' ? 'rejected' : 'unflagged',
    format: r => extOf(r.name).toUpperCase() || '(none)',
    aspect: r => ASPECT_LABEL(r.w, r.h),
  }[g];
  if (!keyOf) return [{ label: null, rows }];

  const map = new Map();
  for (const r of rows) { const k = keyOf(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); }
  return Array.from(map.entries()).sort((a, b) => natCmp(a[0], b[0])).map(([label, rs]) => ({ label, rows: rs }));
}

/* ── Thumbnail cache ──────────────────────────────────────────────────────
   Object URLs are a leak if you make one per tile and forget it, so they are
   handed out through a bounded cache that revokes the oldest. */
const _thumbURLs = new Map();
const THUMB_CACHE_MAX = 600;
async function thumbURL(id) {
  if (_thumbURLs.has(id)) { const u = _thumbURLs.get(id); _thumbURLs.delete(id); _thumbURLs.set(id, u); return u; }
  const rec = await dbGet('thumbs', id);
  if (!rec) return null;
  const url = URL.createObjectURL(rec.blob);
  _thumbURLs.set(id, url);
  while (_thumbURLs.size > THUMB_CACHE_MAX) {
    const k = _thumbURLs.keys().next().value;
    URL.revokeObjectURL(_thumbURLs.get(k));
    _thumbURLs.delete(k);
  }
  return url;
}
function dropThumb(id) {
  if (_thumbURLs.has(id)) { URL.revokeObjectURL(_thumbURLs.get(id)); _thumbURLs.delete(id); }
}

let _io = null;
function ensureObserver() {
  if (_io) return _io;
  _io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const el = e.target;
      _io.unobserve(el);
      const id = el.dataset.id;
      thumbURL(id).then(url => {
        if (!url) return;
        const img = document.createElement('img');
        img.src = url; img.alt = '';
        img.style.aspectRatio = el.dataset.ar;
        const ph = el.querySelector('.ph');
        if (ph) ph.replaceWith(img);
      });
    }
  }, { root: $('gridWrap'), rootMargin: '600px 0px' });
  return _io;
}

/* ── Render ───────────────────────────────────────────────────────────────── */
function render() {
  renderTree();
  computeView();
  renderGrid();
  renderSelBar();
  renderInspector();
  syncControls();
  layoutToolbar();     // the bar's width changes when the inspector is toggled
}
function syncControls() {
  $('sortSel').value = state.sort;
  $('groupSel').value = state.group;
  $('sizeRange').value = state.tileSize;
  $('sortDirBtn').innerHTML = state.sortDir > 0 ? '&#9650;' : '&#9660;';
  $('sortDirBtn').title = state.sortDir > 0 ? 'Ascending — click for descending' : 'Descending — click for ascending';
  $('fitBtn').textContent = state.fitMode === 'contain' ? 'Fit' : 'Fill';
  $('fitBtn').title = state.fitMode === 'contain' ? 'Whole image shown in each tile — click to fill the tile instead' : 'Tiles filled and cropped — click to fit the whole image instead';
  $('sessionGap').classList.toggle('hidden', state.group !== 'session');
  $('solBand').classList.toggle('hidden', state.group !== 'solband');
  $('inspector').classList.toggle('collapsed', !state.inspectorOpen);
  if (typeof applyPanelWidths === 'function') applyPanelWidths();
  $('filterTxt').value = state.filterTxt;
  $('filterFlag').value = state.filterFlag;
  $('filterRating').value = String(state.filterRating);
}

/* ══════════ Library panel — ONE list, scoped ══════════
   There used to be two tabs, Datasets and Projects, and the Projects one was a
   second place to organise: drill into a project, see its datasets, file things
   in and out. That has moved to the hub, where a project's whole life now lives
   — created, renamed, deleted, filled and emptied in one place. A tool that
   also organised projects was the arrangement in which a project could exist in
   one place and not the other.

   What is left here is a LIBRARY, scoped by a filter: the open project by
   default, because that is the work in front of you, and everything when no
   project is open, because someone who came to look at a folder of photographs
   should never have to think about projects at all. */
const UNFILED = '__unfiled__';

/* Kept because saved settings and a couple of old call sites still name it.
   Drilling into a project inside the Manager is no longer something it does. */
function setLibTab() { renderTree(); }

/* The list FOLLOWS the open project. With the dropdown gone there is no filter
   to leave set, and a remembered scope pointing at a project you are no longer
   in is one of the ways datasets appeared to vanish. `state.libScope` survives
   only as a transient override — the "show all datasets" escape hatch — and is
   dropped the moment the open project changes. */
function libScope() {
  const def = defaultScope();
  const s = state.libScope;
  if (!s) return def;
  if (state.libScopeFor !== (state.project ? state.project.id : null)) return def;
  if (s !== 'all' && s !== UNFILED && !prById(s)) return def;
  return s;
}
function defaultScope() { return state.project ? state.project.id : 'all'; }
function setLibScope(v) {
  state.libScope = v;
  state.libScopeFor = state.project ? state.project.id : null;
  renderTree();
}

function scopedDatasets() {
  const s = libScope();
  return s === 'all' ? state.datasets : datasetsOfProject(s);
}

/* The sidebar head, in two rows.

   Row one is a two-state toggle. A one-way "show all datasets" link had the
   flaw that the way back only existed once you had already left: having widened
   the view to find something, there was nothing on screen saying you were no
   longer looking at your project. Both states are now always visible, and the
   one you are in is pressed.

   Row two is `+ Add`, on its own line so the toggle can hold the full project
   name without the two fighting over a narrow sidebar.

   Still no project SWITCHER here: changing what is open changes where every
   tool in the suite saves, which is a heavier act than filtering a list and
   belongs at the hub with the rest of a project's life. */
function scopeBarHtml() {
  const s = libScope();
  const open = state.project;
  const showingAll = (s === 'all' || s === UNFILED);
  const proj = open ? open.name : null;
  const dot = open
    ? `<span class="lib-dot" style="background:${open.colour || 'var(--accent)'}"></span>`
    : '';

  /* With no project open there is nothing to toggle between, so the toggle does
     not appear at all — a control with one reachable state is furniture. */
  const toggle = open
    ? `<div class="lib-tog" role="group" aria-label="Which datasets to show">
         <button type="button" class="${showingAll ? '' : 'on'}"
                 aria-pressed="${showingAll ? 'false' : 'true'}"
                 onclick="setLibScope('${open.id}')"
                 title="Only the datasets filed in ${escapeHtml(proj)}">${dot}This project</button>
         <button type="button" class="${showingAll ? 'on' : ''}"
                 aria-pressed="${showingAll ? 'true' : 'false'}"
                 onclick="setLibScope('all')"
                 title="Every dataset in your library, whatever project it belongs to">All datasets</button>
       </div>`
    : `<span class="lib-where">All datasets</span>`;

  /* Kept to one or two lines. A four-line explanation at the top of a narrow
     sidebar pushes the list itself below the fold, which costs more than the
     sentence is worth — the point is only that adding still files into the
     open project, not a lecture about it. */
  const sub = open
    ? `<div class="lib-sub">${showingAll
        ? `<b>${escapeHtml(proj)}</b> is still open — new datasets land there.`
        : `in <b>${escapeHtml(proj)}</b>`}</div>`
    : '';

  return `<div class="lib-scope">
      ${toggle}${sub}
      <div class="lib-addrow">
        <button class="btn btn-primary btn-sm" onclick="openAddMenu(event)"
                title="Add images, a folder, or a dataset from your library">+ Add&nbsp;&#9662;</button>
      </div>
    </div>`;
}

function renderTree() {
  const el = $('tree');
  if (!el) return;
  el.innerHTML = scopeBarHtml() + datasetListHtml();
}

function datasetListHtml() {
  const s = libScope();
  let list = scopedDatasets();
  if (!state.datasets.length) {
    return `<div class="tree-empty">No datasets yet — drop images or a folder anywhere on this page
      to start one.</div>`;
  }

  /* The dataset you are LOOKING AT is always in the list, whatever the filter
     says. A grid full of images beside a sidebar insisting there is nothing
     here reads as a bug every time — and in that moment it is the filter that
     is wrong, not the dataset. */
  const open = state.curDs ? dsById(state.curDs) : null;
  const outside = !!(open && !list.some(d => d.id === open.id));
  let head = '';
  if (outside) {
    list = [open].concat(list);
    head = `<div class="lib-outside">Open, and not in this view \u2014
      <a onclick="setLibScope('all')">show all datasets</a></div>`;
  }

  if (!list.length) {
    const p = prById(s);
    return `<div class="tree-empty">${s === UNFILED
      ? 'Every dataset is filed in a project.'
      : `Nothing in <b>${escapeHtml(p ? p.name : 'this project')}</b> yet. Use <b>+ Add</b> to bring one in
         from the library, or drop images here while it is open.`}</div>`;
  }
  let html = head;
  /* A project dot only says something when the list is not already one project. */
  const showDots = (s === 'all' || s === UNFILED || outside);
  for (const d of list) html += dsRowHtml(d, showDots);
  return html;
}

function datasetsOfProject(pid) {
  if (pid === UNFILED) return state.datasets.filter(d => !(d.projectIds || []).length);
  return state.datasets.filter(d => (d.projectIds || []).includes(pid));
}

function dsRowHtml(d, showProjects) {
  const projs = showProjects ? (d.projectIds || []).map(id => prById(id)).filter(Boolean) : [];
  const bits = [`${d.count || 0} image${d.count === 1 ? '' : 's'}`];
  if (d.bytes) bits.push(fmtBytes(d.bytes));
  const sol = solarSpanLabel(d);
  if (sol) bits.push(sol);
  const projTitle = projs.length ? ' — in ' + projs.map(p => p.name).join(', ') : '';
  return `<div class="lrow ${state.curDs === d.id ? 'active' : ''}" onclick="openDataset('${d.id}')"
        oncontextmenu="datasetMenu(event,'${d.id}')"
        title="${escapeHtml(d.name)}${escapeHtml(projTitle)} — right-click for options">
      ${projs.length ? `<span class="dot" style="background:${projs[0].colour}"></span>` : ''}
      <span class="body"><span class="nm">${escapeHtml(d.name)}</span>
        <span class="sub">${bits.join(' · ')}</span></span>
      <span class="acts">
        <button onclick="event.stopPropagation();editDatasetDialog('${d.id}')" title="Edit name and notes">&#9998;</button>
        <button onclick="event.stopPropagation();addToProjectDialog('${d.id}')" title="Add to a project">&#43;</button>
        <button class="del" onclick="event.stopPropagation();confirmDeleteDataset('${d.id}')" title="Delete dataset">&times;</button>
      </span></div>`;
}

/* Selecting a project now just scopes the list. Everything else about a
   project's life happens at the hub. */
function selectProject(id) {
  state.curProject = id;
  setLibScope(id || 'all');
  if (!state.curDs) renderInspector();
}

/* ── Right-click menus ───────────────────────────────────────────────────── */
function datasetMenu(ev, id) {

    { label: 'Metadata CSV', fn: async () => { await openDataset(id); exportCsv(state.images, 'dataset'); } },
    { label: 'Duplicate (copies the images)', fn: () => duplicateDataset(id) },
    { sep: true },
    { label: 'Delete dataset&hellip;', danger: true, fn: () => confirmDeleteDataset(id) },
  ]);
}
function projectMenu(ev, id) {
  const p = prById(id);
  if (!p) return;
  openMenuAtPointer(ev, [
    { title: p.name },
    { label: 'Open', fn: () => selectProject(id) },
    { label: 'Edit colour and notes&hellip;', fn: () => editProjectDialog(id) },
    { label: 'Add datasets&hellip;', fn: () => addDatasetsDialog(id) },
    { sep: true },
    { label: 'Rename or delete (at the hub)&hellip;', fn: () => { location.href = HUB_URL; } },
  ]);
}

function renderGrid() {
  const wrap = $('grid');
  if (_io) { _io.disconnect(); _io = null; }

  if (!state.curDs) { wrap.innerHTML = welcomeHtml(); return; }
  const ds = dsById(state.curDs);
  if (!state.images.length) {
    wrap.innerHTML = `<div class="empty-state"><b>${escapeHtml(ds.name)} is empty</b>
      Drop images or a folder anywhere on this page, or use <b>+ Images</b> above.</div>`;
    return;
  }
  if (!state.view.length) {
    wrap.innerHTML = `<div class="empty-state"><b>Nothing matches the filter</b>
      ${state.images.length} image${state.images.length === 1 ? '' : 's'} in this dataset are hidden by the current filter.
      <br><br><button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear filters</button></div>`;
    return;
  }

  const groups = groupRows(state.view);
  const frag = document.createDocumentFragment();
  const obs = ensureObserver();

  for (const g of groups) {
    if (g.label != null) {
      const h = document.createElement('div');
      h.className = 'grp-head';
      h.innerHTML = `<span>${escapeHtml(g.label)}</span><span class="cnt">${g.rows.length}</span>
        <span class="pick"><button class="btn btn-ghost btn-sm" data-grp="${escapeHtml(g.label)}">select</button></span>`;
      h.querySelector('button').addEventListener('click', () => {
        g.rows.forEach(r => state.sel.add(r.id));
        renderSelBar(); paintSelection(); renderInspector();
      });
      frag.appendChild(h);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${state.tileSize}px, 1fr))`;
    for (const r of g.rows) grid.appendChild(makeTile(r, obs));
    frag.appendChild(grid);
  }
  wrap.innerHTML = '';
  wrap.appendChild(frag);
}

function makeTile(r, obs) {
  const el = document.createElement('div');
  el.className = 'tile' + (state.fitMode === 'cover' ? ' fitcover' : '') +
                 (state.sel.has(r.id) ? ' sel' : '') + (state.cursor === r.id ? ' cursor' : '') +
                 (r.flag === 'reject' ? ' rejected' : '');
  el.dataset.id = r.id;
  const ar = (r.w && r.h) ? (r.w / r.h) : 1.5;
  el.dataset.ar = String(ar);

  /* The ✓/✗ badges are gone: the status dot now says the same thing, and two
     marks for one state is the ambiguity this change set out to remove. Edited
     and tags stay, because nothing else shows them. */
  const badges = [];
  if (hasEdits(r))          badges.push('<span class="bdg edit" title="This image carries non-destructive edits">edited</span>');
  if ((r.tags || []).length) badges.push(`<span class="bdg">${escapeHtml(r.tags[0])}${r.tags.length > 1 ? ' +' + (r.tags.length - 1) : ''}</span>`);

  const stars = r.rating ? '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) : '☆☆☆☆☆';
  const sub = tileCaption(r);

  const selected = state.sel.has(r.id);
  const dotCls = [selected ? 'sel' : '', r.flag === 'pick' ? 'pick' : r.flag === 'reject' ? 'rej' : ''].filter(Boolean).join(' ');
  const dotTitle = [r.flag === 'pick' ? 'picked' : r.flag === 'reject' ? 'rejected' : '', selected ? 'selected' : '']
    .filter(Boolean).join(' · ') || 'not selected';

  el.innerHTML =
    `<div class="tw">` +
      `<div class="ph" style="aspect-ratio:${ar}"></div>` +
      (badges.length ? `<div class="badges">${badges.join('')}</div>` : '') +
      `<span class="sdot ${dotCls}" title="${dotTitle}"></span>` +
      `<div class="stars${r.rating ? ' has' : ''}" data-stars="1">${stars}</div>` +
    `</div>` +
    `<div class="cap" title="${escapeHtml(r.name)}">${midTruncHtml(r.name)}` +
      (sub ? `<span class="mt">· ${escapeHtml(sub)}</span>` : '') + `</div>`;

  obs.observe(el);
  return el;
}
/* The caption's second half tracks whatever the grid is sorted by, so the sort
   is legible instead of mysterious. */
function tileCaption(r) {
  const k = state.sort, m = r.m;
  switch (k) {
    case 'taken':  return r.dateMs ? new Date(r.dateMs).toLocaleTimeString() : 'no time';
    case 'size':   return fmtBytes(r.size);
    case 'mp':     return `${r.w}×${r.h}`;
    case 'aspect': return r.h ? (r.w / r.h).toFixed(2) + ':1' : '';
    case 'rating': return r.rating ? r.rating + '★' : '';
    case 'format': return extOf(r.name).toUpperCase();
    case 'added':  return new Date(r.added).toLocaleDateString();
    case 'cct':    return m ? m.cct + ' K' : '';
    case 'duv':    return m ? 'duv ' + fmtNum(m.duv, 4) : '';
    case 'ramp':   return m ? `H ${fmtNum(m.H, 0)}° L ${fmtNum(m.L, 0)}` : '';
    case 'dist':   return (m && state.refLab) ? 'ΔE ' + fmtNum(deltaE2000(state.refLab[0], state.refLab[1], state.refLab[2], m.L, m.a, m.b), 1) : '';
    case 'sol_el':  return r.sol ? `sun ${fmtNum(r.sol.el, 1)}°` : 'no solar';
    case 'sol_az':  return r.sol ? `az ${fmtNum(r.sol.az, 0)}°` : 'no solar';
    case 'airmass': return r.sol && r.sol.am != null ? `AM ${fmtNum(r.sol.am, 2)}` : 'sun below horizon';
    case 'name':   return '';
    default:       return m && m[k] != null ? `${k} ${fmtNum(m[k], 1)}` : '';
  }
}

/* Repaint selection classes without rebuilding the grid — rebuilding on every
   click would drop every loaded thumbnail and make selection feel laggy. */
function paintSelection() {
  for (const el of $('grid').querySelectorAll('.tile')) {
    const on = state.sel.has(el.dataset.id);
    el.classList.toggle('sel', on);
    el.classList.toggle('cursor', state.cursor === el.dataset.id);
    const dot = el.querySelector('.sdot');
    if (dot) {
      dot.classList.toggle('sel', on);
      const flag = dot.classList.contains('pick') ? 'picked' : dot.classList.contains('rej') ? 'rejected' : '';
      dot.title = [flag, on ? 'selected' : ''].filter(Boolean).join(' · ') || 'not selected';
    }
  }
}

/* Elide a filename in the middle. CSS can only ellipsise one end of one string,
   so the name is split: the head shrinks and ellipsises, the tail never does —
   which keeps the frame number and the extension visible on names like
   AH_0001.jpg, where the end is the part that identifies the frame. */
function midTruncHtml(name) {
  const s = String(name);
  if (s.length <= 12) return `<span class="nm"><span class="hd">${escapeHtml(s)}</span></span>`;
  const tail = s.slice(-8), head = s.slice(0, -8);
  return `<span class="nm"><span class="hd">${escapeHtml(head)}</span><span class="tl">${escapeHtml(tail)}</span></span>`;
}
function repaintTile(id) {
  const el = $('grid').querySelector(`.tile[data-id="${id}"]`);
  if (!el) return;
  const r = state.images.find(i => i.id === id);
  if (!r) return;
  const fresh = makeTile(r, ensureObserver());
  // Keep the already-decoded thumbnail rather than reloading it.
  const img = el.querySelector('img');
  if (img) { const ph = fresh.querySelector('.ph'); if (ph) ph.replaceWith(img); ensureObserver().unobserve(fresh); }
  el.replaceWith(fresh);
}

    <b style="text-align:center;display:block">Image Manager</b>
    <p style="margin-bottom:.8rem">Drop images or a folder anywhere on this page to start a dataset. Everything stays on this
    computer: the library is stored in your browser, and nothing is uploaded.</p>

function renderSelBar() {
  const bar = $('selbar');
  const n = state.sel.size;
  bar.style.display = n ? '' : 'none';
  if (n) {
    const total = state.view.length;
    $('selCount').textContent = `${n} of ${total} selected`;
  }
}

/* ── Selection & interaction ─────────────────────────────────────────────── */
let _lastClickId = null;
function wireGrid() {
  const wrap = $('grid');
  wrap.addEventListener('click', ev => {
    const tile = ev.target.closest('.tile');
    if (!tile) return;
    const id = tile.dataset.id;

    const starsEl = ev.target.closest('[data-stars]');
    if (starsEl) {
      const rect = starsEl.getBoundingClientRect();
      const frac = (ev.clientX - rect.left) / rect.width;
      const v = clamp(Math.ceil(frac * 5), 0, 5);
      const r = state.images.find(i => i.id === id);
      setRating([r], r.rating === v ? 0 : v);
      ev.stopPropagation();
      return;
    }

    if (ev.shiftKey && _lastClickId) {
      const ids = state.view.map(r => r.id);
      let a = ids.indexOf(_lastClickId), b = ids.indexOf(id);
      if (a > -1 && b > -1) { if (a > b) [a, b] = [b, a]; for (let i = a; i <= b; i++) state.sel.add(ids[i]); }
    } else if (ev.metaKey || ev.ctrlKey) {
      state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id);
      _lastClickId = id;
    } else {
      state.sel.clear(); state.sel.add(id);
      _lastClickId = id;
    }
    state.cursor = id;
    paintSelection(); renderSelBar(); renderInspector();
  });
  wrap.addEventListener('dblclick', ev => {
    const tile = ev.target.closest('.tile');
    if (tile) openLightbox(tile.dataset.id);
  });
  wrap.addEventListener('contextmenu', ev => {
    const tile = ev.target.closest('.tile');
    if (tile) tileMenu(ev, tile.dataset.id);
  });
  $('gridWrap').addEventListener('click', ev => {
    if (ev.target.id === 'gridWrap' || ev.target.id === 'grid') { selectNone(); }
  });
}

function selectAll()    { state.view.forEach(r => state.sel.add(r.id)); paintSelection(); renderSelBar(); renderInspector(); }
function selectNone()   { state.sel.clear(); paintSelection(); renderSelBar(); renderInspector(); }
function selectInvert() { const cur = new Set(state.sel); state.sel.clear();
                          state.view.forEach(r => { if (!cur.has(r.id)) state.sel.add(r.id); });
                          paintSelection(); renderSelBar(); renderInspector(); }
function selectedRecs() { return state.view.filter(r => state.sel.has(r.id)); }
function targetRecs()   { const s = selectedRecs(); if (s.length) return s;
                          const c = state.images.find(r => r.id === state.cursor); return c ? [c] : []; }

/* ── Toolbar setters ─────────────────────────────────────────────────────── */
function setSort(v)        { state.sort = v; saveSettings(); computeView(); renderGrid(); paintSelection(); }
function toggleSortDir()   { state.sortDir *= -1; saveSettings(); syncControls(); computeView(); renderGrid(); paintSelection(); }
function setGroup(v)       { state.group = v; saveSettings(); syncControls(); computeView(); renderGrid(); paintSelection(); }
function setSessionGap(v)  { SESSION_GAP_MIN = +v; renderGrid(); paintSelection(); }
function setSolBand(v)     { SOL_BAND_DEG = +v; renderGrid(); paintSelection(); }
function setTileSize(v)    { state.tileSize = +v; saveSettings();

function toggleFit()       { state.fitMode = state.fitMode === 'contain' ? 'cover' : 'contain'; saveSettings(); syncControls();

function setFilterFlag(v)  { state.filterFlag = v; computeView(); renderGrid(); renderSelBar(); }

function clearFilters()    { state.filterTxt = ''; state.filterFlag = 'all'; state.filterRating = 0;
                             syncControls(); computeView(); renderGrid(); renderSelBar(); }
function toggleInspector() { state.inspectorOpen = !state.inspectorOpen; saveSettings(); syncControls(); renderInspector(); layoutToolbar(); }

/* The inspector folds away on its own when keeping it would starve the grid,
   and comes back when there is room. The test is the width the GRID would be
   left with, not the window width — a rule keyed to the window has a cliff
   where widening the browser makes the grid narrower, because the inspector
   reappears and takes 300px with it.

   `inspectorOpen` is what the user chose; `_inspForced` records that the layout
   overrode it, so their preference is restored rather than forgotten. */
const MIN_GRID_W = 560;
let _inspForced = false;
function enforceLayout() {
  /* Both branches ask the SAME question — would the grid still clear
     MIN_GRID_W with the inspector open? — so folding and unfolding cannot
     disagree and flap at the boundary. effPanelWidths has already shrunk the
     panels toward their minimums, so reaching here means even those do not
     fit and the inspector genuinely has to go. */
  const w = effPanelWidths(true);
  const fits = (window.innerWidth - w.side - w.insp - PANEL_CHROME) >= MIN_GRID_W;
  if (!fits && state.inspectorOpen) { _inspForced = true; state.inspectorOpen = false; syncControls(); }
  else if (fits && _inspForced) { _inspForced = false; state.inspectorOpen = true; syncControls(); renderInspector(); }
  applyPanelWidths();
}

/* ── Curation ────────────────────────────────────────────────────────────── */
async function setRating(recs, v) {
  recs.forEach(r => r.rating = v);
  await saveImages(recs);
  recs.forEach(r => repaintTile(r.id));
  renderInspector();
  if (state.filterRating) { computeView(); renderGrid(); }
}
async function setFlag(recs, f) {
  recs.forEach(r => r.flag = f);
  await saveImages(recs);
  recs.forEach(r => repaintTile(r.id));
  renderInspector();
  if (state.filterFlag !== 'all') { computeView(); renderGrid(); }
}
function rateSelection(v) { const t = targetRecs(); if (t.length) setRating(t, v); }
function flagSelection(f) { const t = targetRecs(); if (t.length) setFlag(t, f); }

async function removeSelection() {
  const recs = targetRecs();
  if (!recs.length) return;
  const ds = dsById(state.curDs);
  const inFolder = typeof isFolderDs === 'function' && isFolderDs(ds);
  openModal(`Remove ${recs.length} image${recs.length === 1 ? '' : 's'}?`,
    inFolder
      /* A folder project's files are the user's own, sitting in a folder they
         chose. Removing one from the dataset must never delete it — so it is
         recorded as excluded, and a rescan honours that rather than putting it
         straight back. */
      ? `<p>These will be removed from <b>${escapeHtml(ds.name)}</b>.</p>
         <p class="note" style="margin-top:.6rem"><b>The files stay in your project folder.</b> Nothing is deleted
         from disk. The dataset records that it leaves them alone, so rescanning the folder will not put them back —
         and you can still open them there like any other file.</p>`
      : `<p>These images will be removed from <b>${escapeHtml(ds.name)}</b> and deleted from this browser's library,
         including their stored copies.</p>
         <p class="note" style="margin-top:.6rem">Your original files on disk are untouched — this tool has never had
         write access to them. Re-import the folder to bring them back.</p>`,
    [{ label: 'Cancel', cls: 'btn-ghost' },
     { label: `Remove ${recs.length}`, cls: 'btn-danger', fn: async () => {
        const ids = recs.map(r => r.id);
        if (inFolder) await excludeFromFolderDataset(ds, recs.map(r => r.fsFile || r.origName));
        for (let i = 0; i < ids.length; i += 300) await dbDelMany(['images', 'thumbs', 'blobs'], ids.slice(i, i + 300));
        ids.forEach(dropThumb);
        const set = new Set(ids);
        state.images = state.images.filter(r => !set.has(r.id));
        state.sel.clear(); state.cursor = null;
        ds.count = state.images.length;
        await saveDataset(ds);
        await updateQuota();
        render();
        setStatus(`Removed ${ids.length} image${ids.length === 1 ? '' : 's'}.` +
          (inFolder ? ' The files are still in your project folder.' : ''), 'success', 5000);
     } }]);
}

/* ── Keyboard ────────────────────────────────────────────────────────────── */
function gridColumns() {
  const g = $('grid').querySelector('.grid');
  if (!g) return 1;
  const style = getComputedStyle(g);
  return Math.max(1, style.gridTemplateColumns.split(' ').filter(Boolean).length);
}
function moveCursor(delta, extend) {
  const ids = state.view.map(r => r.id);
  if (!ids.length) return;
  let i = ids.indexOf(state.cursor);
  if (i < 0) i = 0; else i = clamp(i + delta, 0, ids.length - 1);
  state.cursor = ids[i];
  if (extend) state.sel.add(state.cursor);
  else { state.sel.clear(); state.sel.add(state.cursor); _lastClickId = state.cursor; }
  paintSelection(); renderSelBar(); renderInspector();
  const el = $('grid').querySelector(`.tile[data-id="${state.cursor}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}
function wireKeys() {
  window.addEventListener('keydown', ev => {
    /* The modal claims keys FIRST, before the text-field bail-out below — a
       dialog's Enter has to work from inside its own input boxes. */
    if (modalKey(ev)) return;
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

    if ($('lightbox').classList.contains('show')) {
      /* While the 360 view is open the arrows pan it — jumping to the next
         photograph mid-look would be jarring. Shift+arrow still steps. */
      if (_lb360 && !ev.shiftKey && /^Arrow/.test(ev.key) && v360Key(ev)) { ev.preventDefault(); return; }
      if (ev.key === 'Escape')      { closeLightbox(); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') { lbStep(1); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft')  { lbStep(-1); ev.preventDefault(); }
      else if (ev.key === 'v' || ev.key === 'V') lbToggle360();
      else if (ev.key === 'i' || ev.key === 'I') lbToggleSide();
      else if (ev.key === 'z' || ev.key === 'Z') lbToggleZoom();
      else if (ev.key === 'p' || ev.key === 'P') lbFlag('pick');
      else if (ev.key === 'x' || ev.key === 'X') lbFlag('reject');
      else if (ev.key === 'u' || ev.key === 'U') lbFlag('none');
      else if (/^[0-5]$/.test(ev.key)) { const r = state.images.find(i => i.id === _lbId); if (r) setRating([r], +ev.key), renderLightbox(); }
      return;
    }

    const cols = gridColumns();
    switch (ev.key) {
      case 'ArrowRight': moveCursor(1, ev.shiftKey); ev.preventDefault(); break;
      case 'ArrowLeft':  moveCursor(-1, ev.shiftKey); ev.preventDefault(); break;
      case 'ArrowDown':  moveCursor(cols, ev.shiftKey); ev.preventDefault(); break;
      case 'ArrowUp':    moveCursor(-cols, ev.shiftKey); ev.preventDefault(); break;
      case 'Home':       state.cursor = null; moveCursor(0, false); ev.preventDefault(); break;
      case ' ':          if (state.cursor) { openLightbox(state.cursor); ev.preventDefault(); } break;
      case 'Enter':      if (state.cursor) { openLightbox(state.cursor); ev.preventDefault(); } break;
      case 'Delete': case 'Backspace': removeSelection(); ev.preventDefault(); break;
      case 'a': case 'A': if (ev.metaKey || ev.ctrlKey) { selectAll(); ev.preventDefault(); } break;
      case 'p': case 'P': flagSelection('pick'); break;
      case 'x': case 'X': flagSelection('reject'); break;
      case 'u': case 'U': flagSelection('none'); break;
      case 'Escape':     selectNone(); break;
      default:
        if (/^[0-5]$/.test(ev.key)) rateSelection(+ev.key);
    }
  });
}


/* ═══════════════════════════════════════════════════════════════════════════
   NON-DESTRUCTIVE EDITS
   ---------------------------------------------------------------------------
   An edit is a RECIPE stored on the image record, never a rewritten file. The
   original bytes in the library are the ones that were imported, and they stay
   that way; the recipe is replayed whenever pixels are needed — the lightbox,
   a re-rendered thumbnail, an export.

   That matters here beyond convenience. These images feed a colour-measurement
   pipeline, so an edit that silently became the file would quietly invalidate
   every number downstream. Instead: edited images carry a visible badge, the
   recipe travels in the metadata CSV, and an export that contains edited images
   says so before it runs.
   ═══════════════════════════════════════════════════════════════════════════ */

const EDIT_DEFAULTS = {
  rot: 0, flipH: false, flipV: false,
  crop: null,            // {x,y,w,h} as fractions of the source, applied before rotation
  maxDim: null,          // downscale so the long side is at most this
  ev: 0,                 // exposure, stops
  contrast: 0,           // −100…100
  sat: 0,                // −100…100
  temp: 0,               // −100…100  cool → warm
  tint: 0,               // −100…100  green → magenta
};
function emptyEdits() { return Object.assign({}, EDIT_DEFAULTS); }
function hasEdits(r) {
  const e = r && r.edits;
  if (!e) return false;
  for (const k in EDIT_DEFAULTS) {
    if (k === 'crop') { if (e.crop) return true; continue; }
    if (e[k] !== EDIT_DEFAULTS[k] && e[k] != null) return true;
  }
  return false;
}
function editSummary(e) {
  if (!e) return '';
  const bits = [];
  if (e.rot)      bits.push(`rotate ${e.rot}°`);
  if (e.flipH)    bits.push('flip H');
  if (e.flipV)    bits.push('flip V');
  if (e.crop)     bits.push(`crop ${(e.crop.w * 100).toFixed(0)}×${(e.crop.h * 100).toFixed(0)}%`);
  if (e.maxDim)   bits.push(`resize ≤${e.maxDim}px`);
  if (e.ev)       bits.push(`exposure ${e.ev > 0 ? '+' : ''}${e.ev.toFixed(2)} EV`);
  if (e.contrast) bits.push(`contrast ${e.contrast > 0 ? '+' : ''}${e.contrast}`);
  if (e.sat)      bits.push(`saturation ${e.sat > 0 ? '+' : ''}${e.sat}`);
  if (e.temp)     bits.push(`temp ${e.temp > 0 ? '+' : ''}${e.temp}`);
  if (e.tint)     bits.push(`tint ${e.tint > 0 ? '+' : ''}${e.tint}`);
  return bits.join('; ');
}
/* True when the recipe changes pixel GEOMETRY — the test for whether an
   original EXIF block can honestly be carried into an exported file. */
function editsChangeGeometry(e) {
  return !!(e && (e.rot || e.flipH || e.flipV || e.crop || e.maxDim));
}
function editsChangeColour(e) {
  return !!(e && (e.ev || e.contrast || e.sat || e.temp || e.tint));
}

/* ── Replaying a recipe ───────────────────────────────────────────────────
   Order is crop → rotate/flip → resize → colour, and it is not arbitrary:
   cropping first means the crop box is expressed in the source's own frame
   (so it survives a later rotation change), and colour last means the tonal
   adjustments act on the pixels actually being kept. */
function renderEdits(src, e, opts) {
  opts = opts || {};
  const W0 = src.width, H0 = src.height;
  e = Object.assign(emptyEdits(), e || {});

  let sx = 0, sy = 0, sw = W0, sh = H0;
  if (e.crop) {
    sx = clamp(Math.round(e.crop.x * W0), 0, W0 - 1);
    sy = clamp(Math.round(e.crop.y * H0), 0, H0 - 1);
    sw = clamp(Math.round(e.crop.w * W0), 1, W0 - sx);
    sh = clamp(Math.round(e.crop.h * H0), 1, H0 - sy);
  }

  const swap = (e.rot === 90 || e.rot === 270);
  let outW = swap ? sh : sw, outH = swap ? sw : sh;

  let scale = 1;
  const cap = opts.maxDim || e.maxDim;
  if (cap) scale = Math.min(1, cap / Math.max(outW, outH));
  outW = Math.max(1, Math.round(outW * scale));
  outH = Math.max(1, Math.round(outH * scale));

  const cv = document.createElement('canvas');
  cv.width = outW; cv.height = outH;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingQuality = 'high';
  cx.save();
  cx.translate(outW / 2, outH / 2);
  if (e.rot) cx.rotate(e.rot * Math.PI / 180);
  cx.scale(e.flipH ? -1 : 1, e.flipV ? -1 : 1);
  const dw = (swap ? outH : outW), dh = (swap ? outW : outH);
  cx.drawImage(src, sx, sy, sw, sh, -dw / 2, -dh / 2, dw, dh);
  cx.restore();

  if (editsChangeColour(e)) applyColourAdjust(cx, outW, outH, e);
  return cv;
}

/* Exposure is applied in LINEAR light (de-gamma, scale, re-gamma), which is
   what a stop actually means. Contrast, temperature and tint act in display
   space, where they behave the way the sliders in a photo app do. All three
   are folded into one 256-entry per-channel table so the pixel loop stays a
   lookup; saturation needs the other channels, so it runs after. */
function applyColourAdjust(cx, w, h, e) {
  const img = cx.getImageData(0, 0, w, h);
  const d = img.data;

  const gain = Math.pow(2, e.ev || 0);
  const k = (e.contrast || 0) / 100;
  const cK = k >= 0 ? 1 + k * 1.5 : 1 + k;                    // −100 → flat, +100 → 2.5×
  const t = (e.temp || 0) / 100, ti = (e.tint || 0) / 100;
  const chGain = [1 + 0.35 * t, 1 - 0.22 * ti, 1 - 0.35 * t]; // warm lifts R drops B; tint trades G against R/B
  chGain[1] *= 1 + 0.0 * ti;

  const lin  = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const gam  = c => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(Math.max(0, c), 1 / 2.4) - 0.055);

  const lut = [new Uint8ClampedArray(256), new Uint8ClampedArray(256), new Uint8ClampedArray(256)];
  for (let ch = 0; ch < 3; ch++) {
    for (let v = 0; v < 256; v++) {
      let x = gam(clamp(lin(v / 255) * gain, 0, 4));   // exposure, in linear light
      x = clamp(x * chGain[ch], 0, 1);                 // white-balance gain
      x = clamp((x - 0.5) * cK + 0.5, 0, 1);           // contrast about mid-grey
      lut[ch][v] = Math.round(x * 255);
    }
  }
  const s = 1 + (e.sat || 0) / 100;
  const doSat = Math.abs(s - 1) > 1e-6;
  for (let i = 0; i < d.length; i += 4) {
    let r = lut[0][d[i]], g = lut[1][d[i + 1]], b = lut[2][d[i + 2]];
    if (doSat) {
      const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;   // Rec.709 luma, so saturation holds brightness
      r = y + (r - y) * s; g = y + (g - y) * s; b = y + (b - y) * s;
    }
    d[i] = r; d[i + 1] = g; d[i + 2] = b;
  }
  cx.putImageData(img, 0, 0);
}

/* ── Loading originals ────────────────────────────────────────────────────
   Bitmaps are heavy, so a tiny cache keeps the last few so that stepping back
   and forth in the lightbox does not re-decode every time. */
const _bmpCache = new Map();
const BMP_CACHE_MAX = 4;
async function originalBitmap(id) {
  if (_bmpCache.has(id)) { const b = _bmpCache.get(id); _bmpCache.delete(id); _bmpCache.set(id, b); return b; }
  /* sourceBlob, not dbGet('blobs') — an image in a folder project has no
     stored blob at all; its bytes are on disk. Both callers funnelled through
     here already, which is why the folder store needed exactly one seam. */
  const blob = await sourceBlob(id);
  if (!blob) return null;
  const bmp = await createImageBitmap(blob);
  _bmpCache.set(id, bmp);
  while (_bmpCache.size > BMP_CACHE_MAX) {
    const k = _bmpCache.keys().next().value;
    const v = _bmpCache.get(k); v.close && v.close();
    _bmpCache.delete(k);
  }
  return bmp;
}
async function originalBytes(id) {
  const blob = await sourceBlob(id);
  return blob ? new Uint8Array(await blob.arrayBuffer()) : null;
}

/* After an edit is committed, the cached thumbnail no longer shows the truth. */
async function regenerateThumb(rec) {
  const bmp = await originalBitmap(rec.id);
  if (!bmp) return;
  const cv = renderEdits(bmp, rec.edits, { maxDim: THUMB_MAX });
  const blob = await canvasToBlob(cv, 'image/jpeg', 0.82);
  await dbPut('thumbs', { id: rec.id, blob });
  rec.tw = cv.width; rec.th = cv.height;
  dropThumb(rec.id);
}

/* ══════════ The working recipe (what the sliders drive) ══════════ */
let workEdits = emptyEdits();
let _previewTimer = null;

/* Called on every inspector rebuild. It must NOT wipe a recipe the user is in
   the middle of composing: the common workflow is to dial in an adjustment on
   one frame, then extend the selection to the rest of the set and apply. So a
   non-default recipe survives while the Edit panel is open, and is only
   replaced when the panel is closed or nothing has been dialled in. */
function loadWorkEdits() {
  const recs = targetRecs();
  const inProgress = inspOpen.edit && hasEdits({ edits: workEdits });
  if (inProgress) return;
  workEdits = (recs.length === 1 && recs[0].edits) ? Object.assign(emptyEdits(), recs[0].edits) : emptyEdits();
}
function setEdit(key, val) {
  workEdits[key] = val;
  const el = $('ev_' + key + '_val');
  if (el) el.textContent = editValLabel(key, val);
  schedulePreview();
  const ap = $('applyEditsBtn');
  if (ap) ap.disabled = false;
}
function editValLabel(key, v) {
  if (key === 'ev') return (v > 0 ? '+' : '') + (+v).toFixed(2);
  if (key === 'maxDim') return v ? v + 'px' : 'off';
  return (v > 0 ? '+' : '') + v;
}
function schedulePreview() {
  clearTimeout(_previewTimer);
  _previewTimer = setTimeout(drawEditPreview, 90);
}
async function drawEditPreview() {
  const cv = $('editPreview');
  if (!cv) return;
  const recs = targetRecs();
  if (!recs.length) return;
  const rec = recs.find(r => r.id === state.cursor) || recs[0];
  const bmp = await originalBitmap(rec.id);
  if (!bmp) return;
  const out = renderEdits(bmp, workEdits, { maxDim: 300 });
  cv.width = out.width; cv.height = out.height;
  cv.getContext('2d').drawImage(out, 0, 0);
  const lbl = $('editPreviewLbl');
  if (lbl) lbl.textContent = `${out.width}×${out.height} · ${escapeHtml(rec.name)}`;
}

async function applyEdits() {
  const recs = targetRecs();
  if (!recs.length) return;
  const anyEquirect = recs.some(r => r.w && r.h && Math.abs(r.w / r.h - 2) < 0.02);
  const geom = editsChangeGeometry(workEdits);

  const run = async () => {
    state.job = { cancel: false };
    setStatus(`Applying edits to ${recs.length} image${recs.length === 1 ? '' : 's'}…`, 'progress');
    for (let i = 0; i < recs.length; i++) {
      if (state.job.cancel) break;
      recs[i].edits = Object.assign(emptyEdits(), workEdits);
      recs[i].editedAt = Date.now();
      await regenerateThumb(recs[i]);
      setProgress((i + 1) / recs.length);
      if (i % 3 === 0) await sleep(0);
    }
    state.job = null;
    await saveImages(recs);
    render();
    setStatus(`Edits applied to ${recs.length} image${recs.length === 1 ? '' : 's'}. Originals are unchanged — clear the recipe at any time.`, 'success', 7000);
  };

  if (geom && anyEquirect) {
    /* The Analyzer maps y across the FULL image height to get elevation. A cropped
       or rotated equirectangular frame therefore reports the wrong sky geometry —
       silently. This is the one warning worth interrupting for. */
    openModal('Geometry change on equirectangular imagery',
      `<div class="danger-note"><b>At least one selected image is 2:1 (equirectangular).</b>
        Cropping, rotating or resizing an equirectangular frame breaks the mapping between pixel row and
        sky elevation that the Batch Image Analyzer relies on. Analysing the edited version will produce
        wrong elevation, solid-angle weighting and scattering-angle results — without any error message.</div>
       <p style="margin-top:.7rem">If you need a sub-region for analysis, use <b>Image Cutter</b> with its
       <i>Full source canvas</i> export, which keeps the geometry intact.</p>
       <p class="note" style="margin-top:.6rem">Edits here stay non-destructive and the affected images will be
       badged <b>edited</b>, but nothing downstream can detect the geometry change on its own.</p>`,
      [{ label: 'Cancel', cls: 'btn-ghost' },
       { label: 'Apply anyway', cls: 'btn-danger', fn: run }]);
    return;
  }
  await run();
}
async function resetEdits() {
  const recs = targetRecs().filter(hasEdits);
  if (!recs.length) { workEdits = emptyEdits(); renderInspector(); return; }
  setStatus(`Clearing edits on ${recs.length} image${recs.length === 1 ? '' : 's'}…`, 'progress');
  for (const r of recs) { r.edits = null; r.editedAt = null; await regenerateThumb(r); }
  await saveImages(recs);
  workEdits = emptyEdits();
  render();
  setStatus('Edits cleared.', 'success', 4000);
}

/* ── Renaming ─────────────────────────────────────────────────────────────
   Renaming affects the library's name for the file, and the name used on
   export. The original filename is kept in `origName` forever, so a rename is
   never a loss of provenance. */
function applyRenamePattern(recs, pattern, startAt) {
  const ds = dsById(state.curDs);
  let n = startAt || 1;
  const width = String(recs.length + (startAt || 1) - 1).length;
  return recs.map(r => {
    const d = r.dateMs ? new Date(r.dateMs) : null;
    const p = x => String(x).padStart(2, '0');
    const out = pattern
      .replace(/\{name\}/g, stemOf(r.origName))
      .replace(/\{n\}/g, String(n).padStart(width, '0'))
      .replace(/\{dataset\}/g, ds ? ds.name : '')
      .replace(/\{date\}/g, d ? `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` : 'nodate')
      .replace(/\{time\}/g, d ? `${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}` : 'notime')
      .replace(/\{w\}/g, r.w).replace(/\{h\}/g, r.h)
      .replace(/[\/\\:*?"<>|]/g, '_');
    n++;
    return out + '.' + extOf(r.origName);
  });
}


/* ═══════════════════════════════════════════════════════════════════════════
   INSPECTOR
   The right-hand panel. Its content depends on what is selected: nothing (the
   dataset itself), one image (everything known about it), or several (what
   they share, plus the batch tools).
   ═══════════════════════════════════════════════════════════════════════════ */

/* The inspector is rebuilt from scratch on every selection change, so the
   open/closed state of its <details> sections has to be remembered explicitly —
   otherwise opening Edit and then shift-clicking a few more images slams the
   panel shut mid-adjustment. */
const inspOpen = { edit: false, exif: true, metrics: false, organise: false, export: false, colour: false, dscolour: true, solar: true };
function inspToggle(k, v) { inspOpen[k] = v; }
const _op = k => inspOpen[k] ? ' open' : '';

function renderInspector() {
  const body = $('inspBody'), title = $('inspTitle');
  if (!state.inspectorOpen) return;

  if (!state.curDs) {
    title.textContent = 'Library';
    body.innerHTML = libraryOverviewHtml();
    return;
  }
  const recs = targetRecs();
  const ds = dsById(state.curDs);

  if (!recs.length) {
    title.textContent = 'Dataset';
    body.innerHTML = datasetPanelHtml(ds);
    return;
  }
  title.textContent = recs.length === 1 ? 'Image' : `${recs.length} images`;
  body.innerHTML =
    (recs.length === 1 ? singleImageHtml(recs[0]) : multiImageHtml(recs)) +
    curationHtml(recs) +
    editPanelHtml(recs) +
    organiseHtml(recs) +
    exportPanelHtml(recs);

  loadWorkEdits();
  syncEditControls();
  drawEditPreview();
  fillInspectorPreview(recs);
}

async function fillInspectorPreview(recs) {
  const img = $('inspThumb');
  if (!img) return;
  const url = await thumbURL((recs.find(r => r.id === state.cursor) || recs[0]).id);
  if (url) img.src = url;
}

/* ── Library overview (no dataset open) ──────────────────────────────────── */
function libraryOverviewHtml() {
  const totalImgs = state.datasets.reduce((s, d) => s + (d.count || 0), 0);
  return projectActivityHtml() + `<div class="insp-sec">
      <div class="h">Library</div>
      <dl class="kv">
        <dt>Projects</dt><dd>${state.projects.length}</dd>
        <dt>Datasets</dt><dd>${state.datasets.length}</dd>
        <dt>Images</dt><dd>${totalImgs}</dd>

    </div>
    <div class="insp-sec">
